name: Build Hungarian 1.6.0rc RoundedMod battery fix

on:
  workflow_dispatch:
  push:
    branches: [hungarian-hyphenation]
    paths:
      - '.github/workflows/build-hungarian-v1.6.0rc-roundedmod-batteryfix.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out integrated Hungarian branch
        uses: actions/checkout@v6
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Fix restored RoundedRaff battery rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/themes/roundedraff/RoundedRaffTheme.cpp')
          s = p.read_text()
          if '#include <HalPowerManager.h>\n' not in s:
              s = s.replace('#include <HalGPIO.h>\n', '#include <HalGPIO.h>\n#include <HalPowerManager.h>\n', 1)

          old = '''  drawBatteryRight(renderer,
                   Rect{batteryIconX, rect.y + 14, RoundedRaffMetrics::values.batteryWidth,
                        RoundedRaffMetrics::values.batteryHeight},
                   showBatteryPercentage);
'''
          new = '''  const Rect batteryRect{batteryIconX, rect.y + 14, RoundedRaffMetrics::values.batteryWidth,
                         RoundedRaffMetrics::values.batteryHeight};
  const uint16_t batteryPercentage = powerManager.getBatteryPercentage();
  drawBatteryOutline(renderer, batteryRect.x, batteryRect.y, batteryRect.width, batteryRect.height);
  fillBatteryIcon(renderer, batteryRect, batteryPercentage);
  if (showBatteryPercentage) {
    const std::string percentageText = std::to_string(batteryPercentage) + "%";
    const int percentageWidth = renderer.getTextWidth(SMALL_FONT_ID, percentageText.c_str());
    renderer.drawText(SMALL_FONT_ID, batteryRect.x - batteryPercentSpacing - percentageWidth, batteryRect.y,
                      percentageText.c_str());
  }
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const Rect batteryRect{' not in s:
              raise SystemExit('RoundedRaff battery marker not found')
          p.write_text(s)
          PY
          git diff --check

      - name: Install clang-format 21
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-21
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-21 100

      - name: Normalize formatting and commit
        run: |
          ./bin/clang-format-fix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/themes/roundedraff/RoundedRaffTheme.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'Fix restored RoundedRaff battery rendering'
            git push origin HEAD:agent/hungarian-integrated-v1.6.0rc
          fi

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build X4 release-candidate firmware
        run: pio run -e gh_release_rc

      - name: Check firmware size
        run: |
          python - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          size = fw.stat().st_size
          print(f'firmware.bin: {size} bytes ({size / 1024:.1f} KiB)')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: crosspoint-hungarian-1.6.0rc-x4-roundedmod-batteryfix
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
