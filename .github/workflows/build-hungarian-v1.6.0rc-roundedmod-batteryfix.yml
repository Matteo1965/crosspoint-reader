name: Build Hungarian 1.6.0rc RoundedMod battery fix

'on':
  workflow_dispatch:
  push:
    branches:
      - hungarian-hyphenation
    paths:
      - .github/workflows/build-hungarian-v1.6.0rc-roundedmod-batteryfix.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out integrated Hungarian branch
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          submodules: recursive

      - name: Verify RoundedRaff battery compatibility helper
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/themes/roundedraff/RoundedRaffBatteryCompat.cpp
          grep -q 'void drawBatteryRight' src/components/themes/roundedraff/RoundedRaffTheme.h
          grep -q 'void drawBatteryRight' src/components/themes/roundedraff/RoundedRaffBatteryCompat.cpp

      - name: Install clang-format 21
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-21 cmake ninja-build

      - name: Normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --check

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install PlatformIO Core
        shell: bash
        run: |
          set -euo pipefail
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build X4 release-candidate firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Check firmware size
        shell: bash
        run: |
          set -euo pipefail
          test -f .pio/build/gh_release_rc/firmware.bin
          ls -lh .pio/build/gh_release_rc/firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-hungarian-1.6.0rc-x4-roundedmod-batteryfix
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
