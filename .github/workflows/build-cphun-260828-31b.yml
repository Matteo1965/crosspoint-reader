name: Build CPHUN-260828-31 Agreed Tracking Scale 500-200

on:
  push:
    branches:
      - agent/cphun-260827-19-typography
    paths:
      - tools/cphun_31_fix_tracking_scale_500_200.py
      - .github/workflows/build-cphun-260828-31b.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260828-31
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout typography branch
        uses: actions/checkout@v4
        with:
          ref: agent/cphun-260827-19-typography
          submodules: recursive
          fetch-depth: 0

      - name: Verify mistaken CPHUN-31 baseline
        run: |
          set -euo pipefail
          grep -q '0, 360, 330, 300, 270, 240, 210, 180' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'uint16_t letterSpacingLimitPercent;' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.h
          grep -q 'Beágyazott elválasztás (Soft hyphen)' src/activities/settings/CrossPointVersionActivity.cpp
          grep -q 'CPHUN-260828-31' src/CPHUNBuildId.h

      - name: Apply agreed CPHUN-31 tracking scale
        run: |
          set -euo pipefail
          python3 tools/cphun_31_fix_tracking_scale_500_200.py
          git diff --check
          grep -q '0, 500, 450, 400, 350, 300, 250, 200' src/activities/settings/TextSettingsActivity.cpp
          grep -q '500, 450, 400, 350, 300, 250, 200' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'letterSpacingLimitPercent != 200' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 250' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 350' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 400' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 450' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 500' src/CrossPointSettings.cpp
          ! grep -q '0, 360, 330, 300, 270, 240, 210, 180' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'Beágyazott elválasztás (Soft hyphen)' src/activities/settings/CrossPointVersionActivity.cpp
          grep -q 'letterSpacingPx = 1' lib/Epub/Epub/ParsedText.cpp
          ! grep -q 'letterSpacingPx = 2' lib/Epub/Epub/ParsedText.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test -j2

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Commit validated agreed CPHUN-260828-31 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          git add src/activities/settings/TextSettingsActivity.cpp src/CrossPointSettings.cpp
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-260828-31: use agreed 500-200 tracking scale"
            git push origin HEAD:agent/cphun-260827-19-typography
          fi

      - name: Upload corrected CPHUN-260828-31 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260828-31-Tracking-Scale-500-200-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
