name: Build CPHUN-99 Metadata Columns and Bookmark24

on:
  push:
    branches: [agent/cphun-99-metadata-columns-bookmark24]
    paths:
      - '.github/workflows/build-cphun-99-metadata-columns-bookmark24.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-99-metadata-columns-bookmark24
          submodules: recursive
          fetch-depth: 0

      - name: Integrate CPHUN-99
        run: |
          if grep -q 'CPHUN-260911-98' src/CPHUNBuildId.h; then
            python3 tools/cphun99_metadata_columns_bookmark24_patch.py
          else
            echo 'CPHUN-99 source changes already integrated; keeping verified source.'
          fi
          git diff --check

      - name: Verify CPHUN-99 scope
        run: |
          grep -q 'CPHUN-260911-99' src/CPHUNBuildId.h
          grep -q 'METADATA_VALUE_X = 184' src/activities/reader/BookInfoActivity.cpp
          grep -q 'text_ +=.*\\t' src/activities/reader/BookInfoActivity.cpp
          grep -q 'add("Sorozat:"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'add("Sorozatszám:"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'metadataValueWidth' src/activities/reader/BookInfoActivity.cpp
          grep -q 'renderer.drawText(NOTOSERIF_14_FONT_ID, METADATA_VALUE_X' src/activities/reader/BookInfoActivity.cpp
          grep -q 'line.metadataFieldEnd.*y += 6' src/activities/reader/BookInfoActivity.cpp
          grep -q 'Formátum:' src/activities/reader/BookInfoActivity.cpp
          grep -q 'bookmarkStatusIconWidth = 24' src/components/themes/BaseTheme.cpp
          grep -q 'bookmarkStatusIconHeight = 24' src/components/themes/BaseTheme.cpp
          grep -q 'renderer.getScreenWidth() - bookmarkStatusIconWidth, 0' src/components/themes/BaseTheme.cpp
          grep -q 'size: 24x24' src/components/icons/bookmark.h
          grep -q '0x40, 0x00, 0x00, 0x60' src/components/icons/bookmark.h

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - name: Commit verified CPHUN-99 source changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/CPHUNBuildId.h \
                    src/activities/reader/BookInfoActivity.h \
                    src/activities/reader/BookInfoActivity.cpp \
                    src/components/themes/BaseTheme.cpp \
                    src/components/icons/bookmark.h
            git commit -m "CPHUN-99: align metadata values and enlarge bookmark marker"
            git push origin HEAD:agent/cphun-99-metadata-columns-bookmark24
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-99 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-99 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260911-99-Metadata-Columns-Bookmark24-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
