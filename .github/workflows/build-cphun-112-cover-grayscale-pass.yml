name: Build CPHUN-112 Cover Grayscale Pass

on:
  push:
    branches: [agent/cphun-112-cover-grayscale-pass]
    paths:
      - '.github/workflows/build-cphun-112-cover-grayscale-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-112-cover-grayscale-pass
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-110 clean cover patch
        run: python3 tools/cphun110_cover_dither_clean_patch.py

      - name: Apply CPHUN-111 4-gray Floyd patch
        run: python3 tools/cphun111_cover_4gray_floyd_patch.py

      - name: Apply CPHUN-112 grayscale display patch
        run: python3 tools/cphun112_cover_grayscale_pass_patch.py

      - name: Verify CPHUN-112 scope
        run: |
          git diff --check
          grep -q 'CPHUN-260913-112' src/CPHUNBuildId.h
          grep -q 'getBookCoverViewBmpPath' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'generateBookCoverViewBmp' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'jpegFileToFloydSteinbergBmpStream' lib/JpegToBmpConverter/JpegToBmpConverter.cpp
          grep -q 'pngFileToFloydSteinbergBmpStream' lib/PngToBmpConverter/PngToBmpConverter.cpp
          grep -q 'displayGrayscaleBase(HalDisplay::HALF_REFRESH)' src/activities/util/BmpViewerActivity.cpp
          grep -q 'GfxRenderer::GRAYSCALE_LSB' src/activities/util/BmpViewerActivity.cpp
          grep -q 'GfxRenderer::GRAYSCALE_MSB' src/activities/util/BmpViewerActivity.cpp
          grep -q 'displayGrayBuffer()' src/activities/util/BmpViewerActivity.cpp
          git diff -- lib/JpegToBmpConverter lib/PngToBmpConverter lib/Epub src/activities/reader/EpubReaderActivity.cpp src/activities/util/BmpViewerActivity.cpp

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-112 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-112 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260913-112-Cover-Grayscale-Pass-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
