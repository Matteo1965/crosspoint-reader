name: Build CPHUN-62R3 Layout Fit 40px

on:
  push:
    branches: [agent/cphun-62r2-layout-fit]
    paths: ['.github/workflows/build-cphun-62r2-layout-fit.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260906-62R3
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-62r2-layout-fit
          submodules: recursive
          fetch-depth: 0

      - name: Apply measured 40px Layout row height
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/activities/settings/TextSettingsActivity.cpp')
          s = p.read_text()
          if 'props.rowHeight = 24;' in s:
              s = s.replace('props.rowHeight = 24;', 'props.rowHeight = 40;', 1)
          elif 'props.rowHeight = 40;' not in s:
              raise SystemExit('Missing Layout rowHeight assignment')

          old_call = 'syncTabListViewport(screen, props, false, tab_ == Tab::Layout ? 24 : 0);'
          new_call = 'syncTabListViewport(screen, props, false, tab_ == Tab::Layout ? 40 : 0);'
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          elif new_call not in s:
              raise SystemExit('Missing effective Layout row-height override call')
          p.write_text(s)

          Path('src/CPHUNBuildId.h').write_text(
              '#pragma once\n\n#define CPHUN_BUILD_ID "CPHUN-260906-62R3"\n')
          PY

          grep -F 'props.rowHeight = 40;' src/activities/settings/TextSettingsActivity.cpp
          grep -F 'tab_ == Tab::Layout ? 40 : 0' src/activities/settings/TextSettingsActivity.cpp
          grep -F 'int16_t rowHeightOverride = 0' src/activities/UiTabListActivity.h
          grep -F 'if (rowHeightOverride > 0)' src/activities/UiTabListActivity.cpp
          grep -F 'rowHeight = rowHeightOverride;' src/activities/UiTabListActivity.cpp
          grep -F '#define CPHUN_BUILD_ID "CPHUN-260906-62R3"' src/CPHUNBuildId.h

          python3 - <<'PY'
          from pathlib import Path
          s = Path('platformio.ini').read_text()
          for env in ('gh_release', 'gh_release_rc'):
              start = s.index(f'[env:{env}]')
              end = s.find('\n[', start + 1)
              block = s[start:end if end != -1 else len(s)]
              if block.count('-DCROSSPOINT_WAIT_FOR_USB_SERIAL') != 1:
                  raise SystemExit(f'{env}: USB serial wait flag missing or duplicated')
          main = Path('src/main.cpp').read_text()
          for needle in ('CROSSPOINT_WAIT_FOR_USB_SERIAL', 'delay(250);', 'Serial.begin(115200);'):
              if needle not in main:
                  raise SystemExit(f'USB serial regression guard failed: {needle}')
          PY

          git diff --check

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-62R3 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release_rc/firmware.bin

      - name: Push validated Build 62R3 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/settings/TextSettingsActivity.cpp src/CPHUNBuildId.h
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-62R3: use 40px Layout rows on X4"
            git push origin HEAD:agent/cphun-62r2-layout-fit
          fi

      - name: Upload CPHUN-62R3 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260906-62R3-Layout-40px-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
