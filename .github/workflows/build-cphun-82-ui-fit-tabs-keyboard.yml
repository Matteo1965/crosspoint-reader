name: Build CPHUN-82 UI Fit + Weighted Tabs + Keyboard

on:
  push:
    branches: [agent/cphun-82-ui-fit-tabs-keyboard]
    paths:
      - '.github/workflows/build-cphun-82-ui-fit-tabs-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-82-ui-fit-tabs-keyboard
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-82 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('src/CPHUNBuildId.h', '#define CPHUN_BUILD_ID "CPHUN-260908-81"', '#define CPHUN_BUILD_ID "CPHUN-260909-82"')

          replace('src/activities/util/KeyboardLayoutSet.h',
                  '    const int16_t screenOffsetX = row < 3 ? 5 : (row == 3 ? 10 : (bottomRow ? -4 : 0));',
                  '    const int16_t screenOffsetX = row < 3 ? 5 : (row == 3 ? 7 : (bottomRow ? -4 : 0));')

          replace('src/activities/UiTabListActivity.h',
                  '  virtual const char* tabLabel(int index) const = 0;\n',
                  '  virtual const char* tabLabel(int index) const = 0;\n'
                  '  virtual int tabWidthPercent(int index) const {\n'
                  '    (void)index;\n'
                  '    return 0;\n'
                  '  }\n')

          replace('src/activities/UiTabListActivity.cpp',
                  '  fui::tabBar(screen.frame(), tabRect, tabProps);\n'
                  '  screen.spacer(static_cast<int16_t>(metrics.verticalSpacing));\n',
                  '  int widthTotal = 0;\n'
                  '  bool weightedTabs = count > 0;\n'
                  '  for (int i = 0; i < count; ++i) {\n'
                  '    const int width = tabWidthPercent(i);\n'
                  '    if (width <= 0) { weightedTabs = false; break; }\n'
                  '    widthTotal += width;\n'
                  '  }\n'
                  '  weightedTabs = weightedTabs && widthTotal == 100;\n'
                  '  if (weightedTabs) {\n'
                  '    int cumulative = 0;\n'
                  '    for (int i = 0; i < count; ++i) {\n'
                  '      const int width = tabWidthPercent(i);\n'
                  '      const int slotX = tabRect.x + (static_cast<int>(tabRect.width) * cumulative) / 100;\n'
                  '      cumulative += width;\n'
                  '      const int slotRight = tabRect.x + (static_cast<int>(tabRect.width) * cumulative) / 100;\n'
                  '      fui::TabBarProps singleProps = tabProps;\n'
                  '      singleProps.tabs = &tabs[i];\n'
                  '      singleProps.count = 1;\n'
                  '      fui::tabBar(screen.frame(), fui::Rect{static_cast<int16_t>(slotX), tabRect.y,\n'
                  '                  static_cast<int16_t>(slotRight - slotX), tabRect.height}, singleProps);\n'
                  '    }\n'
                  '  } else {\n'
                  '    fui::tabBar(screen.frame(), tabRect, tabProps);\n'
                  '  }\n'
                  '  screen.spacer(static_cast<int16_t>(metrics.verticalSpacing));\n')

          replace('src/activities/settings/TextSettingsActivity.h',
                  '  const char* tabLabel(int index) const override;\n',
                  '  const char* tabLabel(int index) const override;\n'
                  '  int tabWidthPercent(int index) const override;\n')

          replace('src/activities/settings/TextSettingsActivity.cpp',
                  'const char* TextSettingsActivity::tabLabel(const int index) const { return I18N.get(TAB_NAME_IDS[index]); }\n',
                  'const char* TextSettingsActivity::tabLabel(const int index) const {\n'
                  '  const char* label = I18N.get(TAB_NAME_IDS[index]);\n'
                  '  if (SETTINGS.uiTheme == CrossPointSettings::ROUNDEDRAFF &&\n'
                  '      index == static_cast<int>(Tab::Layout) && strcmp(label, "Rendez.") == 0) return "Rendezés";\n'
                  '  return label;\n'
                  '}\n\n'
                  'int TextSettingsActivity::tabWidthPercent(const int index) const {\n'
                  '  if (SETTINGS.uiTheme != CrossPointSettings::ROUNDEDRAFF) return 0;\n'
                  '  constexpr int kRoundedRaffTextTabWidths[] = {23, 23, 31, 23};\n'
                  '  return index >= 0 && index < static_cast<int>(Tab::Count) ? kRoundedRaffTextTabWidths[index] : 0;\n'
                  '}\n')

          replace('src/activities/settings/TextSettingsActivity.cpp',
                  '  props.rowHeight = 40;\n  props.rowGap = 0;\n',
                  '  const bool compactLyraLayout = tab_ == Tab::Layout &&\n'
                  '      (SETTINGS.uiTheme == CrossPointSettings::LYRA || SETTINGS.uiTheme == CrossPointSettings::LYRA_3_COVERS);\n'
                  '  const int16_t textSettingsRowHeight = compactLyraLayout ? 36 : 40;\n'
                  '  props.rowHeight = textSettingsRowHeight;\n  props.rowGap = 0;\n')
          replace('src/activities/settings/TextSettingsActivity.cpp',
                  '  syncTabListViewport(screen, props, false, 40);\n',
                  '  syncTabListViewport(screen, props, false, textSettingsRowHeight);\n')

          # Current version screen uses local lambdas. Add a mixed-weight heading helper after drawSection.
          replace('src/activities/settings/CrossPointVersionActivity.cpp',
                  '  const auto drawSection = [&](const char* title, const char* text) {\n'
                  '    drawWrapped(UI_12_FONT_ID, title, true);\n'
                  '    drawWrapped(UI_12_FONT_ID, text);\n'
                  '    y += bodyLineHeight;\n'
                  '  };\n',
                  '  const auto drawSection = [&](const char* title, const char* text) {\n'
                  '    drawWrapped(UI_12_FONT_ID, title, true);\n'
                  '    drawWrapped(UI_12_FONT_ID, text);\n'
                  '    y += bodyLineHeight;\n'
                  '  };\n\n'
                  '  const auto drawMixedSection = [&](const char* title, const char* suffix, const char* text) {\n'
                  '    renderer.drawText(UI_12_FONT_ID, x, y, title, true, EpdFontFamily::BOLD);\n'
                  '    const int suffixX = x + renderer.getTextAdvanceX(UI_12_FONT_ID, title, EpdFontFamily::BOLD);\n'
                  '    renderer.drawText(UI_12_FONT_ID, suffixX, y, suffix);\n'
                  '    y += bodyLineHeight;\n'
                  '    drawWrapped(UI_12_FONT_ID, text);\n'
                  '    y += bodyLineHeight;\n'
                  '  };\n')

          replace('src/activities/settings/CrossPointVersionActivity.cpp',
                  '    drawSection(hu ? "Beágyazott elválasztás (Soft hyphen)" : "Embedded hyphenation (Soft hyphen)",\n'
                  '                hu ? "Az EPUB-ba beágyazott feltételes elválasztások támogatása, opcionálisan aktiválható funkcióként."\n'
                  '                   : "Support for conditional hyphenation embedded in EPUB files, as an optional feature.");',
                  '    if (hu) {\n'
                  '      drawMixedSection("Beágyazott elválasztás", " (Soft hyphen)",\n'
                  '                       "Az EPUB-ba beágyazott feltételes elválasztások támogatása, opcionálisan aktiválható funkcióként.");\n'
                  '    } else {\n'
                  '      drawSection("Embedded hyphenation (Soft hyphen)",\n'
                  '                  "Support for conditional hyphenation embedded in EPUB files, as an optional feature.");\n'
                  '    }')

          replace('src/activities/settings/CrossPointVersionActivity.cpp',
                  '    drawSection(hu ? "Optikai margó (Hanging punctuation)" : "Hanging punctuation",\n'
                  '                hu ? "Az írásjelek margóba helyezésével egyenletesebb szövegszélek."\n'
                  '                   : "Places punctuation into the margin for a more even text edge.");',
                  '    if (hu) {\n'
                  '      drawMixedSection("Optikai margó", " (Hanging punctuation)",\n'
                  '                       "Az írásjelek margóba helyezésével egyenletesebb szövegszélek.");\n'
                  '    } else {\n'
                  '      drawSection("Hanging punctuation",\n'
                  '                  "Places punctuation into the margin for a more even text edge.");\n'
                  '    }')
          PY

          git diff --check

      - name: Commit CPHUN-82 source changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/CPHUNBuildId.h src/activities/UiTabListActivity.h src/activities/UiTabListActivity.cpp src/activities/settings/TextSettingsActivity.h src/activities/settings/TextSettingsActivity.cpp src/activities/settings/CrossPointVersionActivity.cpp src/activities/util/KeyboardLayoutSet.h
            git commit -m "CPHUN-82: fit Lyra layout and tune RoundedRaff tabs"
            git push origin HEAD:agent/cphun-82-ui-fit-tabs-keyboard
          fi

      - name: Verify CPHUN-82 scope
        shell: bash
        run: |
          git diff --check origin/agent/cphun-81-version-info-icons48...HEAD
          grep -q 'CPHUN-260909-82' src/CPHUNBuildId.h
          grep -q 'row == 3 ? 7' src/activities/util/KeyboardLayoutSet.h
          grep -q '23, 23, 31, 23' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'return "Rendezés"' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'compactLyraLayout' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'drawMixedSection' src/activities/settings/CrossPointVersionActivity.cpp

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-82 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-82 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260909-82-UI-Fit-Tabs-Keyboard-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90