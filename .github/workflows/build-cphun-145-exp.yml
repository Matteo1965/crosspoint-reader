name: Build CPHUN-145 EXP

on:
  push:
    branches:
      - agent/cphun-135r4b-edit-footnotes-keyboard
    paths:
      - '.github/workflows/build-cphun-145-exp.yml'
      - 'tools/build_cphun145_exp.sh'
      - 'tools/cphun145_publish_candidate_patch.py'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-135r4b-edit-footnotes-keyboard
          submodules: recursive
          fetch-depth: 0

      - name: Apply and verify CPHUN-145 EXP
        run: bash tools/build_cphun145_exp.sh

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-145 EXP firmware
        run: .venv/bin/pio run -e gh_release

      - name: Upload CPHUN-145 EXP firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260920-145-EXP-Publish-Candidate-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
