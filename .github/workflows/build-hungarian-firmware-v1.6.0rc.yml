name: Build Hungarian firmware 1.6.0rc

on:
  push:
    branches:
      - agent/hungarian-integrated-v1.6.0rc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CrossPoint
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from gen_i18n import parse_yaml_file

          root = Path("lib/I18n/translations")
          english = parse_yaml_file(root / "english.yaml")
          hungarian = parse_yaml_file(root / "hungarian.yaml")
          missing_hu = sorted(set(english) - set(hungarian))
          missing_en = sorted(set(hungarian) - set(english))
          if missing_hu or missing_en:
              raise SystemExit(f"Translation-key mismatch: missing HU={missing_hu}, missing EN={missing_en}")
          print(f"Translation keys: {len(english)} / {len(hungarian)}")
          PY

      - name: Verify Hungarian integration markers
        run: |
          test -s lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q "hu_patterns" lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q '"hungarian", "hu"' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          grep -q "Hungarian dictionary stemming v16" src/util/Dictionary.cpp
          grep -q "HU_CASE_FOLD" src/util/Dictionary.cpp
          grep -q "CrossPointVersionActivity" src/activities/settings/SettingsActivity.cpp
          grep -q "Hungarian Edition" src/activities/boot_sleep/BootActivity.cpp

      - name: Run Hungarian dictionary regressions
        run: |
          python scripts/run_hungarian_stemming_regression_v2.py
          python scripts/run_hungarian_cpp_regression_v2.py
          python scripts/run_hungarian_cpp_false_positive_regression.py

      - name: Install clang-format 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check C++ formatting
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run bin/clang-format-fix to fix formatting issues" && exit 1)

      - name: Install unit-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out CrossPoint
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build X4 release firmware
        run: pio run -e gh_release -j1

      - name: Check firmware size
        run: |
          firmware=".pio/build/gh_release/firmware.bin"
          limit=$((0x640000))
          size=$(stat --format="%s" "$firmware")
          remaining=$((limit - size))
          echo "Firmware size: $size bytes"
          echo "OTA partition: $limit bytes"
          echo "Remaining: $remaining bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Firmware exceeds the OTA partition."
            exit 1
          fi

      - name: Upload Hungarian firmware
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-Hungarian-Integrated-v1.6.0rc
          path: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
          if-no-files-found: error
          retention-days: 30
