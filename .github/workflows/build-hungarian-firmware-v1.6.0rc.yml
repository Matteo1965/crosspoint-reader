name: Build Hungarian firmware 1.6.0rc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-justification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CrossPoint
        uses: actions/checkout@v6
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0

      - name: Apply exact justification remainder distribution
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("lib/Epub/Epub/ParsedText.cpp")
          s = p.read_text()
          marker = "const int justifyRemainder ="
          if marker in s:
              print("Justification remainder fix already present")
              raise SystemExit(0)

          old = '''  const int justifyExtra = (effectiveAlignment == CssTextAlign::Justify && !isLastLine)\n                               ? computeJustifyExtra(spareSpace, actualGapCount)\n                               : 0;'''
          new = '''  const int justifyExtra = (effectiveAlignment == CssTextAlign::Justify && !isLastLine)\n                               ? computeJustifyExtra(spareSpace, actualGapCount)\n                               : 0;\n  // Integer division can leave a few pixels undistributed. Spread those remainder\n  // pixels one-by-one across the first gaps so a justified line reaches the right\n  // edge exactly instead of ending up to gapCount-1 pixels short.\n  const int justifyRemainder =\n      (effectiveAlignment == CssTextAlign::Justify && !isLastLine && actualGapCount > 0)\n          ? spareSpace - justifyExtra * static_cast<int>(actualGapCount)\n          : 0;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    const int reorderedJustifyExtra = (effectiveAlignment == CssTextAlign::Justify && !isLastLine)\n                                          ? computeJustifyExtra(reorderedSpare, reorderedGapCount)\n                                          : 0;\n\n    const int justifyContribution = (effectiveAlignment == CssTextAlign::Justify && !isLastLine)\n                                        ? reorderedJustifyExtra * static_cast<int>(reorderedGapCount)\n                                        : 0;'''
          new = '''    const int reorderedJustifyExtra = (effectiveAlignment == CssTextAlign::Justify && !isLastLine)\n                                          ? computeJustifyExtra(reorderedSpare, reorderedGapCount)\n                                          : 0;\n    const int reorderedJustifyRemainder =\n        (effectiveAlignment == CssTextAlign::Justify && !isLastLine && reorderedGapCount > 0)\n            ? reorderedSpare - reorderedJustifyExtra * static_cast<int>(reorderedGapCount)\n            : 0;\n\n    const int justifyContribution = (effectiveAlignment == CssTextAlign::Justify && !isLastLine)\n                                        ? reorderedJustifyExtra * static_cast<int>(reorderedGapCount) +\n                                              reorderedJustifyRemainder\n                                        : 0;'''
          assert old in s
          s = s.replace(old, new, 1)

          # Reordered positioning: distribute remainder pixels over actual justification gaps.
          old = '''    for (size_t wordIdx = 0; wordIdx < reorderedWidthsScratch.size(); wordIdx++) {'''
          new = '''    size_t reorderedJustifyGapIndex = 0;\n    for (size_t wordIdx = 0; wordIdx < reorderedWidthsScratch.size(); wordIdx++) {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''          advance += reorderedJustifyExtra;'''
          new = '''          advance += reorderedJustifyExtra +\n                     (static_cast<int>(reorderedJustifyGapIndex) < reorderedJustifyRemainder ? 1 : 0);\n          reorderedJustifyGapIndex++;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''          gap += reorderedJustifyExtra;'''
          new = '''          gap += reorderedJustifyExtra +\n                 (static_cast<int>(reorderedJustifyGapIndex) < reorderedJustifyRemainder ? 1 : 0);\n          reorderedJustifyGapIndex++;'''
          assert old in s
          s = s.replace(old, new, 1)

          # Standard RTL positioning.
          old = '''      for (size_t wordIdx = 0; wordIdx < lineWordCount; wordIdx++) {\n        xpos -= wordWidths[lastBreakAt + wordIdx];'''
          new = '''      size_t justifyGapIndex = 0;\n      for (size_t wordIdx = 0; wordIdx < lineWordCount; wordIdx++) {\n        xpos -= wordWidths[lastBreakAt + wordIdx];'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            advance += justifyExtra;'''
          new = '''            advance += justifyExtra +\n                       (static_cast<int>(justifyGapIndex) < justifyRemainder ? 1 : 0);\n            justifyGapIndex++;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            gap += justifyExtra;'''
          new = '''            gap += justifyExtra + (static_cast<int>(justifyGapIndex) < justifyRemainder ? 1 : 0);\n            justifyGapIndex++;'''
          assert old in s
          s = s.replace(old, new, 1)

          # Standard LTR positioning has its own gap index.
          old = '''      for (size_t wordIdx = 0; wordIdx < lineWordCount; wordIdx++) {\n        lineXPos.push_back(static_cast<int16_t>(xpos));'''
          new = '''      size_t justifyGapIndex = 0;\n      for (size_t wordIdx = 0; wordIdx < lineWordCount; wordIdx++) {\n        lineXPos.push_back(static_cast<int16_t>(xpos));'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            advance += justifyExtra;'''
          new = '''            advance += justifyExtra +\n                       (static_cast<int>(justifyGapIndex) < justifyRemainder ? 1 : 0);\n            justifyGapIndex++;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            gap += justifyExtra;'''
          new = '''            gap += justifyExtra + (static_cast<int>(justifyGapIndex) < justifyRemainder ? 1 : 0);\n            justifyGapIndex++;'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check

      - name: Commit justification fix
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Epub/Epub/ParsedText.cpp
          git commit -m "Fix justified text remainder pixel distribution"
          git push origin HEAD:agent/hungarian-integrated-v1.6.0rc

  validate:
    needs: patch-justification
    runs-on: ubuntu-latest
    steps:
      - name: Check out CrossPoint
        uses: actions/checkout@v6
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from gen_i18n import parse_yaml_file
          root = Path("lib/I18n/translations")
          english = parse_yaml_file(root / "english.yaml")
          hungarian = parse_yaml_file(root / "hungarian.yaml")
          missing_hu = sorted(set(english) - set(hungarian))
          missing_en = sorted(set(hungarian) - set(english))
          if missing_hu or missing_en:
              raise SystemExit(f"Translation-key mismatch: missing HU={missing_hu}, missing EN={missing_en}")
          print(f"Translation keys: {len(english)} / {len(hungarian)}")
          PY

      - name: Verify Hungarian integration markers
        run: |
          test -s lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q "hu_patterns" lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q '"hungarian", "hu"' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          grep -q "Hungarian dictionary stemming v16" src/util/Dictionary.cpp
          grep -q "HU_CASE_FOLD" src/util/Dictionary.cpp
          grep -q "Hungarian Edition" src/activities/boot_sleep/BootActivity.cpp
          grep -q "Magyar szótövezés: 357 új szóalak" src/activities/settings/CrossPointVersionActivity.cpp
          grep -q "homeCoverHeight = 376" src/components/themes/roundedraff/RoundedRaffTheme.h
          grep -q "homeCoverTileHeight = 400" src/components/themes/roundedraff/RoundedRaffTheme.h
          ! grep -q "STR_LONG_DOWN_SCREENSHOT" src/SettingsList.h
          ! grep -q "STR_PICTURE_FILTER" src/SettingsList.h
          ! grep -q "brightnessPercentForPicture" lib/Epub/Epub/blocks/ImageBlock.cpp
          ! grep -q "longDownScreenshot" src/main.cpp
          ! grep -q "batteryIndicator" src/components/themes/BaseTheme.cpp
          ! grep -q "HungarianImageBrightness::" src/activities/boot_sleep/SleepActivity.cpp
          ! grep -q "brightnessPercentForCover" src/activities/boot_sleep/SleepActivity.cpp
          grep -q 'STR_LAYOUT: "Rendez."' lib/I18n/translations/hungarian.yaml
          grep -q "appendHungarianExtendedBreaks" lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q "const int justifyRemainder =" lib/Epub/Epub/ParsedText.cpp

      - name: Run Hungarian dictionary regressions
        run: |
          python scripts/run_hungarian_stemming_regression_v2.py
          python scripts/run_hungarian_cpp_regression_v2.py
          python scripts/run_hungarian_cpp_false_positive_regression.py

      - name: Install clang-format 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Normalize C++ formatting
        run: PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix

      - name: Install unit-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out CrossPoint
        uses: actions/checkout@v6
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build X4 release-candidate firmware
        run: pio run -e gh_release_rc

      - name: Check firmware size
        run: |
          python - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          size = fw.stat().st_size
          print(f'firmware.bin: {size} bytes ({size / 1024:.1f} KiB)')
          PY

      - name: Upload Hungarian X4 firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: crosspoint-hungarian-1.6.0rc-x4
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
