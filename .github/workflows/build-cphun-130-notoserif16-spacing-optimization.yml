name: Build CPHUN-130 Noto Serif 16 Spacing Optimization

on:
  push:
    branches: [agent/cphun-130-notoserif16-spacing-optimization]
    paths:
      - '.github/workflows/build-cphun-130-notoserif16-spacing-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-130-notoserif16-spacing-optimization
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-110 clean cover patch
        run: python3 tools/cphun110_cover_dither_clean_patch.py

      - name: Apply CPHUN-111 4-gray Floyd patch
        run: python3 tools/cphun111_cover_4gray_floyd_patch.py

      - name: Apply CPHUN-112 grayscale display patch
        run: python3 tools/cphun112_cover_grayscale_pass_patch.py

      - name: Apply CPHUN-113 letter-spacing base patch
        run: python3 tools/cphun113_letter_spacing_scale_patch.py

      - name: Apply CPHUN-114 known-good letter-spacing patch
        run: python3 tools/cphun114_letter_spacing_scale_patch.py

      - name: Apply CPHUN-116 safe retuned scale
        run: python3 tools/cphun116_letter_spacing_scale_patch.py

      - name: Apply CPHUN-117 non-linear scale
        run: python3 tools/cphun117_letter_spacing_scale_patch.py

      - name: Apply CPHUN-118 fixed-point optimizer
        run: python3 tools/cphun118_fixedpoint_optimization_patch.py

      - name: Apply CPHUN-119 pair tuning and rounding fix
        run: python3 tools/cphun119_fixedpoint_pair_tuning_patch.py

      - name: Apply CPHUN-120 stronger accumulator intensity
        run: python3 tools/cphun120_fixedpoint_intensity_patch.py

      - name: Apply CPHUN-121 native pair advance fix
        run: python3 tools/cphun121_native_pair_advance_patch.py

      - name: Apply CPHUN-123 ink-edge right-margin fix
        run: python3 tools/cphun123_ink_edge_right_margin_patch.py

      - name: Apply CPHUN-124 dark-ink threshold
        run: python3 tools/cphun124_dark_ink_edge_patch.py

      - name: Apply CPHUN-125 RoundedRaff layout compression
        run: python3 tools/cphun125_roundedraff_text_settings_layout_patch.py

      - name: Apply CPHUN-126 NEW_DOGEAR bookmark
        run: python3 tools/cphun126_new_dogear_patch.py

      - name: Apply CPHUN-127 RoundedRaff list fit
        run: python3 tools/cphun127_roundedraff_list_fit_patch.py

      - name: Apply CPHUN-129 letter-spacing profiles
        run: python3 tools/cphun128_letter_spacing_profiles_patch.py

      - name: Apply CPHUN-129 dictionary and BookInfo UI
        run: python3 tools/cphun129_dictionary_bookinfo_ui_patch.py

      - name: Apply CPHUN-130 Noto Serif 16 optimization
        run: python3 tools/cphun130_notoserif16_spacing_optimization_patch.py

      - name: Verify CPHUN-130 scope
        run: |
          git diff --check
          grep -q 'CPHUN-260914-130-EXP' src/CPHUNBuildId.h
          grep -q 'Szótár beállítása' src/activities/settings/SettingsActivity.cpp
          grep -q 'MenuAction::DICTIONARY_SETTINGS' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q 'NOTOSANS_16_FONT_ID' src/activities/reader/BookInfoActivity.cpp
          grep -q 'NOTOSANS_14_FONT_ID, METADATA_VALUE_X' src/activities/reader/BookInfoActivity.cpp
          grep -q 'NOTOSERIF_16_OPTIMIZABLE_PAIRS' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q 'Noto Serif 16 pair table must contain 75 entries' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q 'tableForFontId(fontId)' lib/Epub/Epub/ParsedText.cpp
          grep -q 'tableForFontId(fontId)' lib/Epub/Epub/blocks/TextBlock.cpp
          grep -q 'isNotoSerif16' src/CrossPointSettings.cpp
          grep -q 'if (SETTINGS.uiTheme == CrossPointSettings::ROUNDEDRAFF) previewHeight -= 16;' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'compactRoundedRaffRows' src/activities/settings/TextSettingsActivity.cpp
          grep -q '(compactLyraLayout || compactRoundedRaffRows) ? 36 : 40;' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'const char\* options\[\] = {tr(STR_STATE_OFF), "25%", "50%", "75%", "100%"};' src/activities/settings/TextSettingsActivity.cpp
          grep -q '{4, 2, 6}' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q '{8, 3, 9}' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q '{12, 4, 12}' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q '{16, 6, 18}' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q 'wordLetterCount(text) != 3' lib/Epub/Epub/LetterSpacingOptimization.h
          grep -q 'std::min<int>(optProfile.maxPxPerLine, spareSpace - 1)' lib/Epub/Epub/ParsedText.cpp
          grep -q 'LetterSpacingOptimization::isPackedConfig(letterSpacingPx)' lib/Epub/Epub/ParsedText.cpp
          grep -q 'LetterSpacingOptimization::beginWord(text, style, \*optimizationAcc)' lib/Epub/Epub/blocks/TextBlock.cpp
          grep -q 'static const uint8_t NEW_DOGEAR_32x32\[\]' src/components/icons/bookmark.h
          grep -q 'NEW_DOGEAR_32x32\[row \* bytesPerRow + col / 8\]' src/components/themes/BaseTheme.cpp
          grep -q 'drawBookmarkStatusIcon(renderer, 448, 2);' src/components/themes/BaseTheme.cpp
          test "$(grep -o '0x[0-9A-F]\{2\}' src/components/icons/bookmark.h | wc -l)" -eq 256
          file src/components/icons/NEW_DOGEAR_32x32.bmp | grep -q 'PC bitmap, Windows 3.x format, 32 x 32 x 1'
          echo 'CPHUN-130 source diff:'
          git diff -- src/activities/settings/TextSettingsActivity.cpp src/CrossPointSettings.h src/CrossPointSettings.cpp lib/Epub/Epub/LetterSpacingOptimization.h lib/Epub/Epub/ParsedText.h lib/Epub/Epub/ParsedText.cpp lib/Epub/Epub/blocks/TextBlock.cpp src/components/icons/bookmark.h src/components/themes/BaseTheme.cpp src/CPHUNBuildId.h

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-130 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-130 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260914-130-EXP-NotoSerif16-Spacing-Optimization-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
