name: Apply Hungarian single-prefix hyphenation

'on':
  push:
    branches: [agent/hungarian-v1.6.0rc-1char-prefix]
    paths:
      - '.github/workflows/apply-hungarian-single-prefix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hungarian-v1.6.0rc-1char-prefix
          fetch-depth: 0
          submodules: recursive

      - name: Apply Hungarian 1/2 single-letter prefix rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          registry = Path('lib/Epub/Epub/hyphenation/LanguageRegistry.cpp')
          text = registry.read_text(encoding='utf-8')
          old = 'LanguageHyphenator hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin);'
          new = 'LanguageHyphenator hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 1, 2);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Hungarian hyphenator constructor marker not found')
          registry.write_text(text, encoding='utf-8')

          hyp = Path('lib/Epub/Epub/hyphenation/Hyphenator.cpp')
          s = hyp.read_text(encoding='utf-8')

          anchor = '''uint32_t asciiLower(const uint32_t cp) {
            return (cp >= 'A' && cp <= 'Z') ? cp + ('a' - 'A') : cp;
          }

          // Extended Hungarian replacement hyphenation may add a special break only
          '''
          insert = '''uint32_t asciiLower(const uint32_t cp) {
            return (cp >= 'A' && cp <= 'Z') ? cp + ('a' - 'A') : cp;
          }

          // Returns the number of Unicode codepoints occupied by one Hungarian consonant
          // grapheme starting at `start`. Multi-letter consonants (cs, dz, dzs, gy, ly,
          // ny, sz, ty, zs) count as one phonological consonant for syllable boundaries.
          size_t hungarianConsonantGraphemeLength(const std::vector<CodepointInfo>& cps, const size_t start) {
            if (start >= cps.size()) return 0;
            const uint32_t first = asciiLower(cps[start].value);
            if (!isAlphabetic(cps[start].value) || isHungarianVowel(cps[start].value)) return 0;

            const uint32_t second = start + 1 < cps.size() ? asciiLower(cps[start + 1].value) : 0;
            const uint32_t third = start + 2 < cps.size() ? asciiLower(cps[start + 2].value) : 0;

            if (first == 'd' && second == 'z' && third == 's') return 3;
            if ((first == 'c' && second == 's') || (first == 'd' && second == 'z') ||
                (first == 'g' && second == 'y') || (first == 'l' && second == 'y') ||
                (first == 'n' && second == 'y') || (first == 's' && second == 'z') ||
                (first == 't' && second == 'y') || (first == 'z' && second == 's')) {
              return 2;
            }
            return 1;
          }

          // huhyphn intentionally suppresses one-letter edge syllables for traditional
          // print typography. On a narrow e-reader, an explicit 1/x minimum means the user
          // opted into those legal breaks. Restore only the safe V-C-V case, treating
          // Hungarian digraphs/trigraphs as one consonant. Examples: a-lak, o-lyan,
          // u-gyan, A-nyámnak. Counterexamples such as em-ber, ab-lak and asz-tal stay blocked.
          void appendHungarianSingleLetterPrefixBreak(const std::vector<CodepointInfo>& cps,
                                                       const LanguageHyphenator& hyphenator,
                                                       std::vector<Hyphenator::BreakInfo>& outBreaks) {
            if (hyphenator.minPrefix() != 1 || cps.size() < 3) return;
            if (cps.size() - 1 < hyphenator.minSuffix()) return;
            if (!isHungarianVowel(cps[0].value)) return;

            const size_t consonantLen = hungarianConsonantGraphemeLength(cps, 1);
            if (consonantLen == 0) return;
            const size_t nextVowel = 1 + consonantLen;
            if (nextVowel >= cps.size() || !isHungarianVowel(cps[nextVowel].value)) return;

            outBreaks.push_back({byteOffsetForIndex(cps, 1), true});
          }

          // Extended Hungarian replacement hyphenation may add a special break only
          '''
          if 'appendHungarianSingleLetterPrefixBreak' not in s:
              if anchor not in s:
                  raise SystemExit('Hyphenator.cpp insertion anchor not found')
              s = s.replace(anchor, insert, 1)

          call_anchor = '''  std::vector<Hyphenator::BreakInfo> breaks;
            if (useHungarianExtended) {
              appendHungarianExtendedBreaks(cps, breaks);
            }
          '''
          call_repl = '''  std::vector<Hyphenator::BreakInfo> breaks;
            if (preferredLanguageIsHungarian_ && hyphenator) {
              appendHungarianSingleLetterPrefixBreak(cps, *hyphenator, breaks);
            }
            if (useHungarianExtended) {
              appendHungarianExtendedBreaks(cps, breaks);
            }
          '''
          if 'appendHungarianSingleLetterPrefixBreak(cps, *hyphenator, breaks);' not in s:
              if call_anchor not in s:
                  raise SystemExit('Hyphenator.cpp call anchor not found')
              s = s.replace(call_anchor, call_repl, 1)

          hyp.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Configure tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build focused test
        run: cmake --build build/test --target HungarianSinglePrefixTest

      - name: Run focused test
        run: build/test/hungarian_single_prefix/HungarianSinglePrefixTest

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/Epub/Epub/hyphenation/LanguageRegistry.cpp lib/Epub/Epub/hyphenation/Hyphenator.cpp; then
            echo 'Source already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/Epub/Epub/hyphenation/LanguageRegistry.cpp lib/Epub/Epub/hyphenation/Hyphenator.cpp
          git commit -m 'feat: restore Hungarian one-letter first syllables for 1/x'
          git push origin HEAD:agent/hungarian-v1.6.0rc-1char-prefix
