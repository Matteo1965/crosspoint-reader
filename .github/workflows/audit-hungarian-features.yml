name: Audit Hungarian Edition features

on:
  push:
    branches:
      - agent/hungarian-feature-audit
    paths:
      - 'scripts/audit_hungarian_features_v2.py'
      - '.github/workflows/audit-hungarian-features.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/hungarian-feature-audit
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate canonical feature report
        run: python scripts/audit_hungarian_features_v2.py

      - name: Publish audit report to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HUNGARIAN_EDITION_FEATURES.md
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
            exit 0
          fi
          git commit -m 'Publish strict Hungarian Edition feature audit v2'
          git push origin HEAD:agent/hungarian-feature-audit
