name: Build CPHUN-135r4k TOC Pagebreak Chapters

on:
  push:
    branches:
      - agent/cphun-135r4b-edit-footnotes-keyboard
    paths:
      - '.github/workflows/build-cphun-135r4k.yml'
      - 'tools/build_cphun135r4k.sh'
      - 'tools/cphun135r4k_toc_pagebreak_patch.py'
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-135r4b-edit-footnotes-keyboard
          submodules: recursive
          fetch-depth: 0

      - name: Apply and verify CPHUN-135r4k
        run: bash tools/build_cphun135r4k.sh

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-135r4k firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-135r4k firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260918-135R4K-EXP-firmware
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
