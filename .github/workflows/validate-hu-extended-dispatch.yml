name: Validate extended Hungarian hyphenation

on:
  push:
    branches:
      - hungarian-hyphenation
    paths:
      - .hu-extended-build-trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip"
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        id: fmt
        continue-on-error: true
        run: |
          ./bin/clang-format-fix
          git diff --exit-code
      - name: Build firmware
        id: build
        continue-on-error: true
        run: pio run -e gh_release
      - name: Record result on target branch
        if: always()
        run: |
          printf 'format=%s\nbuild=%s\ncommit=%s\n' '${{ steps.fmt.outcome }}' '${{ steps.build.outcome }}' "$(git rev-parse HEAD)" > .hu-extended-build-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .hu-extended-build-status
          git commit -m "Record extended Hungarian hyphenation validation" || true
          git push origin HEAD:agent/hungarian-integrated-v1.6.0rc
      - name: Fail if validation failed
        if: steps.fmt.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
