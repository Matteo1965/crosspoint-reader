name: Build CPHUN-260827-21 Letter Spacing Cache Fix

on:
  push:
    branches:
      - agent/cphun-260827-19-typography
    paths:
      - tools/cphun_21_letterspacing_cache_fix.py
      - .github/workflows/build-cphun-260827-21.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260827-21

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-260827-19-typography
          submodules: recursive
          fetch-depth: 0

      - name: Apply letter-spacing section-cache invalidation fix
        run: |
          set -euo pipefail
          python3 tools/cphun_21_letterspacing_cache_fix.py
          git diff --check
          grep -q 'SECTION_FILE_VERSION = 50' lib/Epub/Epub/Section.cpp
          grep -q 'spec.letterSpacingLimitPercent' lib/Epub/Epub/Section.cpp
          grep -q 'fileLetterSpacingLimitPercent' lib/Epub/Epub/Section.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test -j2

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Commit validated CPHUN-260827-21 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          git add lib/Epub/Epub/Section.cpp
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-260827-21: invalidate cache on letter-spacing setting"
            git push origin HEAD:agent/cphun-260827-19-typography
          fi

      - name: Upload CPHUN-260827-21 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260827-21-Typography-CacheFix-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
