name: Build CPHUN-260826-13 Integration

on:
  push:
    branches:
      - agent/cphun-260826-13
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260826-13

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-260826-13
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-260826-13 integration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          BUILD_ID = "CPHUN-260826-13"

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) CrossPoint version/info pages + build ID display.
          version = Path('src/activities/settings/CrossPointVersionActivity.cpp')
          s = version.read_text(encoding='utf-8')
          include_marker = '#include "fontIds.h"\n'
          if '#include "CPHUNBuildId.h"' not in s:
              if s.count(include_marker) != 1:
                  raise SystemExit('version include marker mismatch')
              s = s.replace(include_marker, include_marker + '#include "CPHUNBuildId.h"\n', 1)
          s = s.replace('    drawLabelValue(tr(STR_BASE_VERSION), "1.6.0rc");\n', '')
          old_build = '    drawLabelValue("CPHUN", "CPHUN-260825-06");\n'
          if old_build not in s:
              raise SystemExit('stale CPHUN build label marker not found')
          s = s.replace(old_build, '    drawWrapped(UI_12_FONT_ID, CPHUN_BUILD_ID);\n', 1)

          old_dict = '''  } else if (currentPage == 1) {\n    drawParagraph(StrId::STR_DICTIONARY_REQUIRED, true);\n    drawParagraph(StrId::STR_DICTIONARY_NOT_INCLUDED);\n    drawParagraph(StrId::STR_DICTIONARY_INSTALL_SEPARATELY);\n    drawParagraph(StrId::STR_STARDICT_FILES_INTRO);\n    renderer.drawText(UI_12_FONT_ID, x, y, ".ifo + .idx + .dict");\n    y += bodyLineHeight * 2;\n    drawWrapped(UI_12_FONT_ID, I18N.get(StrId::STR_DICTIONARY_LICENSE_NOTICE));\n  } else {\n    drawParagraph(StrId::STR_HYPHENATION_LANGUAGES, true);\n    drawParagraph(StrId::STR_HYPHENATION_LANGUAGES_NOTICE);\n    drawWrapped(UI_12_FONT_ID, I18N.get(StrId::STR_HYPHENATION_OTHER_LANGUAGES_NOTICE));\n  }\n'''
          new_dict = '''  } else if (currentPage == 1) {\n    const bool hu = I18N.getLanguage() == Language::HU;\n    if (hu) {\n      drawWrapped(UI_12_FONT_ID, "Szótár telepítése szükséges", true);\n      y += bodyLineHeight;\n      drawWrapped(UI_12_FONT_ID, "Javított magyar szótárkezelés", true);\n      y += bodyLineHeight;\n      drawWrapped(UI_12_FONT_ID,\n                  "A magyar nyelvhez külön továbbfejlesztett szótárkezelés ragozott és toldalékolt "\n                  "szóalakok esetén is segíti a megfelelő szótári címszó megtalálását.");\n    } else {\n      drawParagraph(StrId::STR_DICTIONARY_REQUIRED, true);\n      drawParagraph(StrId::STR_DICTIONARY_NOT_INCLUDED);\n      drawParagraph(StrId::STR_DICTIONARY_INSTALL_SEPARATELY);\n      drawParagraph(StrId::STR_STARDICT_FILES_INTRO);\n      renderer.drawText(UI_12_FONT_ID, x, y, ".ifo + .idx + .dict");\n      y += bodyLineHeight * 2;\n      drawWrapped(UI_12_FONT_ID, I18N.get(StrId::STR_DICTIONARY_LICENSE_NOTICE));\n    }\n  } else {\n    drawParagraph(StrId::STR_HYPHENATION_LANGUAGES, true);\n    drawParagraph(StrId::STR_HYPHENATION_LANGUAGES_NOTICE);\n    drawWrapped(UI_12_FONT_ID, I18N.get(StrId::STR_HYPHENATION_OTHER_LANGUAGES_NOTICE));\n    if (I18N.getLanguage() == Language::HU) {\n      y += bodyLineHeight;\n      drawWrapped(UI_10_FONT_ID,\n                  "A magyar elválasztás Nagy Bence Huhyphn elválasztási mintáira épül, amelyeket saját "\n                  "kiegészítéseinkkel és továbbfejlesztéseinkkel bővítettünk.");\n    }\n  }\n'''
          if s.count(old_dict) != 1:
              raise SystemExit(f'version info page block count={s.count(old_dict)}')
          s = s.replace(old_dict, new_dict, 1)
          version.write_text(s, encoding='utf-8')

          # Build ID header: generated from the build, consumed by the UI.
          Path('src/CPHUNBuildId.h').write_text(
              '#pragma once\n\n#define CPHUN_BUILD_ID "' + BUILD_ID + '"\n', encoding='utf-8')

          # 2) Margin presets: 8..36 px, step 4. Existing out-of-range stored values
          # are clamped by the normal SettingType::VALUE loader.
          replace_once('src/CrossPointSettings.h',
                       'static constexpr uint8_t SCREEN_MARGIN_MIN = 4;',
                       'static constexpr uint8_t SCREEN_MARGIN_MIN = 8;', 'margin-min')
          replace_once('src/CrossPointSettings.h',
                       'static constexpr uint8_t SCREEN_MARGIN_MAX = 32;',
                       'static constexpr uint8_t SCREEN_MARGIN_MAX = 36;', 'margin-max')

          # 3) Hungarian hyphenation default constraints back to 2/2.
          lang = Path('lib/Epub/Epub/hyphenation/LanguageRegistry.cpp')
          s = lang.read_text(encoding='utf-8')
          old = 'hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 1, 2)'
          new = 'hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 2, 2)'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Hungarian 2/2 hyphenator marker not found')
          lang.write_text(s, encoding='utf-8')

          # 4) Global Hungarian OFF optical alignment. In right-aligned value columns
          # the UI_10 space advance is 3 px, shifting visible "KI" left by 3 px.
          hu = Path('lib/I18n/translations/hungarian.yaml')
          s = hu.read_text(encoding='utf-8')
          if 'STR_STATE_OFF: "KI "' not in s:
              if s.count('STR_STATE_OFF: "KI"') != 1:
                  raise SystemExit('STR_STATE_OFF marker mismatch')
              s = s.replace('STR_STATE_OFF: "KI"', 'STR_STATE_OFF: "KI "', 1)
          hu.write_text(s, encoding='utf-8')

          # 5) Fix dialogue-space recovery and display-time Hungarian character normalization.
          parser = Path('lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp')
          s = parser.read_text(encoding='utf-8')
          missing_marker = '''    self->previousHungarianAsciiWhitespace = false;\n\n    // Skip Zero Width No-Break Space / BOM (U+FEFF) = 0xEF 0xBB 0xBF\n'''
          missing_code = '''    // U+2009 THIN SPACE after a paragraph-opening en/em dash is normalized\n    // to the same virtual dialogue boundary as normal space / NBSP.\n    const bool openingDialogueDashBuffered =\n        self->hungarianWhitespaceNormalization && self->fixedDialogueSpacing && self->currentTextBlock &&\n        self->currentTextBlock->isEmpty() && self->partWordBufferIndex == 3 &&\n        static_cast<uint8_t>(self->partWordBuffer[0]) == 0xE2 &&\n        static_cast<uint8_t>(self->partWordBuffer[1]) == 0x80 &&\n        (static_cast<uint8_t>(self->partWordBuffer[2]) == 0x93 ||\n         static_cast<uint8_t>(self->partWordBuffer[2]) == 0x94);\n    if (openingDialogueDashBuffered && static_cast<uint8_t>(s[i]) == 0xE2 && i + 2 < len &&\n        static_cast<uint8_t>(s[i + 1]) == 0x80 && static_cast<uint8_t>(s[i + 2]) == 0x89) {\n      self->flushPartWordBuffer();\n      self->nextWordContinues = false;\n      i += 2;\n      continue;\n    }\n\n    // Missing dialogue-space recovery: if text starts immediately after an\n    // opening en/em dash, split the dash into its own token. ParsedText then\n    // inserts the same fixed MinSpace-controlled dialogue gap used for well-formed EPUBs.\n    if (openingDialogueDashBuffered) {\n      self->flushPartWordBuffer();\n      self->nextWordContinues = false;\n    }\n\n    self->previousHungarianAsciiWhitespace = false;\n\n    // Skip Zero Width No-Break Space / BOM (U+FEFF) = 0xEF 0xBB 0xBF\n'''
          if 'Missing dialogue-space recovery:' not in s:
              if s.count(missing_marker) != 1:
                  raise SystemExit(f'missing-dialogue insertion marker count={s.count(missing_marker)}')
              s = s.replace(missing_marker, missing_code, 1)

          display_marker = '''    if (self->partWordBufferIndex == 0) {\n      self->partWordVisibleOffset = codepointOffset;\n    }\n    self->partWordBuffer[self->partWordBufferIndex++] = s[i];\n'''
          display_code = '''    if (self->partWordBufferIndex == 0) {\n      self->partWordVisibleOffset = codepointOffset;\n    }\n\n    // Hungarian Edition display normalization. These legacy two-byte UTF-8\n    // sequences are replaced only in the in-memory parsed text; the EPUB file\n    // itself is never modified. Byte length stays 2, so visible offsets remain stable.\n    if (self->hungarianWhitespaceNormalization && i + 1 < len &&\n        static_cast<uint8_t>(s[i]) == 0xC3) {\n      const uint8_t second = static_cast<uint8_t>(s[i + 1]);\n      uint8_t out1 = 0;\n      uint8_t out2 = 0;\n      if (second == 0xB5 || second == 0xB4) {       // õ / ô -> ő\n        out1 = 0xC5; out2 = 0x91;\n      } else if (second == 0x95 || second == 0x94) {  // Õ / Ô -> Ő\n        out1 = 0xC5; out2 = 0x90;\n      } else if (second == 0xBB) {                  // û -> ű\n        out1 = 0xC5; out2 = 0xB1;\n      } else if (second == 0x9B) {                  // Û -> Ű\n        out1 = 0xC5; out2 = 0xB0;\n      }\n      if (out1 != 0) {\n        if (self->partWordBufferIndex >= MAX_WORD_SIZE - 1) {\n          self->flushPartWordBuffer();\n          self->nextWordContinues = true;\n          self->partWordVisibleOffset = codepointOffset;\n        }\n        self->partWordBuffer[self->partWordBufferIndex++] = static_cast<char>(out1);\n        self->partWordBuffer[self->partWordBufferIndex++] = static_cast<char>(out2);\n        i++;\n        continue;\n      }\n    }\n    self->partWordBuffer[self->partWordBufferIndex++] = s[i];\n'''
          if 'Hungarian Edition display normalization.' not in s:
              if s.count(display_marker) != 1:
                  raise SystemExit(f'display normalization marker count={s.count(display_marker)}')
              s = s.replace(display_marker, display_code, 1)
          parser.write_text(s, encoding='utf-8')

          # 6) Fixed dialogue gap follows the selected Min. word spacing percentage.
          parsed = Path('lib/Epub/Epub/ParsedText.cpp')
          s = parsed.read_text(encoding='utf-8')
          dialogue_pattern = re.compile(
              r'(if \(fixedDialogueSpacing && [^\n]+isStandaloneDialogueDash\([^\n]+\)\) \{\n'
              r'(?:.|\n)*?scaledNormalSpaceAdvance\((?:.|\n)*?,\n\s+)100(\);)',
              re.MULTILINE,
          )
          s, dialogue_count = dialogue_pattern.subn(r'\g<1>minimumSpacePercent_\g<2>', s)
          if dialogue_count != 4:
              raise SystemExit(f'fixed-dialogue MinSpace restore count={dialogue_count}, expected 4')
          parsed.write_text(s, encoding='utf-8')

          # Parser/rendering semantics changed: invalidate cached sections.
          sec = Path('lib/Epub/Epub/Section.cpp')
          s = sec.read_text(encoding='utf-8')
          m = re.search(r'constexpr uint8_t SECTION_FILE_VERSION = (\d+);', s)
          if not m:
              raise SystemExit('Section.cpp: SECTION_FILE_VERSION not found')
          current = int(m.group(1))
          s = s[:m.start()] + f'constexpr uint8_t SECTION_FILE_VERSION = {current + 1};' + s[m.end():]
          sec.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Verify CPHUN-260826-13 requirements and retained baseline
        shell: bash
        run: |
          set -euo pipefail
          check() { echo "[verify] $1"; shift; "$@"; }
          check build-id grep -q '#define CPHUN_BUILD_ID "CPHUN-260826-13"' src/CPHUNBuildId.h
          check no-base-version bash -c '! grep -q "drawLabelValue(tr(STR_BASE_VERSION)" src/activities/settings/CrossPointVersionActivity.cpp'
          check no-cphun-label bash -c '! grep -q "drawLabelValue(\"CPHUN\"" src/activities/settings/CrossPointVersionActivity.cpp'
          check dictionary-title grep -q 'Szótár telepítése szükséges' src/activities/settings/CrossPointVersionActivity.cpp
          check dictionary-improved grep -q 'Javított magyar szótárkezelés' src/activities/settings/CrossPointVersionActivity.cpp
          check huhyphn-source grep -q 'Nagy Bence Huhyphn' src/activities/settings/CrossPointVersionActivity.cpp
          check missing-dialogue-label grep -q 'Hiányzó párbeszédköz automatikus pótlása' src/activities/settings/CrossPointVersionActivity.cpp
          check margin-min grep -q 'SCREEN_MARGIN_MIN = 8' src/CrossPointSettings.h
          check margin-max grep -q 'SCREEN_MARGIN_MAX = 36' src/CrossPointSettings.h
          check margin-step grep -q 'SCREEN_MARGIN_STEP = 4' src/CrossPointSettings.h
          check hu-hyphen-2-2 grep -q 'hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 2, 2)' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          check display-normalization grep -q 'Hungarian Edition display normalization' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          check missing-dialogue-recovery grep -q 'Missing dialogue-space recovery' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          check thin-space-recovery grep -q 'U+2009 THIN SPACE' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          check global-off-optical grep -q 'STR_STATE_OFF: "KI "' lib/I18n/translations/hungarian.yaml
          check minspace-menu grep -q 'MinimumSpace' src/activities/settings/TextSettingsActivity.h
          check minspace-label grep -q 'Min. szóköz' src/activities/settings/TextSettingsActivity.cpp
          check optical-margin grep -q 'prefixWithoutPunctuation' lib/Epub/Epub/ParsedText.cpp
          check roundedraff-cover grep -q 'homeCoverHeight = 376' src/components/themes/roundedraff/RoundedRaffTheme.h
          check roundedraff-tile grep -q 'homeCoverTileHeight = 400' src/components/themes/roundedraff/RoundedRaffTheme.h
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('lib/Epub/Epub/ParsedText.cpp').read_text(encoding='utf-8')
          starts = [m.start() for m in re.finditer(r'if \(fixedDialogueSpacing && [^\n]+isStandaloneDialogueDash\([^\n]+\)\) \{', s)]
          if len(starts) != 4:
              raise SystemExit(f'expected 4 fixed-dialogue paths, got {len(starts)}')
          for idx, start in enumerate(starts, 1):
              window = s[start:start + 900].split('} else', 1)[0]
              if 'minimumSpacePercent_' not in window:
                  raise SystemExit(f'fixed-dialogue path {idx} does not follow MinSpace')
          if 'blockStyle.alignment == CssTextAlign::Justify ? minimumSpacePercent_ : 100' not in s:
              raise SystemExit('ordinary justified/left MinSpace rule regressed')
          PY

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build unit tests
        run: cmake --build build/test
      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"
      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc
      - name: Show firmware size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          print(f'firmware.bin: {fw.stat().st_size} bytes ({fw.stat().st_size / 1024:.1f} KiB)')
          PY
      - name: Upload CPHUN-260826-13 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260826-13-Integration-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          rm -f .github/workflows/build-cphun-260826-13.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-260826-13: integrate Aug 26 UI and text fixes"
            git push origin HEAD:agent/cphun-260826-13
          fi
