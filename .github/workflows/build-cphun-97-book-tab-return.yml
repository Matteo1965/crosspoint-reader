name: Build CPHUN-97 Metadata and Navigation

on:
  push:
    branches: [agent/cphun-97-book-tab-return]
    paths:
      - '.github/workflows/build-cphun-97-book-tab-return.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-97-book-tab-return
          submodules: recursive
          fetch-depth: 0

      - name: Integrate revised CPHUN-97
        run: |
          if grep -q 'CPHUN-260911-96' src/CPHUNBuildId.h; then
            # The repository also has a third, unrelated openReaderMenu(true)
            # callback. Validate the two callbacks changed by this patch rather
            # than globally counting every true callback in the reader.
            python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/cphun97_book_tab_return_patch.py')
          text = path.read_text()
          old = '''already = reader.count("[this](const ActivityResult&) { openReaderMenu(true); });")
          if already != 2:
              raise SystemExit(f"BookInfo return callbacks: expected 2 final callbacks, found {already} (changed {changed})")'''
          new = '''if changed != 2:
              raise SystemExit(f"BookInfo return callbacks: expected 2 targeted changes, found {changed}")'''
          if old not in text:
              raise SystemExit('Expected legacy callback validation block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
            python3 tools/cphun97_book_tab_return_patch.py
            python3 tools/cphun97_metadata_hotfix.py
          else
            echo 'CPHUN-97 source changes already integrated; keeping verified source.'
          fi
          git diff --check

      - name: Verify CPHUN-97 scope
        run: |
          grep -q 'CPHUN-260911-97' src/CPHUNBuildId.h
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('src/activities/reader/EpubReaderActivity.cpp').read_text()
          for page in ('Description', 'Metadata'):
              pattern = re.compile(
                  rf'BookInfoActivity::Page::{page}\),\s*\n\s*'
                  r'\[this\]\(const ActivityResult&\) \{ openReaderMenu\(true\); \}\);'
              )
              if not pattern.search(text):
                  raise SystemExit(f'{page}: BookInfo return does not target the Könyv tab')
          PY
          grep -q 'BookInfoActivity::Page::Description' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'BookInfoActivity::Page::Metadata' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'startOnBookTab ? Tab::Book : Tab::Reading' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q 'Borító megjelenítése' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q 'void EpubReaderMenuActivity::drawFooter() { UiTabListActivity::drawFooter(); }' src/activities/reader/EpubReaderMenuActivity.cpp
          ! grep -q 'mappedInput.wasReleased(MappedInputManager::Button::Left) && ringPos() == 0' src/activities/reader/EpubReaderMenuActivity.cpp
          ! grep -q 'mappedInput.wasReleased(MappedInputManager::Button::Right) && ringPos() == 0' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q 'formatFileSizeMb' src/activities/reader/BookInfoActivity.cpp
          grep -q '%.2f MB' src/activities/reader/BookInfoActivity.cpp
          grep -q 'limitTagsToTwoLines' src/activities/reader/BookInfoActivity.cpp
          grep -q 'metadataFieldEnd' src/activities/reader/BookInfoActivity.cpp
          grep -q 'pageStarts_' src/activities/reader/BookInfoActivity.cpp
          grep -q 'remainingWidth > maxWidth' src/activities/reader/BookInfoActivity.cpp
          grep -q 'mappedInput.mapLabels("Vissza"' src/activities/reader/BookInfoActivity.cpp

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - name: Commit verified CPHUN-97 source changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/CPHUNBuildId.h \
                    src/activities/reader/EpubReaderActivity.cpp \
                    src/activities/reader/EpubReaderMenuActivity.cpp \
                    src/activities/reader/BookInfoActivity.h \
                    src/activities/reader/BookInfoActivity.cpp
            git commit -m "CPHUN-97: polish Book metadata and Reader Menu navigation"
            git push origin HEAD:agent/cphun-97-book-tab-return
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-97 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-97 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260911-97-Metadata-Navigation-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
