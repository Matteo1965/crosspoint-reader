name: Build CPHUN-63 Dictionary Upstream

on:
  push:
    branches: [agent/cphun-63-dictionary-upstream]
    paths:
      - '.github/workflows/build-cphun-63-dictionary-upstream.yml'
      - '.github/scripts/cphun63_integrate.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260907-63
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-63-dictionary-upstream
          submodules: recursive
          fetch-depth: 0

      - name: Integrate dictionary upstream fixes
        run: python3 .github/scripts/cphun63_integrate.py

      - name: Verify preserved CPHUN behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MIN_STYLED_RETAIN_HEAP = 16 * 1024' src/util/DictHtmlPages.cpp
          grep -F 'MIN_STYLED_RETAIN_ALLOC = 8 * 1024' src/util/DictHtmlPages.cpp
          grep -F 'void DictionaryDefinitionActivity::onExit()' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'releaseSdFontCaches' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'WORD_REPEAT_START_MS = 500' src/activities/reader/DictionaryWordSelectActivity.cpp
          grep -F 'lastHorizontalMoveTime = 0' src/activities/reader/DictionaryWordSelectActivity.h
          grep -F 'std::isalnum' src/util/HtmlToPlainText.cpp
          grep -F 'uppercaseHungarian' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'Forrás:' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'Hyphenator::breakOffsetsForLanguage(token, false, "hu")' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'SETTINGS.softHyphenEnabled != 0' src/util/DictHtmlPages.cpp
          grep -F 'SETTINGS.fixedDialogueSpacing != 0' src/util/DictHtmlPages.cpp
          grep -F 'SETTINGS.letterSpacingLimitPercent' src/util/DictHtmlPages.cpp
          grep -F 'hasHungarianNumericLeft' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -F 'AllowsNumericSuffixBreakAfterExistingHyphen' test/hungarian_single_prefix/HungarianSinglePrefixTest.cpp
          grep -F 'props.rowHeight = 40;' src/activities/settings/TextSettingsActivity.cpp
          grep -F 'syncTabListViewport(screen, props, false, 40);' src/activities/settings/TextSettingsActivity.cpp
          python3 - <<'PY'
          from pathlib import Path
          s = Path('platformio.ini').read_text()
          for env in ('gh_release', 'gh_release_rc'):
              start = s.index(f'[env:{env}]')
              end = s.find('\n[', start + 1)
              block = s[start:end if end != -1 else len(s)]
              if block.count('-DCROSSPOINT_WAIT_FOR_USB_SERIAL') != 1:
                  raise SystemExit(f'{env}: USB serial wait flag missing or duplicated')
          PY
          git diff --check

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-63 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release_rc/firmware.bin

      - name: Push validated Build 63 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/util/DictHtmlPages.cpp \
                  src/activities/reader/DictionaryDefinitionActivity.cpp \
                  src/activities/reader/DictionaryDefinitionActivity.h \
                  src/activities/reader/DictionaryWordSelectActivity.cpp \
                  src/activities/reader/DictionaryWordSelectActivity.h \
                  src/CPHUNBuildId.h
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-63: integrate upstream dictionary fixes"
            git push origin HEAD:agent/cphun-63-dictionary-upstream
          fi

      - name: Upload CPHUN-63 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260907-63-Dictionary-Upstream-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
