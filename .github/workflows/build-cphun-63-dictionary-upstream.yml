name: Build CPHUN-63 Dictionary Upstream

on:
  push:
    branches: [agent/cphun-63-dictionary-upstream]
    paths: ['.github/workflows/build-cphun-63-dictionary-upstream.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260907-63
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-63-dictionary-upstream
          submodules: recursive
          fetch-depth: 0

      - name: Integrate dictionary upstream fixes
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/crosspoint-reader/crosspoint-reader.git || true
          git fetch upstream 57c692fe846984c7b9c9a12d427048aef79764e0
          git cherry-pick --no-commit 57c692fe846984c7b9c9a12d427048aef79764e0

          python3 - <<'PY'
          from pathlib import Path

          def patch_once(path, old, new, marker):
              p = Path(path)
              s = p.read_text()
              if marker in s:
                  return
              if old not in s:
                  raise SystemExit(f'{path}: missing patch anchor for {marker}')
              p.write_text(s.replace(old, new, 1))

          patch_once('src/activities/reader/DictionaryDefinitionActivity.h',
                     '  void onEnter() override;\n  void loop() override;',
                     '  void onEnter() override;\n  void onExit() override;\n  void loop() override;',
                     'void onExit() override;')

          patch_once('src/activities/reader/DictionaryDefinitionActivity.cpp',
                     '  requestUpdate();\n}\n\nDictionaryDefinitionActivity::BodyArea DictionaryDefinitionActivity::bodyArea() const {',
                     '  requestUpdate();\n}\n\nvoid DictionaryDefinitionActivity::onExit() {\n  Activity::onExit();\n  if (auto* fcm = renderer.getFontCacheManager()) {\n    fcm->releaseSdFontCaches();\n  }\n}\n\nDictionaryDefinitionActivity::BodyArea DictionaryDefinitionActivity::bodyArea() const {',
                     'void DictionaryDefinitionActivity::onExit()')

          p = Path('src/activities/reader/DictionaryWordSelectActivity.cpp')
          s = p.read_text()
          if 'WORD_REPEAT_START_MS' not in s:
              s = s.replace('constexpr unsigned long POPUP_DURATION_MS = 1500;\n',
                            'constexpr unsigned long POPUP_DURATION_MS = 1500;\nconstexpr unsigned long WORD_REPEAT_START_MS = 500;\nconstexpr unsigned long WORD_REPEAT_INTERVAL_MS = 500;\n', 1)
              old = ('  const bool hasNextWord = selected + 1 < static_cast<int>(words.size());\n'
                     '  if (mappedInput.wasPressed(MappedInputManager::Button::ScreenLeft) && selected > 0) {\n'
                     '    selected--;\n'
                     '    requestUpdate();\n'
                     '  } else if (mappedInput.wasPressed(MappedInputManager::Button::ScreenRight) && hasNextWord) {\n'
                     '    selected++;\n'
                     '    requestUpdate();\n')
              new = ('  const bool hasNextWord = selected + 1 < static_cast<int>(words.size());\n'
                     '  const unsigned long now = millis();\n'
                     '  const bool repeat =\n'
                     '      mappedInput.getHeldTime() >= WORD_REPEAT_START_MS && now - lastHorizontalMoveTime >= WORD_REPEAT_INTERVAL_MS;\n'
                     '  const bool moveLeft = mappedInput.wasPressed(MappedInputManager::Button::ScreenLeft) ||\n'
                     '                        (repeat && mappedInput.isPressed(MappedInputManager::Button::ScreenLeft));\n'
                     '  const bool moveRight = mappedInput.wasPressed(MappedInputManager::Button::ScreenRight) ||\n'
                     '                         (repeat && mappedInput.isPressed(MappedInputManager::Button::ScreenRight));\n'
                     '  if (moveLeft && selected > 0) {\n'
                     '    selected--;\n'
                     '    lastHorizontalMoveTime = now;\n'
                     '    requestUpdate();\n'
                     '  } else if (moveRight && hasNextWord) {\n'
                     '    selected++;\n'
                     '    lastHorizontalMoveTime = now;\n'
                     '    requestUpdate();\n')
              if old not in s:
                  raise SystemExit('DictionaryWordSelectActivity.cpp: missing horizontal navigation block')
              p.write_text(s.replace(old, new, 1))

          patch_once('src/activities/reader/DictionaryWordSelectActivity.h',
                     '  int selected = 0;\n  uint16_t rowCount = 0;\n',
                     '  int selected = 0;\n  uint16_t rowCount = 0;\n  unsigned long lastHorizontalMoveTime = 0;\n',
                     'lastHorizontalMoveTime = 0;')

          if 'std::isalnum' not in Path('src/util/HtmlToPlainText.cpp').read_text():
              raise SystemExit('5182d27 regression: heading tag scan fix is missing')

          Path('src/CPHUNBuildId.h').write_text('#pragma once\n\n#define CPHUN_BUILD_ID "CPHUN-260907-63"\n')
          PY

          grep -F 'MIN_STYLED_RETAIN_HEAP = 16 * 1024' src/util/DictHtmlPages.cpp
          grep -F 'MIN_STYLED_RETAIN_ALLOC = 8 * 1024' src/util/DictHtmlPages.cpp
          grep -F 'void DictionaryDefinitionActivity::onExit()' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'releaseSdFontCaches' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'WORD_REPEAT_START_MS = 500' src/activities/reader/DictionaryWordSelectActivity.cpp
          grep -F 'lastHorizontalMoveTime = 0' src/activities/reader/DictionaryWordSelectActivity.h
          grep -F 'std::isalnum' src/util/HtmlToPlainText.cpp
          grep -F 'uppercaseHungarian' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'Forrás:' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'Hyphenator::breakOffsetsForLanguage(token, false, "hu")' src/activities/reader/DictionaryDefinitionActivity.cpp
          grep -F 'hasHungarianNumericLeft' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -F 'AllowsNumericSuffixBreakAfterExistingHyphen' test/hungarian_single_prefix/HungarianSinglePrefixTest.cpp
          grep -F 'props.rowHeight = 40;' src/activities/settings/TextSettingsActivity.cpp
          grep -F 'syncTabListViewport(screen, props, false, 40);' src/activities/settings/TextSettingsActivity.cpp

          python3 - <<'PY'
          from pathlib import Path
          s = Path('platformio.ini').read_text()
          for env in ('gh_release', 'gh_release_rc'):
              start = s.index(f'[env:{env}]')
              end = s.find('\n[', start + 1)
              block = s[start:end if end != -1 else len(s)]
              if block.count('-DCROSSPOINT_WAIT_FOR_USB_SERIAL') != 1:
                  raise SystemExit(f'{env}: USB serial wait flag missing or duplicated')
          PY

          git diff --check

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-63 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release_rc/firmware.bin

      - name: Push validated Build 63 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/util/DictHtmlPages.cpp src/activities/reader/DictionaryDefinitionActivity.cpp src/activities/reader/DictionaryDefinitionActivity.h src/activities/reader/DictionaryWordSelectActivity.cpp src/activities/reader/DictionaryWordSelectActivity.h src/CPHUNBuildId.h
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-63: integrate upstream dictionary fixes"
            git push origin HEAD:agent/cphun-63-dictionary-upstream
          fi

      - name: Upload CPHUN-63 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260907-63-Dictionary-Upstream-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
