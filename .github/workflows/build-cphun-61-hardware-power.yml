name: Build CPHUN-61 Hardware Power SD

on:
  push:
    branches: [agent/cphun-60-font-memory-cache]
    paths: ['.github/workflows/build-cphun-61-hardware-power.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260906-61
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-60-font-memory-cache
          submodules: recursive
          fetch-depth: 0

      - name: Integrate selected CrossPoint 1.6.0 hardware and power fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/crosspoint-reader/crosspoint-reader.git || true

          BASE=668220692b9c05d9860b19540acbaa7107d5460e
          C_USB=8bc1603e85ba1f0b533d4fb3227d65266348799b
          C_WAKE=cdd89b1d75ee2a3c01cf6ba1ae14a07ffd8d6627
          C_COLD=e37164ca915761f55feca4b05f533a506f9bd393
          C_X4C=f021d1e5f8c9d009e88090a346c88d51f7831d06
          C_SD=4a679d5d4b8944227a219ee68d1028a648da1e10
          FINAL_SDK=fad70f28a982c978737410e535a4f7276ce28c19

          git fetch --no-tags upstream "$C_USB" "$C_WAKE" "$C_COLD" "$C_X4C" "$C_SD"

          for c in "$C_USB" "$C_WAKE"; do
            echo "=== cherry-pick $c ==="
            if ! git cherry-pick "$c"; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = 'freeink-sdk' ]; then
                git checkout --ours -- freeink-sdk
                git add freeink-sdk
                git cherry-pick --continue
              else
                printf 'Unexpected integration conflicts:\n%s\n' "${conflicts[*]}"
                exit 1
              fi
            fi
          done

          echo "=== cherry-pick $C_COLD ==="
          if ! git cherry-pick "$C_COLD"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = 'src/main.cpp' ]; then
              git checkout --ours -- src/main.cpp
              git add src/main.cpp
              git cherry-pick --continue
            else
              printf 'Unexpected cold-boot conflicts:\n%s\n' "${conflicts[*]}"
              exit 1
            fi
          fi

          echo "=== cherry-pick $C_X4C ==="
          if ! git cherry-pick "$C_X4C"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'X4 Classic conflicts:\n%s\n' "${conflicts[*]}"
            allowed='freeink-sdk src/activities/reader/EpubReaderActivity.cpp src/main.cpp'
            for f in "${conflicts[@]}"; do
              case " $allowed " in
                *" $f "*) ;;
                *) echo "Unexpected X4 Classic conflict: $f"; exit 1 ;;
              esac
            done
            git checkout --ours -- freeink-sdk src/activities/reader/EpubReaderActivity.cpp src/main.cpp
            git add freeink-sdk src/activities/reader/EpubReaderActivity.cpp src/main.cpp
            git cherry-pick --continue
          fi

          echo "=== cherry-pick $C_SD ==="
          if ! git cherry-pick "$C_SD"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            allowed='freeink-sdk lib/hal/HalStorage.cpp lib/hal/HalStorage.h'
            for f in "${conflicts[@]}"; do
              case " $allowed " in
                *" $f "*) ;;
                *) echo "Unexpected SD integration conflict: $f"; exit 1 ;;
              esac
            done

            git checkout --ours -- freeink-sdk
            git add freeink-sdk
            git checkout --ours -- lib/hal/HalStorage.cpp lib/hal/HalStorage.h
            python3 - <<'PY'
          from pathlib import Path

          cpp = Path('lib/hal/HalStorage.cpp')
          s = cpp.read_text()
          if 'void HalStorage::prepareForDeepSleep()' not in s:
              marker = '''class HalStorage::StorageLock {\n public:\n  StorageLock() { xSemaphoreTakeRecursive(HalStorage::getInstance().storageMutex, portMAX_DELAY); }\n  ~StorageLock() { xSemaphoreGiveRecursive(HalStorage::getInstance().storageMutex); }\n};\n\n'''
              if marker not in s:
                  raise SystemExit('HalStorage.cpp StorageLock block not found')
              s = s.replace(marker, marker + '''void HalStorage::prepareForDeepSleep() {\n  StorageLock lock;\n  SDCard.shutdown();\n}\n\n''', 1)
          cpp.write_text(s)

          hdr = Path('lib/hal/HalStorage.h')
          h = hdr.read_text()
          if 'void prepareForDeepSleep();' not in h:
              marker = '  bool ready() const;\n'
              if marker not in h:
                  raise SystemExit('HalStorage.h insertion point not found')
              h = h.replace(marker, marker + '  void prepareForDeepSleep();\n', 1)
          hdr.write_text(h)
          PY
            git add lib/hal/HalStorage.cpp lib/hal/HalStorage.h
            git cherry-pick --continue
          fi

          # Re-port the final upstream power semantics onto CPHUN's custom main.cpp.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()

          # Deep sleep must shut the SD stack down after all activity/file cleanup.
          old = '  halTiltSensor.deepSleep();\n  display.deepSleep();\n  LOG_DBG("MAIN", "Entering deep sleep");'
          new = '  halTiltSensor.deepSleep();\n  display.deepSleep();\n  Storage.prepareForDeepSleep();\n  LOG_DBG("MAIN", "Entering deep sleep");'
          if 'Storage.prepareForDeepSleep();\n  LOG_DBG("MAIN", "Entering deep sleep")' not in s:
              if old not in s:
                  raise SystemExit('enterDeepSleep insertion point not found')
              s = s.replace(old, new, 1)

          # Sample physical wake immediately; decide whether a click is valid only after SETTINGS loads.
          marker = '  const auto wakeupReason = gpio.getWakeupReason();\n'
          if 'const bool wakeHoldVerified =' not in s:
              if marker not in s:
                  raise SystemExit('wakeupReason marker not found')
              s = s.replace(marker, marker + '  const bool wakeHoldVerified =\n      wakeupReason != HalGPIO::WakeupReason::PowerButton || gpio.verifyPowerButtonWakeup();\n', 1)

          # X4 Classic shares the X4 Pro recovery-key restriction.
          s = s.replace('BoardConfig::isX4Pro() ? X4PRO_RECOVERY_SETTLE_MS : DEFAULT_RECOVERY_SETTLE_MS',
                        '(BoardConfig::isX4Pro() || BoardConfig::isX4Classic()) ? X4PRO_RECOVERY_SETTLE_MS : DEFAULT_RECOVERY_SETTLE_MS')
          s = s.replace('BoardConfig::isX4Pro() ? HalGPIO::BTN_DOWN : HalGPIO::BTN_UP',
                        '(BoardConfig::isX4Pro() || BoardConfig::isX4Classic()) ? HalGPIO::BTN_DOWN : HalGPIO::BTN_UP')
          s = s.replace('BoardConfig::isX4Pro() ? "DOWN" : "UP"',
                        '(BoardConfig::isX4Pro() || BoardConfig::isX4Classic()) ? "DOWN" : "UP"')

          # Replace CPHUN's old two-argument wake verification with final single-click semantics.
          old_case = '''    case HalGPIO::WakeupReason::PowerButton:\n      LOG_DBG("MAIN", "Verifying power button press duration");\n      if (!gpio.verifyPowerButtonWakeup(SETTINGS.getPowerButtonDuration(),\n                                        SETTINGS.shortPwrBtn == CrossPointSettings::SHORT_PWRBTN::SLEEP)) {\n        powerManager.startDeepSleep(gpio);\n      }\n      wakePowerReleasePending = true;\n      break;'''
          new_case = '''    case HalGPIO::WakeupReason::PowerButton:\n      if (!wakeHoldVerified && SETTINGS.shortPwrBtn != CrossPointSettings::SHORT_PWRBTN::SLEEP) {\n        LOG_DBG("MAIN", "Power-button wake not held through verification, sleeping");\n        Storage.prepareForDeepSleep();\n        powerManager.startDeepSleep(gpio);\n      }\n      wakePowerReleasePending = true;\n      break;'''
          if old_case in s:
              s = s.replace(old_case, new_case, 1)
          elif 'SETTINGS.shortPwrBtn != CrossPointSettings::SHORT_PWRBTN::SLEEP' not in s:
              raise SystemExit('PowerButton wake case not found')

          # X4 Pro / Classic, PaperMono and EEGO A4 remain awake on USB-power boot.
          old_usb = '''#if FREEINK_DEVICE_PAPERMONO\n      // There is no armable GPIO wake because the button is behind the PMIC.\n      // Sleeping here would strand the device in a USB-replug boot loop.\n      break;\n#else\n      powerManager.startDeepSleep(gpio);\n      break;\n#endif'''
          new_usb = '''#if FREEINK_DEVICE_X4PRO || FREEINK_DEVICE_X4CLASSIC || FREEINK_DEVICE_PAPERMONO || FREEINK_DEVICE_EEGO_A4\n      break;\n#else\n      Storage.prepareForDeepSleep();\n      powerManager.startDeepSleep(gpio);\n      break;\n#endif'''
          if old_usb in s:
              s = s.replace(old_usb, new_usb, 1)
          elif 'FREEINK_DEVICE_X4CLASSIC' not in s:
              raise SystemExit('AfterUSBPower block not found')

          p.write_text(s)
          PY
          git add src/main.cpp
          git commit -m 'CPHUN-61: port final power and SD sleep semantics'

          git -C freeink-sdk fetch --no-tags origin "$FINAL_SDK"
          git -C freeink-sdk checkout "$FINAL_SDK"
          git add freeink-sdk
          git commit -m 'CPHUN-61: align freeink-sdk with hardware power fixes'
          git submodule update --init --recursive

          cat > src/CPHUNBuildId.h <<'EOF'
          #pragma once

          #define CPHUN_BUILD_ID "CPHUN-260906-61"
          EOF
          git add src/CPHUNBuildId.h
          git commit -m 'CPHUN-61: set build identifier'

          grep -q 'NORMAL_PLUS = 4, WIDE_PLUS = 5' src/CrossPointSettings.h
          grep -q 'return 0.975f;' src/CrossPointSettings.cpp
          grep -q 'return 1.025f;' src/CrossPointSettings.cpp
          grep -q 'CrossPointSettings::NORMAL_PLUS' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'CrossPointSettings::WIDE_PLUS' src/activities/settings/TextSettingsActivity.cpp
          test -f lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q 'hungarian' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          test -f src/ReaderButtonGestureDetector.cpp
          test -f src/activities/settings/ButtonFunctionsActivity.cpp
          test -f src/activities/settings/CrossPointVersionActivity.cpp
          test ! -e lib/EpdFont/builtinFonts/ubuntu_10_medium.h
          test ! -e lib/EpdFont/builtinFonts/ubuntu_12_medium.h
          git diff --quiet "$BASE" -- lib/I18n/translations/hungarian.yaml

          grep -q 'BatteryMonitor.h' lib/hal/HalGPIO.cpp
          grep -q 'verifyPowerButtonWakeup()' lib/hal/HalGPIO.h
          grep -q 'coldBootImpliesPowerButton' lib/hal/HalGPIO.cpp
          grep -q 'XteinkX4Classic' lib/hal/HalGPIO.cpp
          grep -q '\[env:x4c\]' platformio.ini
          grep -q 'BoardConfig::isX4Classic' src/main.cpp
          grep -q 'FREEINK_DEVICE_X4CLASSIC' src/main.cpp
          grep -q 'wakeHoldVerified' src/main.cpp
          grep -q 'SHORT_PWRBTN::SLEEP' src/main.cpp
          grep -q 'prepareForDeepSleep' lib/hal/HalStorage.cpp
          grep -q 'void prepareForDeepSleep();' lib/hal/HalStorage.h
          grep -q 'Storage.prepareForDeepSleep' src/main.cpp
          test "$(git rev-parse HEAD:freeink-sdk)" = "$FINAL_SDK"
          grep -q 'CPHUN-260906-61' src/CPHUNBuildId.h
          git diff --check

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release_rc/firmware.bin

      - name: Push validated source to Build 61 branch
        run: git push origin HEAD:agent/cphun-61-hardware-power

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260906-61-Hardware-Power-SD-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
