name: Build CPHUN Fixed Dialogue Space test

'on':
  push:
    branches: [agent/hungarian-integrated-v1.6.0rc]
    paths:
      - '.github/workflows/build-cphun-minspace-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out FAST baseline source
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Restore MinSpace and fix dialogue-space width
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def ro(path, old, new):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              n = t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old[:120]!r}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # Persistent setting.
          ro('src/CrossPointSettings.h',
             '  uint8_t fixedDialogueSpacing = 0;\n',
             '  uint8_t fixedDialogueSpacing = 0;\n  // Minimum natural word-space width in justified text: 50..100 percent.\n  uint8_t minimumSpacePercent = 100;\n')

          ro('src/CrossPointSettings.cpp',
             '  doc["fixedDialogueSpacing"] = fixedDialogueSpacing;\n',
             '  doc["fixedDialogueSpacing"] = fixedDialogueSpacing;\n  doc["minimumSpacePercent"] = minimumSpacePercent;\n')
          ro('src/CrossPointSettings.cpp',
             '  fixedDialogueSpacing = (doc["fixedDialogueSpacing"] | (uint8_t)0) ? 1 : 0;\n',
             '  fixedDialogueSpacing = (doc["fixedDialogueSpacing"] | (uint8_t)0) ? 1 : 0;\n  minimumSpacePercent = doc["minimumSpacePercent"] | (uint8_t)100;\n  if (minimumSpacePercent < 50 || minimumSpacePercent > 100 || minimumSpacePercent % 10 != 0) {\n    minimumSpacePercent = 100;\n    needsResave = true;\n  }\n')
          ro('src/CrossPointSettings.cpp',
             '  spec.fixedDialogueSpacing = fixedDialogueSpacing != 0;\n',
             '  spec.fixedDialogueSpacing = fixedDialogueSpacing != 0;\n  spec.minimumSpacePercent = minimumSpacePercent;\n')

          # Render spec.
          ro('lib/Epub/Epub/ReaderRenderSpec.h',
             '  bool fixedDialogueSpacing = false;\n',
             '  bool fixedDialogueSpacing = false;\n  uint8_t minimumSpacePercent = 100;\n')

          # Section cache header/key.
          sec = Path('lib/Epub/Epub/Section.cpp')
          s = sec.read_text(encoding='utf-8')
          mver = re.search(r'constexpr uint8_t SECTION_FILE_VERSION = (\d+);', s)
          if not mver:
              raise SystemExit('Section.cpp: SECTION_FILE_VERSION not found')
          oldver = int(mver.group(1))
          s = s[:mver.start()] + f'constexpr uint8_t SECTION_FILE_VERSION = {oldver + 1};' + s[mver.end():]
          s = s.replace('                                 sizeof(bool) + sizeof(uint8_t) + sizeof(bool) + sizeof(bool) + sizeof(uint8_t) +\n',
                        '                                 sizeof(bool) + sizeof(uint8_t) + sizeof(bool) + sizeof(uint8_t) + sizeof(bool) + sizeof(uint8_t) +\n', 1)
          s = s.replace('                                   sizeof(spec.hangingPunctuationLimitPx) + sizeof(spec.fixedDialogueSpacing) +\n                                   sizeof(spec.embeddedStyle)',
                        '                                   sizeof(spec.hangingPunctuationLimitPx) + sizeof(spec.fixedDialogueSpacing) +\n                                   sizeof(spec.minimumSpacePercent) + sizeof(spec.embeddedStyle)', 1)
          s = s.replace('  serialization::writePod(file, spec.fixedDialogueSpacing);\n  serialization::writePod(file, spec.embeddedStyle);',
                        '  serialization::writePod(file, spec.fixedDialogueSpacing);\n  serialization::writePod(file, spec.minimumSpacePercent);\n  serialization::writePod(file, spec.embeddedStyle);', 1)
          s = s.replace('    bool fileFixedDialogueSpacing;\n    bool fileEmbeddedStyle;',
                        '    bool fileFixedDialogueSpacing;\n    uint8_t fileMinimumSpacePercent;\n    bool fileEmbeddedStyle;', 1)
          s = s.replace('    serialization::readPod(file, fileFixedDialogueSpacing);\n    serialization::readPod(file, fileEmbeddedStyle);',
                        '    serialization::readPod(file, fileFixedDialogueSpacing);\n    serialization::readPod(file, fileMinimumSpacePercent);\n    serialization::readPod(file, fileEmbeddedStyle);', 1)
          s = s.replace('        spec.hangingPunctuationLimitPx != fileHangingPunctuationLimitPx || spec.embeddedStyle != fileEmbeddedStyle ||',
                        '        spec.hangingPunctuationLimitPx != fileHangingPunctuationLimitPx ||\n        spec.fixedDialogueSpacing != fileFixedDialogueSpacing || spec.minimumSpacePercent != fileMinimumSpacePercent ||\n        spec.embeddedStyle != fileEmbeddedStyle ||', 1)
          marker = '  Hyphenator::setPreferredLanguage(epub->getLanguage());'
          if marker not in s:
              raise SystemExit('Section.cpp: Hyphenator language marker not found')
          s = s.replace(marker, '  ParsedText::setMinimumSpacePercent(spec.minimumSpacePercent);\n' + marker, 1)
          sec.write_text(s, encoding='utf-8')

          # ParsedText MinSpace setting.
          ro('lib/Epub/Epub/ParsedText.h',
             'class ParsedText {\n',
             'class ParsedText {\n  static uint8_t minimumSpacePercent_;\n')
          ro('lib/Epub/Epub/ParsedText.h',
             ' public:\n  explicit ParsedText(',
             ' public:\n  static void setMinimumSpacePercent(uint8_t percent) { minimumSpacePercent_ = percent; }\n  explicit ParsedText(')

          pc = Path('lib/Epub/Epub/ParsedText.cpp')
          t = pc.read_text(encoding='utf-8')
          t = t.replace('constexpr int MAX_COST = std::numeric_limits<int>::max();\n',
                        'constexpr int MAX_COST = std::numeric_limits<int>::max();\nuint8_t ParsedText::minimumSpacePercent_ = 100;\n', 1)
          marker = 'int computeJustifyExtra(const int spareSpace, const size_t gapCount) {'
          helper = '''int scaledNormalSpaceAdvance(const int natural, const uint8_t percent) {\n  return std::max(1, (natural * std::clamp<int>(percent, 50, 100) + 99) / 100);\n}\n\nbool isStandaloneDialogueDash(const std::string& word) {\n  if (word.empty()) return false;\n  const uint32_t first = firstCodepoint(word);\n  return (first == 0x2013 || first == 0x2014) && first == lastCodepoint(word);\n}\n\n'''
          if marker not in t:
              raise SystemExit('ParsedText.cpp: justify helper marker not found')
          t = t.replace(marker, helper + marker, 1)

          # Scale ordinary natural spaces in justified paragraphs.
          needle = 'renderer.getSpaceAdvance('
          out = []
          pos = 0
          wrapped = 0
          while True:
              start = t.find(needle, pos)
              if start < 0:
                  out.append(t[pos:])
                  break
              out.append(t[pos:start])
              i = start + len(needle)
              depth = 1
              while i < len(t) and depth:
                  if t[i] == '(':
                      depth += 1
                  elif t[i] == ')':
                      depth -= 1
                  i += 1
              if depth != 0:
                  raise SystemExit('ParsedText.cpp: unbalanced getSpaceAdvance call')
              call = t[start:i]
              out.append('scaledNormalSpaceAdvance(' + call + ', '
                         '(blockStyle.alignment == CssTextAlign::Justify ? minimumSpacePercent_ : 100))')
              wrapped += 1
              pos = i
          if wrapped < 3:
              raise SystemExit(f'ParsedText.cpp: unexpectedly few getSpaceAdvance calls: {wrapped}')
          t = ''.join(out)

          # Fixed dialogue boundary: the dash and following word remain unbreakable,
          # but use an explicit MinSpace-scaled natural space instead of kerning.
          old = '''      if (j > static_cast<size_t>(i) && continuesVec[j]) {\n        // Attached and breakable-attached boundaries both use kerning when kept on one line.\n        gap = renderer.getKerning(fontId, lastCodepoint(words[j - 1]), firstCodepoint(words[j]), wordStyles[j - 1]);\n'''
          new = '''      if (j > static_cast<size_t>(i) && continuesVec[j]) {\n        if (fixedDialogueSpacing && j == 1 && isStandaloneDialogueDash(words[0])) {\n          gap = scaledNormalSpaceAdvance(\n              renderer.getSpaceAdvance(fontId, lastCodepoint(words[0]), firstCodepoint(words[1]), wordStyles[0]),\n              minimumSpacePercent_);\n        } else {\n          // Attached and breakable-attached boundaries use kerning when kept on one line.\n          gap = renderer.getKerning(fontId, lastCodepoint(words[j - 1]), firstCodepoint(words[j]), wordStyles[j - 1]);\n        }\n'''
          if t.count(old) != 1:
              raise SystemExit(f'computeLineBreaks dialogue marker count={t.count(old)}')
          t = t.replace(old, new, 1)

          old = '''      if (!isFirstWord && continuesVec[currentIndex]) {\n        // Attached and breakable-attached boundaries both use kerning when kept on one line.\n        spacing = renderer.getKerning(fontId, lastCodepoint(words[currentIndex - 1]),\n                                      firstCodepoint(words[currentIndex]), wordStyles[currentIndex - 1]);\n'''
          new = '''      if (!isFirstWord && continuesVec[currentIndex]) {\n        if (fixedDialogueSpacing && currentIndex == 1 && isStandaloneDialogueDash(words[0])) {\n          spacing = scaledNormalSpaceAdvance(\n              renderer.getSpaceAdvance(fontId, lastCodepoint(words[0]), firstCodepoint(words[1]), wordStyles[0]),\n              minimumSpacePercent_);\n        } else {\n          // Attached and breakable-attached boundaries use kerning when kept on one line.\n          spacing = renderer.getKerning(fontId, lastCodepoint(words[currentIndex - 1]),\n                                        firstCodepoint(words[currentIndex]), wordStyles[currentIndex - 1]);\n        }\n'''
          if t.count(old) != 1:
              raise SystemExit(f'computeHyphenatedLineBreaks dialogue marker count={t.count(old)}')
          t = t.replace(old, new, 1)

          old = '''    if (continuesVec[boundaryIdx]) {\n      totalNaturalGaps += renderer.getKerning(fontId, lastCodepoint(lineWords[wordIdx - 1]),\n                                              firstCodepoint(lineWords[wordIdx]), lineWordStyles[wordIdx - 1]);\n'''
          new = '''    if (continuesVec[boundaryIdx]) {\n      if (fixedDialogueSpacing && boundaryIdx == 1 && isStandaloneDialogueDash(lineWords[0])) {\n        totalNaturalGaps += scaledNormalSpaceAdvance(\n            renderer.getSpaceAdvance(fontId, lastCodepoint(lineWords[0]), firstCodepoint(lineWords[1]),\n                                     lineWordStyles[0]),\n            minimumSpacePercent_);\n      } else {\n        totalNaturalGaps += renderer.getKerning(fontId, lastCodepoint(lineWords[wordIdx - 1]),\n                                                firstCodepoint(lineWords[wordIdx]), lineWordStyles[wordIdx - 1]);\n      }\n'''
          if t.count(old) != 1:
              raise SystemExit(f'extractLine natural-gap dialogue marker count={t.count(old)}')
          t = t.replace(old, new, 1)

          old = '''        if (nextIsContinuation) {\n          int advance = wordWidths[lastBreakAt + wordIdx];\n          advance += renderer.getKerning(fontId, lastCodepoint(lineWords[wordIdx]),\n                                         firstCodepoint(lineWords[wordIdx + 1]), lineWordStyles[wordIdx]);\n'''
          new = '''        if (nextIsContinuation) {\n          int advance = wordWidths[lastBreakAt + wordIdx];\n          if (fixedDialogueSpacing && lastBreakAt == 0 && wordIdx == 0 && isStandaloneDialogueDash(lineWords[0])) {\n            advance += scaledNormalSpaceAdvance(\n                renderer.getSpaceAdvance(fontId, lastCodepoint(lineWords[0]), firstCodepoint(lineWords[1]),\n                                         lineWordStyles[0]),\n                minimumSpacePercent_);\n          } else {\n            advance += renderer.getKerning(fontId, lastCodepoint(lineWords[wordIdx]),\n                                           firstCodepoint(lineWords[wordIdx + 1]), lineWordStyles[wordIdx]);\n          }\n'''
          if t.count(old) != 1:
              raise SystemExit(f'LTR positioning dialogue marker count={t.count(old)}')
          t = t.replace(old, new, 1)
          pc.write_text(t, encoding='utf-8')

          # Text Settings menu: keep the proven -03 order.
          ro('src/activities/settings/TextSettingsActivity.h',
             '    Alignment,\n    ScreenMargin,\n',
             '    Alignment,\n    MinimumSpace,\n    ScreenMargin,\n')
          ta = Path('src/activities/settings/TextSettingsActivity.cpp')
          u = ta.read_text(encoding='utf-8')
          label_marker = '        if (i == static_cast<int>(LayoutRow::HangingPunctuation)) {\n'
          if label_marker not in u:
              raise SystemExit('TextSettingsActivity.cpp: hanging label marker not found')
          u = u.replace(label_marker,
                        '        if (i == static_cast<int>(LayoutRow::MinimumSpace)) {\n          item.label = I18N.getLanguage() == Language::HU ? "Min. szóköz" : "Min. word spacing";\n        } else if (i == static_cast<int>(LayoutRow::ScreenMargin)) {\n          item.label = I18N.get(StrId::STR_SCREEN_MARGIN);\n        } else if (i == static_cast<int>(LayoutRow::HangingPunctuation)) {\n', 1)
          toggle_marker = '    case LayoutRow::FixedDialogueSpacing:\n      SETTINGS.fixedDialogueSpacing = !SETTINGS.fixedDialogueSpacing;'
          picker = '''    case LayoutRow::MinimumSpace: {\n      const char* options[] = {"50%", "60%", "70%", "80%", "90%", "100%"};\n      const int cur = std::clamp<int>((SETTINGS.minimumSpacePercent - 50) / 10, 0, 5);\n      optionPopup_.show(I18N.getLanguage() == Language::HU ? "Min. szóköz" : "Min. word spacing", options, 6, cur,\n                        [](int idx) {\n                          SETTINGS.minimumSpacePercent = static_cast<uint8_t>(50 + idx * 10);\n                          SETTINGS.saveToFile();\n                        });\n      requestUpdate();\n      break;\n    }\n'''
          if toggle_marker not in u:
              raise SystemExit('TextSettingsActivity.cpp: dialogue toggle marker not found')
          u = u.replace(toggle_marker, picker + toggle_marker, 1)
          value_marker = '    case LayoutRow::ScreenMargin:\n      return std::to_string(SETTINGS.screenMargin);'
          if value_marker not in u:
              raise SystemExit('TextSettingsActivity.cpp: screen margin value marker not found')
          u = u.replace(value_marker,
                        '    case LayoutRow::MinimumSpace:\n      return std::to_string(SETTINGS.minimumSpacePercent) + "%";\n' + value_marker, 1)
          ta.write_text(u, encoding='utf-8')

          # Visible firmware identifier.
          ver = Path('src/activities/settings/CrossPointVersionActivity.cpp')
          v = ver.read_text(encoding='utf-8')
          v = v.replace('    drawLabelValue(tr(STR_EDITION), "Hungarian Edition");\n',
                        '    drawLabelValue(tr(STR_EDITION), "Hungarian Edition");\n    drawLabelValue("CPHUN", "CPHUN-260825-05");\n', 1)
          v = v.replace('        hu ? "Optikai margó (Hanging punctuation)" : "Hanging punctuation",\n',
                        '        hu ? "Optikai margó (Hanging punctuation)" : "Hanging punctuation",\n        hu ? "Min. szóköz: 50–100%" : "Minimum word spacing: 50–100%",\n        hu ? "Fix párbeszédköz: Min. szóköz szerint" : "Fixed dialogue space follows Min. word spacing",\n', 1)
          ver.write_text(v, encoding='utf-8')
          PY

          git diff --check

      - name: Verify Fixed Dialogue Space wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minimumSpacePercent = 100' src/CrossPointSettings.h
          grep -q 'isStandaloneDialogueDash' lib/Epub/Epub/ParsedText.cpp
          grep -q 'currentIndex == 1' lib/Epub/Epub/ParsedText.cpp
          grep -q 'boundaryIdx == 1' lib/Epub/Epub/ParsedText.cpp
          grep -q 'lastBreakAt == 0 && wordIdx == 0' lib/Epub/Epub/ParsedText.cpp
          grep -q 'CPHUN-260825-05' src/activities/settings/CrossPointVersionActivity.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Upload CPHUN test firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260825-05-Fixed-Dialogue-Space-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
