name: Build Hungarian Dictionary Test Firmware

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch containing the combined Hungarian firmware
        required: true
        default: hungarian-v1.5.0-dictionary-test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out combined Hungarian firmware
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Apply Hungarian dictionary stemming v15
        run: |
          python scripts/apply_hungarian_dictionary_stemming.py
          python scripts/apply_hungarian_dictionary_stemming_v4.py
          python scripts/apply_hungarian_dictionary_stemming_v5.py
          python scripts/apply_hungarian_dictionary_stemming_v6.py
          python scripts/apply_hungarian_dictionary_stemming_v7.py
          python scripts/apply_hungarian_dictionary_stemming_v8.py
          python scripts/apply_hungarian_dictionary_stemming_v9.py
          python scripts/apply_hungarian_dictionary_stemming_v10.py
          python scripts/apply_hungarian_dictionary_stemming_v11.py
          python scripts/apply_hungarian_dictionary_stemming_v12.py
          python scripts/apply_hungarian_dictionary_stemming_v13.py
          python scripts/apply_hungarian_dictionary_stemming_v14.py
          python scripts/apply_hungarian_dictionary_stemming_v15.py
          sed -i 's/StringUtils::asciiCaseCmp(wordBuf, target)/strcmp(wordBuf, target)/g' src/util/Dictionary.cpp
          test "$(grep -c 'strcmp(wordBuf, target)' src/util/Dictionary.cpp)" -ge 2
          grep -q "Hungarian dictionary stemming v15" src/util/Dictionary.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hungarian dictionary regression tests
        run: python scripts/run_hungarian_stemming_regression_v2.py

      - name: Run actual C++ firmware stemming regression tests
        run: python scripts/run_hungarian_cpp_regression_v2.py

      - name: Run Hungarian false-positive regression tests
        run: python scripts/run_hungarian_cpp_false_positive_regression.py

      - name: Install PioArduino PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip"

      - name: Generate Hungarian trie
        run: |
          chmod +x scripts/update_hyphenation.sh
          scripts/update_hyphenation.sh

      - name: Verify Hungarian files
        run: |
          test -s lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q "hu_patterns" lib/Epub/Epub/hyphenation/generated/hyph-hu.trie.h
          grep -q '"hungarian", "hu"' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          grep -q 'STR_LOOKUP: "Keresés"' lib/I18n/translations/hungarian.yaml
          grep -q 'STR_PROGRESS_BAR: "Folyamatsáv"' lib/I18n/translations/hungarian.yaml

      - name: Build release firmware
        run: pio run -e gh_release

      - name: Check firmware size
        run: |
          firmware=".pio/build/gh_release/firmware.bin"
          limit=$((0x640000))
          size=$(stat --format="%s" "$firmware")
          remaining=$((limit - size))
          echo "Firmware size: $size bytes"
          echo "OTA partition: $limit bytes"
          echo "Remaining: $remaining bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Firmware exceeds the OTA partition."
            exit 1
          fi

      - name: Prepare test package
        run: |
          mkdir -p release
          cp .pio/build/gh_release/firmware.bin release/
          cp LICENSE release/
          cp THIRD_PARTY_NOTICES.md release/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-Hungarian-Dictionary-Stemming-v15-Test
          path: release/*
          if-no-files-found: error
          retention-days: 30
