name: Build CPHUN-102 Metadata Polish

on:
  push:
    branches: [agent/cphun-102-metadata-polish]
    paths:
      - '.github/workflows/build-cphun-102-metadata-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-102-metadata-polish
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-102 patch
        run: python3 tools/cphun102_metadata_polish_patch.py

      - name: Verify CPHUN-102 scope
        run: |
          git diff --check
          grep -q 'CPHUN-260912-102' src/CPHUNBuildId.h
          grep -q 'METADATA_VALUE_X = 182' src/activities/reader/BookInfoActivity.cpp
          grep -q 'add("Sorszám:", info_.seriesIndex)' src/activities/reader/BookInfoActivity.cpp
          ! grep -q 'Sorozat #:' src/activities/reader/BookInfoActivity.cpp
          grep -q 'publisherLower != "ismeretlen"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'publisherLower != "nincs megadva"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'publisherLower != "untitled"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'showDate = year >= 1800' src/activities/reader/BookInfoActivity.cpp
          grep -q '(addFieldGap ? 2 : 0)' src/activities/reader/BookInfoActivity.cpp
          test "$(grep -c 'line.metadataFieldEnd.*y += 2' src/activities/reader/BookInfoActivity.cpp)" -eq 3
          grep -q 'drawBookmarkStatusIcon(renderer, renderer.getScreenWidth() - bookmarkStatusIconWidth, 2)' src/components/themes/BaseTheme.cpp
          grep -q 'EpdFontFamily::REGULAR' src/activities/reader/BookInfoActivity.cpp
          grep -q 'filenameWithoutExtension(info_.filename)' src/activities/reader/BookInfoActivity.cpp
          grep -q 'removeDescriptionWarning' src/activities/reader/BookInfoActivity.cpp
          grep -q 'magyar nyelvű' src/activities/reader/BookInfoActivity.cpp

      - name: Commit CPHUN-102 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CPHUNBuildId.h src/activities/reader/BookInfoActivity.cpp src/components/themes/BaseTheme.cpp
          git commit -m 'CPHUN-102: finalize metadata filtering and spacing'
          git push origin HEAD:agent/cphun-102-metadata-polish

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-102 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-102 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260912-102-Metadata-Polish-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
