name: Apply HU extended vowel guard

on:
  push:
    branches: [hungarian-hyphenation]
    paths:
      - '.github/workflows/apply-hu-extended-vowel-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/Epub/Epub/hyphenation/Hyphenator.cpp')
          s = p.read_text()

          new_func = r'''// Extended Hungarian replacement hyphenation may add a special break only
// when the compact doubled multi-letter consonant is directly surrounded by
// Hungarian vowels. This keeps real cases such as asszony -> asz-szony while
// rejecting compound-boundary false positives such as rosszfiúi -> rosz-szfiúi.
void appendHungarianExtendedBreaks(const std::vector<CodepointInfo>& cps,
                                   std::vector<Hyphenator::BreakInfo>& outBreaks) {
  struct Rule {
    const char* compact;
    size_t length;
    Hyphenator::Replacement replacement;
  };
  static constexpr Rule rules[] = {
      {"ccs", 3, Hyphenator::Replacement::AppendS},   {"ggy", 3, Hyphenator::Replacement::AppendY},
      {"lly", 3, Hyphenator::Replacement::AppendY},   {"nny", 3, Hyphenator::Replacement::AppendY},
      {"ssz", 3, Hyphenator::Replacement::AppendZ},   {"tty", 3, Hyphenator::Replacement::AppendY},
      {"zzs", 3, Hyphenator::Replacement::AppendS},   {"ddz", 3, Hyphenator::Replacement::AppendZ},
      {"ddzs", 4, Hyphenator::Replacement::AppendZS},
  };

  for (size_t i = 0; i < cps.size(); ++i) {
    for (const auto& rule : rules) {
      if (i + rule.length > cps.size()) continue;
      bool matches = true;
      for (size_t j = 0; j < rule.length; ++j) {
        if (asciiLower(cps[i + j].value) != static_cast<uint32_t>(rule.compact[j])) {
          matches = false;
          break;
        }
      }
      if (!matches) continue;

      // The doubled consonant must be directly between vowels. This excludes
      // rosszfiúi (ssz followed by f) and gally (lly at the end), while allowing
      // asszony, asszonnyal, hosszú, mennyi, meccsen and gallyak.
      if (i == 0 || i + rule.length >= cps.size()) continue;
      if (!isHungarianVowel(cps[i - 1].value) || !isHungarianVowel(cps[i + rule.length].value)) continue;

      const size_t split = i + 1;
      if (split == 0 || split >= cps.size()) continue;
      // Secondary readability guard: both rendered word parts must contain a vowel.
      if (!hasHungarianVowel(cps, 0, split) || !hasHungarianVowel(cps, split, cps.size())) continue;
      outBreaks.push_back({byteOffsetForIndex(cps, split), true, rule.replacement});
    }
  }
}

'''
          s, n = re.subn(r'// Extended Hungarian handling never creates a new break\..*?\nvoid sortAndDedupeBreakInfos', new_func + 'void sortAndDedupeBreakInfos', s, flags=re.S)
          assert n == 1, f'extended function block replacements: {n}'

          s = s.replace('''    // Only legal pattern breaks can receive Hungarian replacement behavior.\n    if (useHungarianExtended) {\n      applyHungarianExtendedReplacements(cps, explicitBreakInfos);\n    }''', '''    if (useHungarianExtended) {\n      appendHungarianExtendedBreaks(cps, explicitBreakInfos);\n    }''')

          s = s.replace('''      // In extended Hungarian mode fallback points must not enable replacement\n      // hyphenation, so only real language-pattern breaks are used here.\n      appendSegmentPatternBreaks(cps, *hyphenator, includeFallback && !useHungarianExtended, segmentedBreaks);''', '''      appendSegmentPatternBreaks(cps, *hyphenator, includeFallback, segmentedBreaks);''')
          s = s.replace('''    if (useHungarianExtended) {\n      applyHungarianExtendedReplacements(cps, segmentedBreaks);\n    }''', '''    if (useHungarianExtended) {\n      appendHungarianExtendedBreaks(cps, segmentedBreaks);\n    }''')

          s = s.replace('''  // Only add fallback breaks if needed. Extended Hungarian deliberately does\n  // not use fallback points because replacements must be backed by a real\n  // Liang/hyph-hu pattern match.\n  if (includeFallback && indexes.empty() && !useHungarianExtended) {''', '''  // Only add fallback breaks if needed.\n  if (includeFallback && indexes.empty()) {''')

          old = '''  if (indexes.empty()) {\n    return {};\n  }\n\n  std::vector<Hyphenator::BreakInfo> breaks;\n  breaks.reserve(indexes.size());'''
          new = '''  std::vector<Hyphenator::BreakInfo> breaks;\n  if (useHungarianExtended) {\n    appendHungarianExtendedBreaks(cps, breaks);\n  }\n\n  if (indexes.empty() && breaks.empty()) {\n    return {};\n  }\n\n  breaks.reserve(breaks.size() + indexes.size());'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\n  if (useHungarianExtended) {\n    applyHungarianExtendedReplacements(cps, breaks);\n  }\n\n  sortAndDedupeBreakInfos(breaks);'''
          assert old in s
          s = s.replace(old, '\n  sortAndDedupeBreakInfos(breaks);', 1)

          p.write_text(s)

          y = Path('lib/I18n/translations/hungarian.yaml')
          t = y.read_text()
          assert 'STR_LAYOUT: "Rendezés"' in t
          t = t.replace('STR_LAYOUT: "Rendezés"', 'STR_LAYOUT: "Rendez."', 1)
          y.write_text(t)
          PY

          git diff --check
          grep -q 'STR_LAYOUT: "Rendez."' lib/I18n/translations/hungarian.yaml
          grep -q 'appendHungarianExtendedBreaks' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q 'i + rule.length >= cps.size()' lib/Epub/Epub/hyphenation/Hyphenator.cpp
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Epub/Epub/hyphenation/Hyphenator.cpp lib/I18n/translations/hungarian.yaml
          git commit -m "Fix extended Hungarian hyphenation vowel guard and shorten layout label"
          git push origin HEAD:agent/hungarian-integrated-v1.6.0rc
