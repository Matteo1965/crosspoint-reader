name: Build CPHUN-106 Bookmark Position

on:
  push:
    branches: [agent/cphun-106-bookmark-position]
    paths:
      - '.github/workflows/build-cphun-106-bookmark-position.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-106-bookmark-position
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-106 patch
        run: python3 tools/cphun106_bookmark_position_patch.py

      - name: Verify CPHUN-106 scope
        run: |
          git diff --check
          grep -q 'CPHUN-260912-106' src/CPHUNBuildId.h
          grep -q 'bookmarkStatusIconWidth = 32' src/components/themes/BaseTheme.cpp
          grep -q 'bookmarkStatusIconHeight = 32' src/components/themes/BaseTheme.cpp
          grep -q 'drawBookmarkStatusIcon(renderer, 446, 4)' src/components/themes/BaseTheme.cpp

      - name: Commit CPHUN-106 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CPHUNBuildId.h src/components/themes/BaseTheme.cpp
          git commit -m 'CPHUN-106: set X4 bookmark position to 446,4'
          git push origin HEAD:agent/cphun-106-bookmark-position

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-106 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-106 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260912-106-Bookmark-Position-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
