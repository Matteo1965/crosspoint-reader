name: Build CPHUN-260828-29 Fine Tracking Scale

on:
  push:
    branches:
      - agent/cphun-260827-19-typography
    paths:
      - tools/cphun_29_tracking_threshold_scale_600_180.py
      - .github/workflows/build-cphun-260828-29.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260828-29
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout typography branch
        uses: actions/checkout@v4
        with:
          ref: agent/cphun-260827-19-typography
          submodules: recursive
          fetch-depth: 0

      - name: Verify CPHUN-28 baseline
        run: |
          set -euo pipefail
          grep -q 'SECTION_FILE_VERSION = 53' lib/Epub/Epub/Section.cpp
          grep -q 'uint16_t letterSpacingLimitPercent = 0' src/CrossPointSettings.h
          grep -q 'uint16_t letterSpacingLimitPercent = 0' lib/Epub/Epub/ReaderRenderSpec.h
          grep -q '390 - idx \* 30' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'letterSpacingPx = 1' lib/Epub/Epub/ParsedText.cpp
          ! grep -q 'letterSpacingPx = 2' lib/Epub/Epub/ParsedText.cpp

      - name: Apply 600-180 percent fine tracking scale
        run: |
          set -euo pipefail
          python3 tools/cphun_29_tracking_threshold_scale_600_180.py
          git diff --check
          grep -q '0, 600, 500, 420, 360, 300, 240, 180' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'SETTINGS.letterSpacingLimitPercent = thresholds\[idx\]' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'letterSpacingLimitPercent != 600' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 500' src/CrossPointSettings.cpp
          grep -q 'letterSpacingLimitPercent != 420' src/CrossPointSettings.cpp
          grep -q 'finalAverageGap \* 100 > naturalAverageGap \* letterSpacingLimitPercent' lib/Epub/Epub/ParsedText.cpp
          grep -q 'letterSpacingPx = 1' lib/Epub/Epub/ParsedText.cpp
          ! grep -q 'letterSpacingPx = 2' lib/Epub/Epub/ParsedText.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test -j2

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Commit validated CPHUN-260828-29 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          git add src/CrossPointSettings.cpp src/activities/settings/TextSettingsActivity.cpp
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-260828-29: widen fine tracking range"
            git push origin HEAD:agent/cphun-260827-19-typography
          fi

      - name: Upload CPHUN-260828-29 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260828-29-Fine-Tracking-Scale-600-180-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
