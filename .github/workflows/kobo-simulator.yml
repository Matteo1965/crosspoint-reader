          printf '%s\n' '#!/bin/sh' 'L=/mnt/onboard/.adds/crosspoint/logs' 'if [ -r "$L/cp-kobo-058-state.txt" ]; then tail -n 12 "$L/cp-kobo-058-state.txt"; else echo "058 NO LOG"; fi' > qa-clara-058/crosspoint/status-058.sh
          sh -n qa-clara-058/crosspoint/launch-058.sh
          sh -n qa-clara-058/crosspoint/status-058.sh
          printf '%s\n' 'menu_item:main:CrossPoint RoundedRaff 058:cmd_spawn:quiet:/bin/sh /mnt/onboard/.adds/crosspoint/launch-058.sh' 'menu_item:main:CrossPoint RoundedRaff Status 058:cmd_output:1000:/bin/sh /mnt/onboard/.adds/crosspoint/status-058.sh' > qa-clara-058/nickelmenu-entry.txt
          printf '%s\n' 'CP-KOBO-058 Kobo RoundedRaff visual test.' 'Smooth round raster edges, DejaVu Sans accents and FOUR Hungarian menu items.' 'Controlled FULL SCREEN FLASH refresh: expect visible black/white flashing. The display may be occupied during update.' 'Standalone static FBInk image only; Nickel and KOReader not modified, but should be checked after test.' 'Copy FOUR crosspoint files into .adds/crosspoint/. Add new .adds/nm menu entries. Only launch once.' 'Photograph screen and provide cp-kobo-058-state.txt and cp-kobo-058-output.txt.' 'Keep all previous .attempted markers. Stop testing if unexpected behavior.' > qa-clara-058/README.txt
          chmod +x qa-clara-058/crosspoint/home-058 qa-clara-058/crosspoint/launch-058.sh qa-clara-058/crosspoint/status-058.sh
          cd qa-clara-058 && zip -r ../cp-kobo-058-roundedraff-smooth.zip crosspoint nickelmenu-entry.txt README.txt elf-header.txt program-headers.txt
