name: Kobo v224 - Linux Simulator
on:
  workflow_dispatch:
  push:
    branches:
      - feature/kobo-v224
    paths:
      - 'platformio.kobo-sim.ini'
      - '.github/workflows/kobo-simulator.yml'
      - 'src/**'
      - 'lib/**'
      - 'freeink-sdk'
      - 'scripts/**'

jobs:
  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Hungarian Edition and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use SDK revision with Linux simulator libraries
        run: |
          git -C freeink-sdk fetch origin 425d200a8ea447326b4b9696e4e47dc84ad9d7f6
          git -C freeink-sdk checkout --detach 425d200a8ea447326b4b9696e4e47dc84ad9d7f6
          git -C freeink-sdk submodule update --init --recursive
          test -d freeink-sdk/libs/network/JsonSax
          test -d freeink-sdk/libs/network/CatalogList
      - name: Install native simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev libcurl4-openssl-dev pkg-config xvfb xauth
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile Linux simulator
        run: pio run -c platformio.ini -c platformio.kobo-sim.ini -e simulator
      - name: Smoke test simulator under virtual display
        run: |
          mkdir -p fs_/books qa-artifacts
          set +e
          CROSSPOINT_SIM_INPUT_SCRIPT='6500:QUIT' \
          CROSSPOINT_SIM_SCREENSHOTS='3500:qa-artifacts/startup.bmp' \
          timeout 20s xvfb-run -a -s '-screen 0 1600x1200x24' \
            .pio/build/simulator/program > qa-artifacts/simulator.log 2>&1
          result=$?
          set -e
          cat qa-artifacts/simulator.log
          echo "Simulator exit status: $result"
          if [ "$result" -ne 0 ]; then
            echo "::error::Simulator did not finish cleanly (exit $result)"
            exit 1
          fi
          test -s qa-artifacts/startup.bmp || { echo "::error::Startup screenshot was not generated"; exit 1; }
          file qa-artifacts/startup.bmp
      - name: Upload simulator smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-001-startup-screenshot-and-log
          if-no-files-found: ignore
          path: qa-artifacts/
      - name: Compile touch-capable simulator
        run: pio run -c platformio.ini -c platformio.kobo-sim.ini -e simulator_kobo_touch
      - name: Test simulated touch and capture screens
        run: |
          mkdir -p qa-touch fs_/books
          set +e
          CROSSPOINT_SIM_INPUT_SCRIPT='2500:TAP:240,530;7500:QUIT' \
          CROSSPOINT_SIM_SCREENSHOTS='1600:qa-touch/initial.bmp;5200:qa-touch/after-tap.bmp' \
          timeout 22s xvfb-run -a -s '-screen 0 1600x1200x24' \
            .pio/build/simulator_kobo_touch/program > qa-touch/touch.log 2>&1
          result=$?
          set -e
          cat qa-touch/touch.log
          echo "Touch simulator exit status: $result"
          if [ "$result" -ne 0 ]; then
            echo "::error::Touch simulator exit status $result"
            exit 1
          fi
          test -s qa-touch/initial.bmp && test -s qa-touch/after-tap.bmp || {
            echo "::error::Missing touch test screenshot"
            exit 1
          }
          file qa-touch/*.bmp
      - name: Upload touch simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-002-touch-screenshots-and-log
          if-no-files-found: ignore
          path: qa-touch/
      - name: Exercise Hungarian RoundedRaff touch gestures
        run: |
          mkdir -p fs_/.crosspoint qa-gestures
          printf '%s\n' '{"language":"HU","uiTheme":3,"touchReaderControls":1}' > fs_/.crosspoint/settings.json
          set +e
          CROSSPOINT_SIM_INPUT_SCRIPT='2500:TAP:240,530;4200:SWIPE:420,380,70,380,500;6100:SWIPE:70,380,420,380,500;7800:TAP:240,530,1200;10500:BACK;12500:QUIT' \
          CROSSPOINT_SIM_SCREENSHOTS='1800:qa-gestures/01-home-hu.bmp;3600:qa-gestures/02-after-settings-tap.bmp;5500:qa-gestures/03-after-swipe-left.bmp;7200:qa-gestures/04-after-swipe-right.bmp;9400:qa-gestures/05-after-long-press.bmp;11600:qa-gestures/06-after-back.bmp' \
          timeout 25s xvfb-run -a -s '-screen 0 1600x1200x24' \
            .pio/build/simulator_kobo_touch/program > qa-gestures/gestures.log 2>&1
          result=$?
          set -e
          cat qa-gestures/gestures.log
          echo "Gesture test exit status: $result"
          if [ "$result" -ne 0 ]; then
            echo "::error::Gesture simulator did not finish cleanly ($result)"
            exit 1
          fi
          for n in 01 02 03 04 05 06; do
            ls qa-gestures/"$n"-*.bmp >/dev/null || { echo "::error::Missing screenshot $n"; exit 1; }
          done
          file qa-gestures/*.bmp
      - name: Upload Hungarian gesture test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-003-hungarian-touch-gestures
          if-no-files-found: ignore
          path: qa-gestures/
      - name: Generate original Hungarian multi-page EPUB
        run: |
          python scripts/kobo_test_epub.py
          unzip -t fs_/books/CP-KOBO-004-magyar-teszt.epub
      - name: Explore EPUB navigation and page-turn touch
        run: |
          mkdir -p qa-reader
          set +e
          CROSSPOINT_SIM_INPUT_SCRIPT='1800:ENTER;3400:ENTER;5000:ENTER;7800:TAP:420,450;9800:SWIPE:420,430,60,430,400;11800:SWIPE:60,430,420,430,400;14000:TAP:240,400,1200;16700:QUIT' \
          CROSSPOINT_SIM_SCREENSHOTS='1300:qa-reader/01-home.bmp;2900:qa-reader/02-first-enter.bmp;4400:qa-reader/03-second-enter.bmp;6900:qa-reader/04-third-enter.bmp;9000:qa-reader/05-after-tap.bmp;11100:qa-reader/06-after-left-swipe.bmp;13100:qa-reader/07-after-right-swipe.bmp;15500:qa-reader/08-after-long-touch.bmp' \
          timeout 28s xvfb-run -a -s '-screen 0 1600x1200x24' \
            .pio/build/simulator_kobo_touch/program > qa-reader/reader.log 2>&1
          result=$?
          set -e
          cat qa-reader/reader.log
          echo "EPUB exploratory test exit status: $result"
          if [ "$result" -ne 0 ]; then
            echo "::error::Reader simulator quit unexpectedly ($result)"
            exit 1
          fi
          test -s qa-reader/08-after-long-touch.bmp || { echo "::error::Reader screenshots missing"; exit 1; }
          file qa-reader/*.bmp
      - name: Upload EPUB navigation screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-004-hungarian-epub-reader
          if-no-files-found: ignore
          path: qa-reader/
      - name: Probe CrossPoint version menu on v224
        run: |
          mkdir -p qa-version fs_/.crosspoint
          printf '%s\n' '{"language":"HU","uiTheme":3,"touchReaderControls":1}' > fs_/.crosspoint/settings.json
          set +e
          CROSSPOINT_SIM_INPUT_SCRIPT='2200:TAP:340,710;4500:TAP:420,72;6500:SWIPE:240,680,240,220,500;8400:TAP:130,626;11000:QUIT' \
          CROSSPOINT_SIM_SCREENSHOTS='1600:qa-version/01-home.bmp;3900:qa-version/02-after-menu.bmp;5800:qa-version/03-system-tab.bmp;7900:qa-version/04-system-list.bmp;10200:qa-version/05-version-candidate.bmp' \
          timeout 23s xvfb-run -a -s '-screen 0 1600x1200x24' \
            .pio/build/simulator_kobo_touch/program > qa-version/version.log 2>&1
          result=$?
          set -e
          cat qa-version/version.log
          echo "Version menu exploratory test exit status: $result"
          test "$result" -eq 0
          grep -q "Entering activity: CrossPointVersion" qa-version/version.log || { echo "::error::CrossPoint version page did not open"; exit 1; }
          test -s qa-version/05-version-candidate.bmp
          file qa-version/*.bmp
      - name: Upload v224 version-menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-v224-crosspoint-version-menu
          if-no-files-found: ignore
          path: qa-version/
      - name: Validate Kobo Clara BW display scaling and touch coordinates
        run: |
          python -m pip install pillow
          python scripts/kobo_clara_bw_geometry.py --source qa-version/05-version-candidate.bmp --output qa-clara-bw
          test -s qa-clara-bw/clara-bw-1072x1448.png
          test -s qa-clara-bw/clara-bw-touch-targets.png
          cat qa-clara-bw/geometry.json
      - name: Upload Clara BW geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-006-clara-bw-geometry
          if-no-files-found: ignore
          path: qa-clara-bw/
      - name: Validate Clara BW Variant A C++ adapter
        run: |
          mkdir -p qa-clara-adapter
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer scripts/clara_bw_adapter_test.cpp -o qa-clara-adapter/adapter-test
          ASAN_OPTIONS=detect_leaks=1 qa-clara-adapter/adapter-test | tee qa-clara-adapter/result.txt
      - name: Upload Clara BW Variant A adapter test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-007-clara-bw-adapter
          if-no-files-found: ignore
          path: qa-clara-adapter/result.txt
      - name: Validate read-only Clara BW Linux hardware probe
        run: |
          mkdir -p qa-clara-probe/fixture/sys/class/graphics/fb0
          mkdir -p qa-clara-probe/fixture/proc/bus/input qa-clara-probe/fixture/proc/device-tree
          printf '1072,1448\n' > qa-clara-probe/fixture/sys/class/graphics/fb0/virtual_size
          printf '8\n' > qa-clara-probe/fixture/sys/class/graphics/fb0/bits_per_pixel
          printf '1072\n' > qa-clara-probe/fixture/sys/class/graphics/fb0/stride
          printf 'mock_fb\n' > qa-clara-probe/fixture/sys/class/graphics/fb0/name
          printf 'N: Name="Mock Clara Touch"\nH: Handlers=event0 mouse0\n' > qa-clara-probe/fixture/proc/bus/input/devices
          printf 'Mock Kobo Clara BW\n' > qa-clara-probe/fixture/proc/device-tree/model
          python scripts/kobo_clara_bw_probe.py --root qa-clara-probe/fixture --output qa-clara-probe/inventory.json
          python -c 'import json; d=json.load(open("qa-clara-probe/inventory.json")); assert d["framebuffers"][0]["virtual_size"]=="1072,1448"; assert d["input_devices"][0]["name"]=="Mock Clara Touch"; assert not d["fbink_present"]'
      - name: Upload Clara BW probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-008-readonly-linux-probe
          if-no-files-found: ignore
          path: qa-clara-probe/inventory.json
      - name: Validate CP-KOBO-009 read-only evdev axis probe
        run: |
          mkdir -p qa-clara-evdev
          python -m py_compile scripts/kobo_clara_bw_evdev_probe.py
          python scripts/kobo_clara_bw_evdev_probe.py --device /dev/null --device /does/not/exist --output qa-clara-evdev/probe.json
          python -c 'import json; d=json.load(open("qa-clara-evdev/probe.json")); assert len(d["devices"]) == 2; assert all("error" not in a or isinstance(a["error"],str) for a in d["devices"]); assert d["devices"][1]["error"].startswith("FileNotFoundError")'
      - name: Upload CP-KOBO-009 read-only evdev probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-009-evdev-readonly-probe
          if-no-files-found: ignore
          path: qa-clara-evdev/probe.json
      - name: Validate CP-KOBO-010 FBInk dry-run integration
        run: |
          mkdir -p qa-clara-fbink
          python -m py_compile scripts/kobo_clara_bw_fbink.py
          python scripts/kobo_clara_bw_fbink.py --image qa-clara-bw/clara-bw-1072x1448.png --output qa-clara-fbink/dry-run.json
          python -c 'import json; d=json.load(open("qa-clara-fbink/dry-run.json")); assert d["mode"]=="dry-run"; assert d["dimensions"]==[1072,1448]; assert d["command"][1:]==["-W","AUTO","-i",d["image"]]'
          if python scripts/kobo_clara_bw_fbink.py --image qa-clara-bw/clara-bw-1072x1448.png --display >/dev/null 2>&1; then
            echo "::error::FBInk display ran without explicit --allow-write"
            exit 1
          fi
      - name: Upload CP-KOBO-010 FBInk dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-010-fbink-dry-run
          if-no-files-found: ignore
          path: qa-clara-fbink/dry-run.json
      - name: Validate CP-KOBO-011 independent exit watchdog
        run: |
          mkdir -p qa-clara-supervisor
          python -m py_compile scripts/kobo_clara_bw_supervisor.py
          python scripts/kobo_clara_bw_supervisor.py --execute --limit 3 --output qa-clara-supervisor/normal.json -- python -c 'print("normal exit")'
          python -c 'import json; d=json.load(open("qa-clara-supervisor/normal.json")); assert d["mode"]=="normal_exit" and d["exit_code"]==0 and not d["nickel_restored"]'
          if python scripts/kobo_clara_bw_supervisor.py --execute --limit 0.5 --grace 0.3 --output qa-clara-supervisor/timeout.json -- python -c 'import time; time.sleep(20)'; then
            echo "::error::Hanging child unexpectedly reported success"
            exit 1
          fi
          python -c 'import json; d=json.load(open("qa-clara-supervisor/timeout.json")); assert d["mode"]=="timeout" and not d["nickel_restored"] and d["duration_seconds"]<5'
          if python scripts/kobo_clara_bw_supervisor.py -- python -c 'print("unexpected")' >/dev/null 2>&1; then
            echo "::error::Child started without explicit --execute"
            exit 1
          fi
      - name: Upload CP-KOBO-011 supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-011-exit-watchdog
          if-no-files-found: ignore
          path: qa-clara-supervisor/*.json
      - name: Validate CP-KOBO-012 guarded NickelMenu launcher
        run: |
          mkdir -p qa-clara-launcher/app
          cp scripts/kobo_clara_bw_supervisor.py qa-clara-launcher/app/supervisor.py
          cp scripts/kobo_clara_bw_start.sh qa-clara-launcher/app/start.sh
          sh -n qa-clara-launcher/app/start.sh
          printf '#!/bin/sh\nexit 0\n' > qa-clara-launcher/app/crosspoint-kobo
          chmod +x qa-clara-launcher/app/crosspoint-kobo
          if CROSSPOINT_APP_DIR="$PWD/qa-clara-launcher/app" sh qa-clara-launcher/app/start.sh > qa-clara-launcher/refusal.log 2>&1; then
            echo "::error::Launcher allowed execution without device opt-in"
            exit 1
          fi
          grep -q 'launch disabled' qa-clara-launcher/refusal.log
          CROSSPOINT_ENABLE_KOBO_LAUNCH=1 CROSSPOINT_TEST_LIMIT=2 CROSSPOINT_APP_DIR="$PWD/qa-clara-launcher/app" sh qa-clara-launcher/app/start.sh
          python -c 'import json; d=json.load(open("qa-clara-launcher/app/logs/last-run.json")); assert d["mode"]=="normal_exit" and d["exit_code"]==0 and d["nickel_restored"] is False'
          cp qa-clara-launcher/app/logs/last-run.json qa-clara-launcher/normal.json
      - name: Upload CP-KOBO-012 launch safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-012-nickelmenu-launcher
          if-no-files-found: ignore
          path: |
            qa-clara-launcher/refusal.log
            qa-clara-launcher/normal.json
      - name: Build CP-KOBO-013 ARM Linux adapter diagnostic
        run: |
          sudo apt-get install -y g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
          mkdir -p qa-clara-arm
          arm-linux-gnueabihf-g++ -std=c++17 -O2 -Wall -Wextra -Werror scripts/clara_bw_adapter_test.cpp -o qa-clara-arm/clara-bw-adapter-armhf
          file qa-clara-arm/clara-bw-adapter-armhf | tee qa-clara-arm/binary-type.txt
          arm-linux-gnueabihf-readelf -h qa-clara-arm/clara-bw-adapter-armhf > qa-clara-arm/elf-header.txt
          arm-linux-gnueabihf-readelf -d qa-clara-arm/clara-bw-adapter-armhf > qa-clara-arm/dynamic-libs.txt
          grep -q 'Machine:.*ARM' qa-clara-arm/elf-header.txt
          grep -q 'ELF32' qa-clara-arm/elf-header.txt
          grep -q 'ARM' qa-clara-arm/binary-type.txt
          printf '%s\n' 'ARM cross-compilation passed. Diagnostic adapter ONLY, not a full Kobo CrossPoint application.' | tee qa-clara-arm/README.txt
      - name: Upload CP-KOBO-013 ARM diagnostic binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-013-armhf-adapter-diagnostic
          if-no-files-found: ignore
          path: qa-clara-arm/
      - name: Assess CP-KOBO-014 CrossPoint ARM migration dependencies
        run: |
          mkdir -p qa-clara-arm-migration
          python -m py_compile scripts/kobo_arm_migration_inventory.py
          python scripts/kobo_arm_migration_inventory.py --root . --out qa-clara-arm-migration/dependencies.json
          python -c 'import json; d=json.load(open("qa-clara-arm-migration/dependencies.json")); assert d["files_with_markers"]>0; assert any(r["path"]=="src/main.cpp" for r in d["files"]); print(d["categories"])'
          printf '%s\n' 'Porting inventory only. This CI job does NOT build the full ARM CrossPoint app.' > qa-clara-arm-migration/STATUS.txt
      - name: Upload CP-KOBO-014 source migration inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-014-arm-migration-inventory
          if-no-files-found: ignore
          path: qa-clara-arm-migration/
      - name: Validate CP-KOBO-015 portable Kobo HAL contract
        run: |
          mkdir -p qa-clara-hal
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer scripts/clara_bw_platform_test.cpp -o qa-clara-hal/test-native
          qa-clara-hal/test-native | tee qa-clara-hal/result.txt
          arm-linux-gnueabihf-g++ -std=c++17 -O2 -Wall -Wextra -Werror scripts/clara_bw_platform_test.cpp -o qa-clara-hal/test-armhf
          arm-linux-gnueabihf-readelf -h qa-clara-hal/test-armhf > qa-clara-hal/arm-elf-header.txt
          grep -q 'Machine:.*ARM' qa-clara-hal/arm-elf-header.txt
      - name: Upload CP-KOBO-015 HAL contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-015-portable-hal-contract
          if-no-files-found: ignore
          path: |
            qa-clara-hal/result.txt
            qa-clara-hal/arm-elf-header.txt
      - name: Validate CP-KOBO-016 no-I/O Linux bridge
        run: |
          mkdir -p qa-clara-bridge
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer scripts/clara_bw_bridge_test.cpp -o qa-clara-bridge/test-native
          qa-clara-bridge/test-native | tee qa-clara-bridge/result.txt
          arm-linux-gnueabihf-g++ -std=c++17 -O2 -Wall -Wextra -Werror scripts/clara_bw_bridge_test.cpp -o qa-clara-bridge/test-armhf
          arm-linux-gnueabihf-readelf -h qa-clara-bridge/test-armhf > qa-clara-bridge/arm-elf-header.txt
          grep -q 'Machine:.*ARM' qa-clara-bridge/arm-elf-header.txt
      - name: Upload CP-KOBO-016 bridge results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-016-display-touch-bridge
          if-no-files-found: ignore
          path: |
            qa-clara-bridge/result.txt
            qa-clara-bridge/arm-elf-header.txt
      - name: Validate CP-KOBO-017 synthetic evdev events
        run: |
          mkdir -p qa-clara-evdev-decoder
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer scripts/clara_bw_evdev_decoder_test.cpp -o qa-clara-evdev-decoder/test-native
          qa-clara-evdev-decoder/test-native | tee qa-clara-evdev-decoder/result.txt
          arm-linux-gnueabihf-g++ -std=c++17 -O2 -Wall -Wextra -Werror scripts/clara_bw_evdev_decoder_test.cpp -o qa-clara-evdev-decoder/test-armhf
          arm-linux-gnueabihf-readelf -h qa-clara-evdev-decoder/test-armhf > qa-clara-evdev-decoder/arm-elf-header.txt
          grep -q 'Machine:.*ARM' qa-clara-evdev-decoder/arm-elf-header.txt
      - name: Upload CP-KOBO-017 evdev decoder results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-017-evdev-decoder
          if-no-files-found: ignore
          path: |
            qa-clara-evdev-decoder/result.txt
            qa-clara-evdev-decoder/arm-elf-header.txt
      - name: Validate CP-KOBO-018 FBInk PNM display sink
        run: |
          mkdir -p qa-clara-fbink-cpp
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer scripts/clara_bw_fbink_sink_test.cpp -o qa-clara-fbink-cpp/test-native
          qa-clara-fbink-cpp/test-native qa-clara-fbink-cpp/frame.pgm | tee qa-clara-fbink-cpp/result.txt
          python -c 'from pathlib import Path; p=Path("qa-clara-fbink-cpp/frame.pgm"); assert p.stat().st_size==len(b"P5\n1072 1448\n255\n")+1072*1448'
          arm-linux-gnueabihf-g++ -std=c++17 -O2 -Wall -Wextra -Werror scripts/clara_bw_fbink_sink_test.cpp -o qa-clara-fbink-cpp/test-armhf
          arm-linux-gnueabihf-readelf -h qa-clara-fbink-cpp/test-armhf > qa-clara-fbink-cpp/arm-elf-header.txt
          grep -q 'Machine:.*ARM' qa-clara-fbink-cpp/arm-elf-header.txt
      - name: Upload CP-KOBO-018 FBInk output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-kobo-018-fbink-cpp-output
          if-no-files-found: ignore
          path: |
            qa-clara-fbink-cpp/result.txt
            qa-clara-fbink-cpp/arm-elf-header.txt
            qa-clara-fbink-cpp/frame.pgm
      - name: Validate CP-KOBO-019 touch-to-display integration and watchdog
        run: |
          mkdir -p qa-clara-integration
