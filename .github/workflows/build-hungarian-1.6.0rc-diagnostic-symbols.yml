name: Build Hungarian 1.6.0rc Diagnostic Symbols

'on':
  workflow_dispatch:
  push:
    branches:
      - hungarian-hyphenation
    paths:
      - '.github/workflows/build-hungarian-1.6.0rc-diagnostic-symbols.yml'

permissions:
  contents: read

jobs:
  symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out integrated Hungarian source
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Restore exact diagnostic patch chain
        shell: bash
        run: |
          set -euo pipefail
          DIAG_COMMIT=0517f41175bb2be5bff7e43dd2ae82b0d872b34b
          git fetch origin "$DIAG_COMMIT"
          git show "$DIAG_COMMIT":.github/workflows/build-hungarian-1.6.0rc-parser-dialogue-fix.yml > /tmp/base-workflow.yml
          git show "$DIAG_COMMIT":.github/workflows/build-hungarian-1.6.0rc-space-tuning-v2.yml > /tmp/space-v2.yml
          git show "$DIAG_COMMIT":.github/workflows/build-hungarian-1.6.0rc-space-indexing-version.yml > /tmp/current-rc.yml
          for s in \
            apply_integrated_typography_test.py \
            apply_hanging_ratios.py \
            apply_typography_round2_fixes.py \
            apply_paragraph_final_remainder_guard.py \
            apply_minspace_finalhyphen_and_responsive_font_reflow.py \
            apply_responsive_font_reflow_offset_fix.py \
            apply_font_reflow_background_scheduler_fix.py \
            apply_targeted_parser_timeslice_reflow.py \
            apply_performance_diagnostics.py; do
            git show "$DIAG_COMMIT":.github/scripts/$s > /tmp/$s
          done
          python3 /tmp/apply_integrated_typography_test.py
          python3 /tmp/apply_hanging_ratios.py
          python3 /tmp/apply_typography_round2_fixes.py
          python3 /tmp/apply_paragraph_final_remainder_guard.py
          python3 /tmp/apply_minspace_finalhyphen_and_responsive_font_reflow.py
          python3 /tmp/apply_responsive_font_reflow_offset_fix.py
          python3 /tmp/apply_font_reflow_background_scheduler_fix.py
          python3 /tmp/apply_targeted_parser_timeslice_reflow.py
          python3 /tmp/apply_performance_diagnostics.py
          git diff --check

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Rebuild exact diagnostic firmware with symbols
        run: .venv/bin/pio run -e gh_release_rc

      - name: Verify symbol files
        run: |
          test -f .pio/build/gh_release_rc/firmware.elf
          test -f .pio/build/gh_release_rc/firmware.map
          sha256sum .pio/build/gh_release_rc/firmware.bin .pio/build/gh_release_rc/firmware.elf

      - name: Decode known crash addresses
        shell: bash
        run: |
          set -euo pipefail
          ADDR2LINE=$(find ~/.platformio ~/.cache -type f -name '*addr2line' 2>/dev/null | grep xtensa | head -1)
          test -n "$ADDR2LINE"
          "$ADDR2LINE" -pfiaC -e .pio/build/gh_release_rc/firmware.elf \
            0x4207B8BE 0x4207B904 0x420023FA 0x4200B2E6 0x4200B846 0x4200B516 \
            0x4200B7F4 0x4200B876 0x4200BAC6 0x420092D2 0x420093A8 0x4200A424 \
            0x42009908 0x4200AF44 0x4200B26E 0x420CDA24 | tee crash-addr2line.txt

      - name: Upload diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-hungarian-1.6.0rc-diagnostic-symbols
          path: |
            .pio/build/gh_release_rc/firmware.elf
            .pio/build/gh_release_rc/firmware.map
            .pio/build/gh_release_rc/firmware.bin
            crash-addr2line.txt
          if-no-files-found: error
