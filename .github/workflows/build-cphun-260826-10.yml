name: Build CPHUN-260826-10 MinSpace Optical Fix

on:
  push:
    branches:
      - agent/hungarian-v1.6.0rc-minspace-optical-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hungarian-v1.6.0rc-minspace-optical-fix
          submodules: recursive
          fetch-depth: 0

      - name: Restore proven MinSpace package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/build-cphun-minspace-test.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply-minspace.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/apply-minspace.py'], check=True)
          PY
          git diff --check

      - name: Apply optical floating hyphen correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/Epub/Epub/ParsedText.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''  const int punctuationAdvance =\n      cachedHangingPunctuationAdvance(renderer, fontId, style, punctuation, word.c_str() + lastStart);\n  const int proportionalAdvance = (punctuationAdvance * std::min<int>(percentStep, 5) + 4) / 5;\n'''
          new = '''  // Use the hyphen's effective contribution inside this exact word rather than\n  // its standalone advance. Pair kerning (e.g. g- versus r-) can otherwise make\n  // two justified, hyphenated lines end at visibly different x positions.\n  const std::string prefixWithoutPunctuation = word.substr(0, lastStart);\n  const int fullWordAdvance = std::max(0, renderer.getTextAdvanceX(fontId, word.c_str(), style));\n  const int prefixAdvance = prefixWithoutPunctuation.empty()\n                                ? 0\n                                : std::max(0, renderer.getTextAdvanceX(fontId, prefixWithoutPunctuation.c_str(), style));\n  const int punctuationAdvance = std::max(0, fullWordAdvance - prefixAdvance);\n  const int proportionalAdvance = (punctuationAdvance * std::min<int>(percentStep, 5) + 4) / 5;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'optical hyphen marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Verify restored features
        shell: bash
        run: |
          set -euo pipefail
          check() { echo "[verify] $1"; shift; "$@"; }
          check minspace-setting grep -q 'minimumSpacePercent' src/CrossPointSettings.h
          check minspace-menu grep -q 'MinimumSpace' src/activities/settings/TextSettingsActivity.h
          check minspace-label grep -q 'Min. szóköz' src/activities/settings/TextSettingsActivity.cpp
          check minspace-render grep -q 'scaledNormalSpaceAdvance' lib/Epub/Epub/ParsedText.cpp
          check optical-pair-contribution grep -q 'prefixWithoutPunctuation' lib/Epub/Epub/ParsedText.cpp
          check floating-hyphen-only grep -q "return cp == '-'" lib/Epub/Epub/ParsedText.cpp
          check floating-default grep -q 'hangingPunctuation = 100' src/CrossPointSettings.h
          check margin-min grep -q 'SCREEN_MARGIN_MIN = 4' src/CrossPointSettings.h
          check margin-max grep -q 'SCREEN_MARGIN_MAX = 32' src/CrossPointSettings.h
          check hu-hyphen-1-2 grep -q 'hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 1, 2)' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Show firmware size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          print(f'firmware.bin: {fw.stat().st_size} bytes ({fw.stat().st_size / 1024:.1f} KiB)')
          PY

      - name: Upload CPHUN-260826-10 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260826-10-MinSpace-Optical-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          rm -f .github/workflows/build-cphun-260826-10.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore MinSpace and align floating hyphens optically"
            git push origin HEAD:agent/hungarian-v1.6.0rc-minspace-optical-fix
          fi
