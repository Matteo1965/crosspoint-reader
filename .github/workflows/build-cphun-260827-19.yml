name: Build CPHUN-260827-19 Typography Quickfix

on:
  push:
    branches:
      - agent/cphun-260827-19-typography
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260827-19

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-260827-19-typography
          submodules: recursive
          fetch-depth: 0

      - name: Apply optical-margin and fixed-dialogue quickfix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The validated CPHUN-19 source is already on this branch. Apply only
          # the two requested follow-up fixes; do not touch letter-spacing logic.
          p = Path("src/CrossPointSettings.cpp")
          s = p.read_text(encoding="utf-8")
          old = "spec.hangingPunctuationLimitPx = hangingPunctuation ? static_cast<uint8_t>(std::min<int>(31, screenMargin)) : 0;"
          new = "spec.hangingPunctuationLimitPx = hangingPunctuation && screenMargin > 0 ? static_cast<uint8_t>(screenMargin - 1) : 0;"
          if s.count(old) != 1:
              raise SystemExit(f"optical margin marker: expected 1, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("lib/Epub/Epub/ParsedText.cpp")
          s = p.read_text(encoding="utf-8")

          old_head = """int hangingPunctuationAllowance(const GfxRenderer& renderer, const int fontId, const std::string& word,
                                const EpdFontFamily::Style style, const uint8_t packedSetting) {
  const uint8_t percentStep = packedSetting >> 5;
  const uint8_t pixelLimit = static_cast<uint8_t>(packedSetting & 0x1F);
  if (percentStep == 0 || pixelLimit == 0 || word.empty()) return 0;
"""
          new_head = """int hangingPunctuationAllowance(const GfxRenderer& renderer, const int fontId, const std::string& word,
                                const EpdFontFamily::Style style, const uint8_t pixelLimit) {
  if (pixelLimit == 0 || word.empty()) return 0;
"""
          if s.count(old_head) != 1:
              raise SystemExit(f"hanging allowance header: expected 1, found {s.count(old_head)}")
          s = s.replace(old_head, new_head, 1)

          old_tail = """  const int proportionalAdvance = (punctuationAdvance * std::min<int>(percentStep, 5) + 4) / 5;
  return std::min<int>(pixelLimit, proportionalAdvance);
"""
          new_tail = """  // Optikai margó is now a simple OFF/ON control. ON means 100% of
  // the punctuation contribution may hang, capped by screenMargin - 1 so one
  // physical pixel remains as the right-side safety strip.
  return std::min<int>(pixelLimit, punctuationAdvance);
"""
          if s.count(old_tail) != 1:
              raise SystemExit(f"hanging allowance tail: expected 1, found {s.count(old_tail)}")
          s = s.replace(old_tail, new_tail, 1)

          # Fixed dialogue spacing must always use the font's natural (100%)
          # space advance. Only calls whose second argument is exactly
          # minimumSpacePercent_ are replaced; general Min. word spacing remains untouched.
          pattern = re.compile(
              r"scaledNormalSpaceAdvance\(\s*"
              r"(renderer\.getSpaceAdvance\((?:[^()]|\([^()]*\))*\))\s*,\s*"
              r"minimumSpacePercent_\s*\)",
              re.MULTILINE,
          )
          s, count = pattern.subn(r"\1", s)
          if count < 3:
              raise SystemExit(f"fixed dialogue natural-space replacements: expected at least 3, found {count}")

          p.write_text(s, encoding="utf-8")
          print(f"Applied optical margin (1 px safety) and fixed dialogue spacing fixes; dialogue replacements={count}")
          PY
          git diff --check

      - name: Configure unit tests
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test -j2

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Commit validated CPHUN-260827-19 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          git add \
            src/CrossPointSettings.cpp \
            lib/Epub/Epub/ParsedText.cpp
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-260827-19: fix optical margin and fixed dialogue spacing"
            git push origin HEAD:agent/cphun-260827-19-typography
          fi

      - name: Upload CPHUN-260827-19 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260827-19-Typography-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
