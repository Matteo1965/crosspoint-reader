name: Build Hungarian 1.6.0rc Space tuning + dialogue gap fix

'on':
  workflow_dispatch:
  push:
    branches: [hungarian-hyphenation]
    paths:
      - '.github/workflows/build-hungarian-1.6.0rc-space-tuning.yml'

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current integrated Hungarian source
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Apply parser dialogue, quoted compound and minimum-space fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def ro(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8'); n=t.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:80]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          # --- Settings: minimum normal word-space percentage, default 100 ---
          h='src/CrossPointSettings.h'
          ro(h,'  uint8_t fixedDialogueSpacing = 0;\n','  uint8_t fixedDialogueSpacing = 0;\n  // Minimum normal word gap used by justified layout: 50..100 percent of the font natural space.\n  uint8_t minimumSpacePercent = 100;\n')

          c='src/CrossPointSettings.cpp'
          ro(c,'  doc["fixedDialogueSpacing"] = fixedDialogueSpacing;\n','  doc["fixedDialogueSpacing"] = fixedDialogueSpacing;\n  doc["minimumSpacePercent"] = minimumSpacePercent;\n')
          ro(c,'  fixedDialogueSpacing = (doc["fixedDialogueSpacing"] | (uint8_t)0) ? 1 : 0;\n','  fixedDialogueSpacing = (doc["fixedDialogueSpacing"] | (uint8_t)0) ? 1 : 0;\n  minimumSpacePercent = doc["minimumSpacePercent"] | (uint8_t)100;\n  if (minimumSpacePercent < 50 || minimumSpacePercent > 100 || minimumSpacePercent % 10 != 0) {\n    minimumSpacePercent = 100;\n    needsResave = true;\n  }\n')
          ro(c,'  spec.fixedDialogueSpacing = fixedDialogueSpacing != 0;\n','  spec.fixedDialogueSpacing = fixedDialogueSpacing != 0;\n  spec.minimumSpacePercent = minimumSpacePercent;\n')

          # --- Reader spec / cache key ---
          rs='lib/Epub/Epub/ReaderRenderSpec.h'
          ro(rs,'  bool fixedDialogueSpacing = false;\n','  bool fixedDialogueSpacing = false;\n  uint8_t minimumSpacePercent = 100;\n')

          sec='lib/Epub/Epub/Section.cpp'
          ro(sec,'constexpr uint8_t SECTION_FILE_VERSION = 44;','constexpr uint8_t SECTION_FILE_VERSION = 47;')
          ro(sec,'                                 sizeof(bool) + sizeof(uint8_t) + sizeof(bool) + sizeof(bool) + sizeof(uint8_t) +\n',
                 '                                 sizeof(bool) + sizeof(uint8_t) + sizeof(bool) + sizeof(uint8_t) + sizeof(bool) + sizeof(uint8_t) +\n')
          ro(sec,'                                   sizeof(spec.hangingPunctuationLimitPx) + sizeof(spec.fixedDialogueSpacing) +\n                                   sizeof(spec.embeddedStyle)',
                 '                                   sizeof(spec.hangingPunctuationLimitPx) + sizeof(spec.fixedDialogueSpacing) +\n                                   sizeof(spec.minimumSpacePercent) + sizeof(spec.embeddedStyle)')
          ro(sec,'  serialization::writePod(file, spec.fixedDialogueSpacing);\n  serialization::writePod(file, spec.embeddedStyle);\n',
                 '  serialization::writePod(file, spec.fixedDialogueSpacing);\n  serialization::writePod(file, spec.minimumSpacePercent);\n  serialization::writePod(file, spec.embeddedStyle);\n')
          ro(sec,'    bool fileFixedDialogueSpacing;\n    bool fileEmbeddedStyle;\n',
                 '    bool fileFixedDialogueSpacing;\n    uint8_t fileMinimumSpacePercent;\n    bool fileEmbeddedStyle;\n')
          ro(sec,'    serialization::readPod(file, fileFixedDialogueSpacing);\n    serialization::readPod(file, fileEmbeddedStyle);\n',
                 '    serialization::readPod(file, fileFixedDialogueSpacing);\n    serialization::readPod(file, fileMinimumSpacePercent);\n    serialization::readPod(file, fileEmbeddedStyle);\n')
          ro(sec,'        spec.hangingPunctuationLimitPx != fileHangingPunctuationLimitPx || spec.embeddedStyle != fileEmbeddedStyle ||\n',
                 '        spec.hangingPunctuationLimitPx != fileHangingPunctuationLimitPx ||\n        spec.fixedDialogueSpacing != fileFixedDialogueSpacing || spec.minimumSpacePercent != fileMinimumSpacePercent ||\n        spec.embeddedStyle != fileEmbeddedStyle ||\n')
          ro(sec,'  Hyphenator::setPreferredLanguage(epub->getLanguage());\n',
                 '  ParsedText::setMinimumSpacePercent(spec.minimumSpacePercent);\n  Hyphenator::setPreferredLanguage(epub->getLanguage());\n')

          # --- ParsedText: justified gaps can shrink to selected percentage ---
          ph='lib/Epub/Epub/ParsedText.h'
          ro(ph,'class ParsedText {\n','class ParsedText {\n  static uint8_t minimumSpacePercent_;\n')
          ro(ph,' public:\n  explicit ParsedText(', ' public:\n  static void setMinimumSpacePercent(uint8_t percent) { minimumSpacePercent_ = percent; }\n  explicit ParsedText(')

          pc='lib/Epub/Epub/ParsedText.cpp'
          ro(pc,'constexpr int MAX_COST = std::numeric_limits<int>::max();\n','constexpr int MAX_COST = std::numeric_limits<int>::max();\nuint8_t ParsedText::minimumSpacePercent_ = 100;\n')
          ro(pc,'int computeJustifyExtra(const int spareSpace, const size_t gapCount) {\n',
                 'int scaledNormalSpaceAdvance(const GfxRenderer& renderer, const int fontId, const uint32_t leftCp,\n                             const uint32_t rightCp, const EpdFontFamily::Style style, const uint8_t percent) {\n  const int natural = renderer.getSpaceAdvance(fontId, leftCp, rightCp, style);\n  return std::max(1, (natural * std::clamp<int>(percent, 50, 100) + 99) / 100);\n}\n\nint computeJustifyExtra(const int spareSpace, const size_t gapCount) {\n')
          # Replace all normal inter-word space measurements with selected minimum for justified paragraphs.
          old='renderer.getSpaceAdvance(fontId, lastCodepoint(words[j - 1]), firstCodepoint(words[j]), wordStyles[j - 1])'
          new='scaledNormalSpaceAdvance(renderer, fontId, lastCodepoint(words[j - 1]), firstCodepoint(words[j]), wordStyles[j - 1], blockStyle.alignment == CssTextAlign::Justify ? minimumSpacePercent_ : 100)'
          t=Path(pc).read_text(encoding='utf-8'); n=t.count(old)
          if n < 2: raise SystemExit(f'ParsedText.cpp: expected >=2 line-break space calls, got {n}')
          t=t.replace(old,new)
          # Render/extract paths use lineWords rather than words.
          old2='renderer.getSpaceAdvance(fontId, lastCodepoint(lineWords[wordIdx]),\n                                                 firstCodepoint(lineWords[wordIdx + 1]), lineWordStyles[wordIdx])'
          new2='scaledNormalSpaceAdvance(renderer, fontId, lastCodepoint(lineWords[wordIdx]),\n                                                 firstCodepoint(lineWords[wordIdx + 1]), lineWordStyles[wordIdx], minimumSpacePercent_)'
          n2=t.count(old2)
          if n2 < 2: raise SystemExit(f'ParsedText.cpp: expected >=2 render space calls, got {n2}')
          t=t.replace(old2,new2)
          Path(pc).write_text(t,encoding='utf-8')

          # --- Parser-level dialogue correction: normalized en dash + fixed TWO-space token ---
          pph='lib/Epub/Epub/parsers/ChapterHtmlSlimParser.h'
          ro(pph,'  bool nextWordContinues = false;  // true when next flushed word attaches to previous (inline element boundary)\n',
                 '  bool nextWordContinues = false;  // true when next flushed word attaches to previous (inline element boundary)\n  bool dialogueGapPending = false;\n')
          pp='lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp'
          ro(pp,"bool isWhitespace(const char c) { return c == ' ' || c == '\\r' || c == '\\n' || c == '\\t'; }\n",
                "bool isWhitespace(const char c) { return c == ' ' || c == '\\r' || c == '\\n' || c == '\\t'; }\n\nbool normalizeOpeningDialogueMarker(char* b, int& len) {\n  if (len <= 0) return false; b[len]='\\0';\n  const auto* p=reinterpret_cast<const unsigned char*>(b); const uint32_t cp=utf8NextCodepoint(&p);\n  if (*p != 0 || (cp!='-' && cp!=0x2013 && cp!=0x2014 && cp!=0x2212)) return false;\n  b[0]=char(0xE2); b[1]=char(0x80); b[2]=char(0x93); len=3; return true;\n}\n")
          ro(pp,'void ChapterHtmlSlimParser::startNewTextBlock(const BlockStyle& blockStyle) {\n  nextWordContinues = false;  // New block = new paragraph, no continuation\n',
                'void ChapterHtmlSlimParser::startNewTextBlock(const BlockStyle& blockStyle) {\n  nextWordContinues = false;  // New block = new paragraph, no continuation\n  dialogueGapPending = false;\n')
          oldws='''    if (isWhitespace(s[i])) {\n      // Currently looking at whitespace, if there's anything in the partWordBuffer, flush it\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n      // Whitespace is a real word boundary — reset continuation state\n      self->nextWordContinues = false;\n      // Skip the whitespace char\n      continue;\n    }\n'''
          newws='''    if (isWhitespace(s[i])) {\n      bool openingDialogueGap=false;\n      if (self->fixedDialogueSpacing && self->currentTextBlock && self->currentTextBlock->isEmpty() && self->partWordBufferIndex>0)\n        openingDialogueGap=normalizeOpeningDialogueMarker(self->partWordBuffer,self->partWordBufferIndex);\n      if (self->partWordBufferIndex>0) self->flushPartWordBuffer();\n      if (openingDialogueGap) {\n        self->partWordBuffer[0]=' '; self->partWordBuffer[1]=' '; self->partWordBuffer[2]='\\0'; self->partWordBufferIndex=2;\n        self->partWordVisibleOffset=codepointOffset; self->nextWordContinues=true; self->flushPartWordBuffer();\n        self->dialogueGapPending=true; self->nextWordContinues=true;\n      } else if (self->dialogueGapPending) self->nextWordContinues=true;\n      else self->nextWordContinues=false;\n      continue;\n    }\n'''
          ro(pp,oldws,newws)
          # For NBSP/NNBSP, normalize to the same two-space token by feeding a synthetic ASCII space through equivalent logic.
          ro(pp,'    // Detect U+00A0 (non-breaking space, UTF-8: 0xC2 0xA0) or\n',
                '    // Dialogue NBSP/NNBSP is normalized before generic no-break-space handling.\n    if (self->fixedDialogueSpacing && self->currentTextBlock && self->currentTextBlock->isEmpty() && self->partWordBufferIndex > 0 &&\n        ((static_cast<uint8_t>(s[i])==0xC2 && i+1<len && static_cast<uint8_t>(s[i+1])==0xA0) ||\n         (static_cast<uint8_t>(s[i])==0xE2 && i+2<len && static_cast<uint8_t>(s[i+1])==0x80 && static_cast<uint8_t>(s[i+2])==0xAF))) {\n      if (normalizeOpeningDialogueMarker(self->partWordBuffer,self->partWordBufferIndex)) {\n        self->flushPartWordBuffer(); self->partWordBuffer[0]=\' \'; self->partWordBuffer[1]=\' \'; self->partWordBuffer[2]=\'\\0\'; self->partWordBufferIndex=2;\n        self->partWordVisibleOffset=codepointOffset; self->nextWordContinues=true; self->flushPartWordBuffer(); self->nextWordContinues=true; self->dialogueGapPending=true;\n        if (static_cast<uint8_t>(s[i])==0xC2) i++; else i+=2; continue;\n      }\n    }\n\n    // Detect U+00A0 (non-breaking space, UTF-8: 0xC2 0xA0) or\n')
          ro(pp,'    // If we\'re about to run out of space, then cut the word off and start a new one.\n',
                '    if (self->dialogueGapPending) self->dialogueGapPending=false;\n\n    // If we\'re about to run out of space, then cut the word off and start a new one.\n')

          # --- Quoted hyphenated compounds retained ---
          hy='lib/Epub/Epub/hyphenation/Hyphenator.cpp'
          oldexp='''std::vector<Hyphenator::BreakInfo> buildExplicitBreakInfos(const std::vector<CodepointInfo>& cps) {\n  std::vector<Hyphenator::BreakInfo> breaks;\n\n  for (size_t i = 1; i + 1 < cps.size(); ++i) {\n    const uint32_t cp = cps[i].value;\n    if (!isExplicitHyphen(cp) || !isAlphabetic(cps[i - 1].value) || !isAlphabetic(cps[i + 1].value)) {\n      continue;\n    }\n    // Offset points to the next codepoint so rendering starts after the hyphen marker.\n    breaks.push_back({cps[i + 1].byteOffset, isSoftHyphen(cp)});\n  }\n\n  return breaks;\n}\n'''
          newexp='''bool isClosingQuoteBeforeHyphen(const uint32_t cp) { return cp=='"' || cp==0x00BB || cp==0x2019 || cp==0x201D; }\nstd::vector<Hyphenator::BreakInfo> buildExplicitBreakInfos(const std::vector<CodepointInfo>& cps) {\n  std::vector<Hyphenator::BreakInfo> breaks;\n  for (size_t i=1;i+1<cps.size();++i) {\n    const uint32_t cp=cps[i].value; if (!isExplicitHyphen(cp)||!isAlphabetic(cps[i+1].value)) continue;\n    size_t left=i; while(left>0 && isClosingQuoteBeforeHyphen(cps[left-1].value)) --left;\n    if(left==0 || !isAlphabetic(cps[left-1].value)) continue;\n    breaks.push_back({cps[i+1].byteOffset,isSoftHyphen(cp)});\n  } return breaks;\n}\n'''
          ro(hy,oldexp,newexp)
          ro(hy,'      std::vector<CodepointInfo> segment(cps.begin() + segStart, cps.begin() + i);\n      auto segIndexes = hyphenator.breakIndexes(segment);\n',
                '      std::vector<CodepointInfo> segment(cps.begin() + segStart, cps.begin() + i);\n      trimSurroundingPunctuationAndFootnote(segment);\n      auto segIndexes = hyphenator.breakIndexes(segment);\n')

          # --- Text settings UI: add Min. szóköz picker and rename dialogue row ---
          th='src/activities/settings/TextSettingsActivity.h'
          ro(th,'    HangingPunctuation,\n    FixedDialogueSpacing,\n','    HangingPunctuation,\n    MinimumSpace,\n    FixedDialogueSpacing,\n')
          ta='src/activities/settings/TextSettingsActivity.cpp'
          ro(ta,'        } else if (i == static_cast<int>(LayoutRow::FixedDialogueSpacing)) {\n          item.label = I18N.getLanguage() == Language::HU ? "Fix párbeszédköz" : "Fixed dialogue spacing";\n',
                '        } else if (i == static_cast<int>(LayoutRow::MinimumSpace)) {\n          item.label = I18N.getLanguage() == Language::HU ? "Min. szóköz" : "Min. word spacing";\n        } else if (i == static_cast<int>(LayoutRow::FixedDialogueSpacing)) {\n          item.label = I18N.getLanguage() == Language::HU ? "Párbeszéd javítása" : "Dialogue correction";\n')
          ro(ta,'    case LayoutRow::FixedDialogueSpacing:\n      SETTINGS.fixedDialogueSpacing = !SETTINGS.fixedDialogueSpacing;\n',
                '    case LayoutRow::MinimumSpace: {\n      const char* options[] = {"50%","60%","70%","80%","90%","100%"};\n      const int cur = std::clamp<int>((SETTINGS.minimumSpacePercent - 50) / 10, 0, 5);\n      optionPopup_.show(I18N.getLanguage() == Language::HU ? "Min. szóköz" : "Min. word spacing", options, 6, cur, [](int idx) {\n        SETTINGS.minimumSpacePercent = static_cast<uint8_t>(50 + idx * 10); SETTINGS.saveToFile();\n      }); requestUpdate(); break;\n    }\n    case LayoutRow::FixedDialogueSpacing:\n      SETTINGS.fixedDialogueSpacing = !SETTINGS.fixedDialogueSpacing;\n')
          ro(ta,'    case LayoutRow::FixedDialogueSpacing:\n      return SETTINGS.fixedDialogueSpacing ? tr(STR_STATE_ON) : tr(STR_STATE_OFF);\n',
                '    case LayoutRow::MinimumSpace:\n      return std::to_string(SETTINGS.minimumSpacePercent) + "%";\n    case LayoutRow::FixedDialogueSpacing:\n      return SETTINGS.fixedDialogueSpacing ? tr(STR_STATE_ON) : tr(STR_STATE_OFF);\n')
          PY

      - name: Verify new wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minimumSpacePercent = 100' src/CrossPointSettings.h
          grep -q 'spec.minimumSpacePercent' src/CrossPointSettings.cpp
          grep -q 'spec.fixedDialogueSpacing != fileFixedDialogueSpacing' lib/Epub/Epub/Section.cpp
          grep -q 'SECTION_FILE_VERSION = 47' lib/Epub/Epub/Section.cpp
          grep -q 'setMinimumSpacePercent' lib/Epub/Epub/ParsedText.h
          grep -q 'scaledNormalSpaceAdvance' lib/Epub/Epub/ParsedText.cpp
          grep -q 'Min. szóköz' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'Párbeszéd javítása' src/activities/settings/TextSettingsActivity.cpp
          grep -q "partWordBuffer\[1\]=' '" lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          grep -q 'isClosingQuoteBeforeHyphen' lib/Epub/Epub/hyphenation/Hyphenator.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build unit tests
        run: cmake --build build/test
      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build X4 release-candidate firmware
        run: pio run -e gh_release_rc
      - name: Check firmware size
        run: |
          python - <<'PY'
          from pathlib import Path
          fw=Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists(): raise SystemExit('firmware.bin not found')
          print(f'firmware.bin: {fw.stat().st_size} bytes ({fw.stat().st_size/1024:.1f} KiB)')
          PY
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-hungarian-1.6.0rc-x4-space-tuning-dialogue-gap
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
