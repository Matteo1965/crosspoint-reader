name: HU Picco firmware
# HU-PICCO-146 public release: tested Beta v2 font download fix and Hungarian Edition.

concurrency:
  group: hu-picco-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - picco-hungarian-edition-2.0.0
      - agent/hu-picco-129-keyboard-symbol-width
      - agent/hu-picco-141-hyphen-chapter-response
      - agent/hu-picco-145-chapter-startup
      - agent/hu-picco-146-beta2-font-fix
      - release/hu-picco-146
  workflow_dispatch:

permissions:
  contents: write

jobs:
  picco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: |
          python -m pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Refresh built-in font IDs
        run: |
          set -euo pipefail
          cd lib/EpdFont/scripts
          bash build-font-ids.sh > ../../../src/fontIds.h
          cd ../../..
          if git diff --quiet -- src/fontIds.h; then
            echo "Built-in font IDs already match the committed font headers."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "Font ID mismatch in preview; generated IDs are used for this build only."
            git diff --stat -- src/fontIds.h
          fi

      - name: Compile Picco
        run: |
          set -euo pipefail
          pio run -e picco | tee pio.log
      - name: Build and run Hungarian hyphenation unit tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test --target HyphenationEvaluationTest
          ctest --test-dir build/test -R 'HungarianHyphenation' --output-on-failure
      - name: Firmware footprint
        if: success()
        run: |
          grep -E 'RAM:|Flash:' pio.log >> "$GITHUB_STEP_SUMMARY" || true
          stat -c 'Firmware size: %s bytes' .pio/build/picco/firmware.bin >> "$GITHUB_STEP_SUMMARY"
      - name: Number Picco firmware
        if: success()
        id: artifact_name
        shell: bash
        run: |
          # Read the very same compile-time identifier used by AboutActivity.
          # Keeping one source of truth prevents the artifact name and the
          # displayed Hungarian Edition version from silently diverging.
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          ini = Path("platformio.ini").read_text(encoding="utf-8")
          picco = ini.split("[env:picco]", 1)[1].split("[env:picco-gh_release]", 1)[0]
          match = re.search(r'-DHUNGARIAN_EDITION_VERSION=\\?"(HU-PICCO-[A-Za-z0-9-]+)\\?"', picco)
          if match is None:
              raise SystemExit("HU-PICCO About version missing in picco build flags")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"name={match.group(1)}\n")
          PY
      - name: Upload Picco firmware
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: .pio/build/picco/firmware.bin
          if-no-files-found: error
      - name: Publish HU-PICCO-146 public GitHub Release
        if: success() && github.ref == 'refs/heads/release/hu-picco-146'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="hu-picco-146"
          cp .pio/build/picco/firmware.bin HU-PICCO-146-firmware.bin
          sha256sum HU-PICCO-146-firmware.bin > HU-PICCO-146-SHA256.txt
          cat > release-notes.md <<'NOTES'
          # CrossPoint Hungarian Edition – BOOX Picco HU-PICCO-146

          Public firmware release based on CrossPoint 2.0.0, with the tested Hungarian Edition enhancements.

          ## Changes
          - Restores font catalogue and GitHub-hosted font downloads with the updated FreeInk SDK (including the oversized GitHub HTTP header fix).
          - Hungarian language interface, extended Hungarian hyphenation and improved typography.
          - Bookmark dog-ear indicator without redundant confirmation popup.
          - Shows “Indexelés...” when an uncached chapter is prepared, including forward chapter transitions.
          - Keeps the cpfont metrics cache between chapter builds to avoid unnecessary SD reads.
          - About / Névjegy now shows HU-PICCO-146, matching the release filename.

          ## Installation
          Download HU-PICCO-146-firmware.bin below and flash using the BOOX Picco compatible firmware update process. Do not flash the GitHub Actions ZIP directly; extract its firmware.bin first if using Actions. Back up books and settings before updating.

          ## Known limitation
          First-time chapter indexing can still pause for a long time on some EPUBs. This release does not claim to eliminate that delay.

          ## Compatibility
          Target: BOOX Picco only. Do not use this binary for other CrossPoint devices.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite a published release" >&2
            exit 1
          fi
          gh release create "$tag" HU-PICCO-146-firmware.bin HU-PICCO-146-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CrossPoint Hungarian Edition – BOOX Picco HU-PICCO-146" \
            --notes-file release-notes.md \
            --latest=false

