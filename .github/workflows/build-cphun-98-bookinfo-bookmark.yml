name: Build CPHUN-98 BookInfo and Bookmark

on:
  push:
    branches: [agent/cphun-98-bookinfo-bookmark]
    paths:
      - '.github/workflows/build-cphun-98-bookinfo-bookmark.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-98-bookinfo-bookmark
          submodules: recursive
          fetch-depth: 0

      - name: Integrate CPHUN-98
        run: |
          if grep -q 'CPHUN-260911-97' src/CPHUNBuildId.h; then
            python3 tools/cphun98_bookinfo_bookmark_patch.py
          else
            echo 'CPHUN-98 source changes already integrated; keeping verified source.'
          fi
          git diff --check

      - name: Verify CPHUN-98 scope
        run: |
          grep -q 'CPHUN-260911-98' src/CPHUNBuildId.h
          grep -q 'addFieldGap ? 6 : 0' src/activities/reader/BookInfoActivity.cpp
          grep -q 'metadataFieldEnd.*y += 6' src/activities/reader/BookInfoActivity.cpp
          grep -q 'headerStatusClearWidth = 112' src/activities/reader/BookInfoActivity.cpp
          grep -q 'counterY = headerY' src/activities/reader/BookInfoActivity.cpp
          grep -q 'bookmarkStatusIconHeight = 16' src/components/themes/BaseTheme.cpp
          grep -q 'renderer.getScreenWidth() - bookmarkStatusIconWidth, 0' src/components/themes/BaseTheme.cpp
          ! grep -q 'bookmarkStatusIconTopCrop' src/components/themes/BaseTheme.cpp
          ! grep -q 'bookmarkStatusIconGap' src/components/themes/BaseTheme.cpp
          grep -q '0xBF, 0xFF, 0x9F, 0xFF' src/components/icons/bookmark.h

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - name: Commit verified CPHUN-98 source changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/CPHUNBuildId.h \
                    src/activities/reader/BookInfoActivity.cpp \
                    src/components/themes/BaseTheme.cpp \
                    src/components/icons/bookmark.h
            git commit -m "CPHUN-98: polish BookInfo header and bookmark marker"
            git push origin HEAD:agent/cphun-98-bookinfo-bookmark
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-98 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-98 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260911-98-BookInfo-Bookmark-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
