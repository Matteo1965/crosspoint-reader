name: Build Hungarian 1.6.0rc optical margin percentages

on:
  workflow_dispatch:
  push:
    branches: [hungarian-hyphenation]
    paths:
      - '.github/workflows/build-hungarian-optical-margin-percent.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out integrated Hungarian branch
        uses: actions/checkout@v6
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Add selectable optical margin percentages
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              assert old in s, f'marker missing in {path}: {old[:100]!r}'
              p.write_text(s.replace(old, new, 1))

          replace('src/CrossPointSettings.h',
                  '  // Optical margin / hanging punctuation (0 = off, 1 = on).\n  uint8_t hangingPunctuation = 0;\n',
                  '  // Optical margin / hanging punctuation percentage: 0, 25, 50, 75 or 100.\n  uint8_t hangingPunctuation = 75;\n')

          replace('src/CrossPointSettings.cpp',
                  '  hangingPunctuation = clamp(doc["hangingPunctuation"] | (uint8_t)0, (uint8_t)2, (uint8_t)0);\n',
                  '''  const uint8_t storedHangingPunctuation = doc["hangingPunctuation"] | (uint8_t)75;\n  if (storedHangingPunctuation == 1) {\n    // Migrate the previous On/Off implementation: On meant 50%.\n    hangingPunctuation = 50;\n    needsResave = true;\n  } else if (storedHangingPunctuation == 0 || storedHangingPunctuation == 25 || storedHangingPunctuation == 50 ||\n             storedHangingPunctuation == 75 || storedHangingPunctuation == 100) {\n    hangingPunctuation = storedHangingPunctuation;\n  } else {\n    hangingPunctuation = 75;\n    needsResave = true;\n  }\n''')

          replace('src/CrossPointSettings.cpp',
                  '''  // Keep at least one physical margin pixel untouched; cap optical overhang at 6 px.\n  spec.hangingPunctuationLimitPx = hangingPunctuation\n                                       ? static_cast<uint8_t>(std::min<int>(6, std::max<int>(0, screenMargin - 1)))\n                                       : 0;\n''',
                  '''  // Pack percentage step (high nibble: 1=25% .. 4=100%) and pixel cap (low nibble).\n  // At 5 px margin keep one physical pixel untouched; from 10 px upward allow up to 8 px.\n  const uint8_t hangingPixelLimit = screenMargin >= 10 ? 8 : static_cast<uint8_t>(std::max<int>(0, screenMargin - 1));\n  spec.hangingPunctuationLimitPx = hangingPunctuation\n                                       ? static_cast<uint8_t>(((hangingPunctuation / 25) << 4) | hangingPixelLimit)\n                                       : 0;\n''')

          replace('lib/Epub/Epub/ParsedText.cpp',
                  '''int hangingPunctuationAllowance(const GfxRenderer& renderer, const int fontId, const std::string& word,\n                                const EpdFontFamily::Style style, const uint8_t limitPx) {\n  if (limitPx == 0 || word.empty() || !isHangingPunctuation(lastCodepoint(word))) return 0;\n  size_t lastStart = word.size() - 1;\n  while (lastStart > 0 && (static_cast<uint8_t>(word[lastStart]) & 0xC0) == 0x80) --lastStart;\n  const int fullAdvance = renderer.getTextAdvanceX(fontId, word.c_str(), style);\n  const std::string prefix = word.substr(0, lastStart);\n  const int prefixAdvance = prefix.empty() ? 0 : renderer.getTextAdvanceX(fontId, prefix.c_str(), style);\n  const int punctuationAdvance = std::max(0, fullAdvance - prefixAdvance);\n  const int halfAdvance = (punctuationAdvance + 1) / 2;\n  return std::min<int>(limitPx, halfAdvance);\n}\n''',
                  '''int hangingPunctuationAllowance(const GfxRenderer& renderer, const int fontId, const std::string& word,\n                                const EpdFontFamily::Style style, const uint8_t packedSetting) {\n  const uint8_t percentStep = packedSetting >> 4;\n  const uint8_t pixelLimit = packedSetting & 0x0F;\n  if (percentStep == 0 || pixelLimit == 0 || word.empty() || !isHangingPunctuation(lastCodepoint(word))) return 0;\n  size_t lastStart = word.size() - 1;\n  while (lastStart > 0 && (static_cast<uint8_t>(word[lastStart]) & 0xC0) == 0x80) --lastStart;\n  const int fullAdvance = renderer.getTextAdvanceX(fontId, word.c_str(), style);\n  const std::string prefix = word.substr(0, lastStart);\n  const int prefixAdvance = prefix.empty() ? 0 : renderer.getTextAdvanceX(fontId, prefix.c_str(), style);\n  const int punctuationAdvance = std::max(0, fullAdvance - prefixAdvance);\n  const int proportionalAdvance = (punctuationAdvance * std::min<int>(percentStep, 4) + 3) / 4;\n  return std::min<int>(pixelLimit, proportionalAdvance);\n}\n''')

          replace('src/activities/settings/TextSettingsActivity.cpp',
                  '''      // Paragraph spacing and optical margin toggle; the rest open a picker.\n      return (ringPos() - 1 == static_cast<int>(LayoutRow::ParaSpacing) ||\n              ringPos() - 1 == static_cast<int>(LayoutRow::HangingPunctuation))\n                 ? tr(STR_TOGGLE)\n                 : tr(STR_SELECT);\n''',
                  '''      // Paragraph spacing toggles; optical margin cycles through selectable percentages.\n      return ringPos() - 1 == static_cast<int>(LayoutRow::ParaSpacing) ? tr(STR_TOGGLE) : tr(STR_SELECT);\n''')

          replace('src/activities/settings/TextSettingsActivity.cpp',
                  '''    case LayoutRow::HangingPunctuation:\n      SETTINGS.hangingPunctuation = !SETTINGS.hangingPunctuation;\n      SETTINGS.saveToFile();\n      requestUpdate();\n      break;\n''',
                  '''    case LayoutRow::HangingPunctuation:\n      switch (SETTINGS.hangingPunctuation) {\n        case 0:\n          SETTINGS.hangingPunctuation = 25;\n          break;\n        case 25:\n          SETTINGS.hangingPunctuation = 50;\n          break;\n        case 50:\n          SETTINGS.hangingPunctuation = 75;\n          break;\n        case 75:\n          SETTINGS.hangingPunctuation = 100;\n          break;\n        default:\n          SETTINGS.hangingPunctuation = 0;\n          break;\n      }\n      SETTINGS.saveToFile();\n      requestUpdate();\n      break;\n''')

          replace('src/activities/settings/TextSettingsActivity.cpp',
                  '''    case LayoutRow::HangingPunctuation:\n      return SETTINGS.hangingPunctuation ? tr(STR_STATE_ON) : tr(STR_STATE_OFF);\n''',
                  '''    case LayoutRow::HangingPunctuation:\n      return SETTINGS.hangingPunctuation ? std::to_string(SETTINGS.hangingPunctuation) + "%" : tr(STR_STATE_OFF);\n''')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CrossPointSettings.h src/CrossPointSettings.cpp lib/Epub/Epub/ParsedText.cpp src/activities/settings/TextSettingsActivity.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'Add selectable hanging punctuation percentages'
            git push origin HEAD:agent/hungarian-integrated-v1.6.0rc
          fi

      - name: Install clang-format 21
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -sc)/ llvm-toolchain-$(lsb_release -sc)-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-21
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-21 100

      - name: Normalize formatting and commit
        run: |
          ./bin/clang-format-fix
          git add src/CrossPointSettings.h src/CrossPointSettings.cpp lib/Epub/Epub/ParsedText.cpp src/activities/settings/TextSettingsActivity.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'Format optical margin percentage changes'
            git push origin HEAD:agent/hungarian-integrated-v1.6.0rc
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build X4 release-candidate firmware
        run: pio run -e gh_release_rc

      - name: Check firmware size
        run: |
          python - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists(): raise SystemExit('firmware.bin not found')
          size = fw.stat().st_size
          print(f'firmware.bin: {size} bytes ({size / 1024:.1f} KiB)')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: crosspoint-hungarian-1.6.0rc-x4-optical-margin-percent
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
