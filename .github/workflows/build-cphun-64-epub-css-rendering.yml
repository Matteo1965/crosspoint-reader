name: Build CPHUN-64 EPUB CSS Rendering

on:
  push:
    branches: [agent/cphun-64-epub-css-rendering]
    paths:
      - '.github/workflows/build-cphun-64-epub-css-rendering.yml'
      - '.github/scripts/cphun64_integrate.sh'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-64-epub-css-rendering
          submodules: recursive
          fetch-depth: 0

      - name: Integrate EPUB CSS rendering fixes
        run: |
          cp lib/Epub/Epub/ParsedText.cpp /tmp/CPHUN-ParsedText.cpp
          bash .github/scripts/cphun64_integrate.sh
          cp /tmp/CPHUN-ParsedText.cpp lib/Epub/Epub/ParsedText.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/Epub/Epub/ParsedText.cpp')
          s = p.read_text()
          old = '    wordContinues[idx] = true;  // Prevent page breaker from splitting the Group Ruby!'
          new = ('    wordContinues[idx] = true;       // Prevent page breaker from splitting the Group Ruby!\n'
                 '    wordNoSpaceBefore[idx] = false;  // Ensure allowsBreak returns false!')
          if 'wordNoSpaceBefore[idx] = false;  // Ensure allowsBreak returns false!' not in s:
              if old not in s:
                  raise SystemExit('ParsedText ruby group anchor missing')
              s = s.replace(old, new, 1)
          for marker in ('ParsedText::minimumSpacePercent_', 'ParsedText::shortHyphenEnabled_',
                         'ParsedText::opticalMarginEnabled_', 'wordNoSpaceBefore[idx] = false'):
              if marker not in s:
                  raise SystemExit(f'ParsedText preservation failed: {marker}')
          p.write_text(s)
          PY
          git diff --check

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-64 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release_rc/firmware.bin

      - name: Push validated Build 64 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-64: integrate EPUB CSS rendering fixes"
          fi
          git push origin HEAD:agent/cphun-64-epub-css-rendering

      - name: Upload CPHUN-64 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260907-64-EPUB-CSS-Rendering-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
