name: Build Hungarian 1.6.0rc Parser dialogue correction

'on':
  workflow_dispatch:
  push:
    branches: [hungarian-hyphenation]
    paths:
      - '.github/workflows/build-hungarian-1.6.0rc-parser-dialogue-fix.yml'

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current integrated Hungarian source
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Apply parser dialogue correction and quoted compound hyphenation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          header = 'lib/Epub/Epub/parsers/ChapterHtmlSlimParser.h'
          replace_once(
              header,
              '  bool nextWordContinues = false;  // true when next flushed word attaches to previous (inline element boundary)\n',
              '  bool nextWordContinues = false;  // true when next flushed word attaches to previous (inline element boundary)\n'
              '  bool dialogueGapPending = false;  // paragraph-opening dialogue dash consumed; preserve one fixed gap\n')

          parser = 'lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp'
          replace_once(
              parser,
              "bool isWhitespace(const char c) { return c == ' ' || c == '\\r' || c == '\\n' || c == '\\t'; }\n",
              "bool isWhitespace(const char c) { return c == ' ' || c == '\\r' || c == '\\n' || c == '\\t'; }\n\n"
              "bool normalizeOpeningDialogueMarker(char* buffer, int& len) {\n"
              "  if (len <= 0) return false;\n"
              "  buffer[len] = '\\0';\n"
              "  const auto* ptr = reinterpret_cast<const unsigned char*>(buffer);\n"
              "  const uint32_t cp = utf8NextCodepoint(&ptr);\n"
              "  if (*ptr != 0) return false;\n"
              "  if (cp != '-' && cp != 0x2013 && cp != 0x2014 && cp != 0x2212) return false;\n"
              "  buffer[0] = static_cast<char>(0xE2);\n"
              "  buffer[1] = static_cast<char>(0x80);\n"
              "  buffer[2] = static_cast<char>(0x93);  // U+2013 EN DASH\n"
              "  len = 3;\n"
              "  return true;\n"
              "}\n")

          replace_once(
              parser,
              'void ChapterHtmlSlimParser::startNewTextBlock(const BlockStyle& blockStyle) {\n  nextWordContinues = false;  // New block = new paragraph, no continuation\n',
              'void ChapterHtmlSlimParser::startNewTextBlock(const BlockStyle& blockStyle) {\n  nextWordContinues = false;  // New block = new paragraph, no continuation\n  dialogueGapPending = false;\n')

          old_ws = '''    if (isWhitespace(s[i])) {\n      // Currently looking at whitespace, if there's anything in the partWordBuffer, flush it\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n      // Whitespace is a real word boundary — reset continuation state\n      self->nextWordContinues = false;\n      // Skip the whitespace char\n      continue;\n    }\n'''
          new_ws = '''    if (isWhitespace(s[i])) {\n      bool openingDialogueGap = false;\n      if (self->fixedDialogueSpacing && self->currentTextBlock && self->currentTextBlock->isEmpty() &&\n          self->partWordBufferIndex > 0) {\n        openingDialogueGap = normalizeOpeningDialogueMarker(self->partWordBuffer, self->partWordBufferIndex);\n      }\n\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n\n      if (openingDialogueGap) {\n        // Do not materialize the source whitespace as a separate token. The next real\n        // word attaches to the normalized en dash with a normal-width gap that is\n        // neither breakable nor stretchable by justification.\n        self->dialogueGapPending = true;\n        self->nextWordContinues = true;\n      } else if (self->dialogueGapPending) {\n        // Collapse additional source whitespace while preserving the one fixed gap.\n        self->nextWordContinues = true;\n      } else {\n        self->nextWordContinues = false;\n      }\n      continue;\n    }\n'''
          replace_once(parser, old_ws, new_ws)

          old_nbsp = '''    if (static_cast<uint8_t>(s[i]) == 0xC2 && i + 1 < len && static_cast<uint8_t>(s[i + 1]) == 0xA0) {\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n\n      self->partWordBuffer[0] = ' ';\n      self->partWordBuffer[1] = '\\0';\n      self->partWordBufferIndex = 1;\n      self->partWordVisibleOffset = codepointOffset;\n      self->nextWordContinues = true;  // Attach space to previous word (no break).\n      self->flushPartWordBuffer();\n\n      self->nextWordContinues = true;  // Next real word attaches to this space (no break).\n\n      i++;  // Skip the second byte (0xA0)\n      continue;\n    }\n'''
          new_nbsp = '''    if (static_cast<uint8_t>(s[i]) == 0xC2 && i + 1 < len && static_cast<uint8_t>(s[i + 1]) == 0xA0) {\n      bool openingDialogueGap = false;\n      if (self->fixedDialogueSpacing && self->currentTextBlock && self->currentTextBlock->isEmpty() &&\n          self->partWordBufferIndex > 0) {\n        openingDialogueGap = normalizeOpeningDialogueMarker(self->partWordBuffer, self->partWordBufferIndex);\n      }\n      if (openingDialogueGap || self->dialogueGapPending) {\n        if (self->partWordBufferIndex > 0) self->flushPartWordBuffer();\n        self->dialogueGapPending = true;\n        self->nextWordContinues = true;\n        i++;\n        continue;\n      }\n\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n\n      self->partWordBuffer[0] = ' ';\n      self->partWordBuffer[1] = '\\0';\n      self->partWordBufferIndex = 1;\n      self->partWordVisibleOffset = codepointOffset;\n      self->nextWordContinues = true;\n      self->flushPartWordBuffer();\n      self->nextWordContinues = true;\n\n      i++;\n      continue;\n    }\n'''
          replace_once(parser, old_nbsp, new_nbsp)

          old_nnbsp = '''    if (static_cast<uint8_t>(s[i]) == 0xE2 && i + 2 < len && static_cast<uint8_t>(s[i + 1]) == 0x80 &&\n        static_cast<uint8_t>(s[i + 2]) == 0xAF) {\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n\n      self->partWordBuffer[0] = ' ';\n      self->partWordBuffer[1] = '\\0';\n      self->partWordBufferIndex = 1;\n      self->partWordVisibleOffset = codepointOffset;\n      self->nextWordContinues = true;\n      self->flushPartWordBuffer();\n\n      self->nextWordContinues = true;\n\n      i += 2;  // Skip the remaining two bytes (0x80 0xAF)\n      continue;\n    }\n'''
          new_nnbsp = '''    if (static_cast<uint8_t>(s[i]) == 0xE2 && i + 2 < len && static_cast<uint8_t>(s[i + 1]) == 0x80 &&\n        static_cast<uint8_t>(s[i + 2]) == 0xAF) {\n      bool openingDialogueGap = false;\n      if (self->fixedDialogueSpacing && self->currentTextBlock && self->currentTextBlock->isEmpty() &&\n          self->partWordBufferIndex > 0) {\n        openingDialogueGap = normalizeOpeningDialogueMarker(self->partWordBuffer, self->partWordBufferIndex);\n      }\n      if (openingDialogueGap || self->dialogueGapPending) {\n        if (self->partWordBufferIndex > 0) self->flushPartWordBuffer();\n        self->dialogueGapPending = true;\n        self->nextWordContinues = true;\n        i += 2;\n        continue;\n      }\n\n      if (self->partWordBufferIndex > 0) {\n        self->flushPartWordBuffer();\n      }\n\n      self->partWordBuffer[0] = ' ';\n      self->partWordBuffer[1] = '\\0';\n      self->partWordBufferIndex = 1;\n      self->partWordVisibleOffset = codepointOffset;\n      self->nextWordContinues = true;\n      self->flushPartWordBuffer();\n      self->nextWordContinues = true;\n\n      i += 2;\n      continue;\n    }\n'''
          replace_once(parser, old_nnbsp, new_nnbsp)

          replace_once(
              parser,
              '''    // If we're about to run out of space, then cut the word off and start a new one.\n''',
              '''    if (self->dialogueGapPending) {\n      // The first non-space byte belongs to the spoken word. Keep nextWordContinues\n      // armed for its eventual flush, but the special whitespace-collapse state is done.\n      self->dialogueGapPending = false;\n    }\n\n    // If we're about to run out of space, then cut the word off and start a new one.\n''')

          hyph = 'lib/Epub/Epub/hyphenation/Hyphenator.cpp'
          old_explicit = '''std::vector<Hyphenator::BreakInfo> buildExplicitBreakInfos(const std::vector<CodepointInfo>& cps) {\n  std::vector<Hyphenator::BreakInfo> breaks;\n\n  for (size_t i = 1; i + 1 < cps.size(); ++i) {\n    const uint32_t cp = cps[i].value;\n    if (!isExplicitHyphen(cp) || !isAlphabetic(cps[i - 1].value) || !isAlphabetic(cps[i + 1].value)) {\n      continue;\n    }\n    // Offset points to the next codepoint so rendering starts after the hyphen marker.\n    breaks.push_back({cps[i + 1].byteOffset, isSoftHyphen(cp)});\n  }\n\n  return breaks;\n}\n'''
          new_explicit = '''bool isClosingQuoteBeforeHyphen(const uint32_t cp) {\n  switch (cp) {\n    case '\"':\n    case 0x00BB:  // »\n    case 0x2019:  // ’\n    case 0x201D:  // ”\n      return true;\n    default:\n      return false;\n  }\n}\n\nstd::vector<Hyphenator::BreakInfo> buildExplicitBreakInfos(const std::vector<CodepointInfo>& cps) {\n  std::vector<Hyphenator::BreakInfo> breaks;\n\n  for (size_t i = 1; i + 1 < cps.size(); ++i) {\n    const uint32_t cp = cps[i].value;\n    if (!isExplicitHyphen(cp) || !isAlphabetic(cps[i + 1].value)) continue;\n\n    size_t left = i;\n    while (left > 0 && isClosingQuoteBeforeHyphen(cps[left - 1].value)) --left;\n    if (left == 0 || !isAlphabetic(cps[left - 1].value)) continue;\n\n    breaks.push_back({cps[i + 1].byteOffset, isSoftHyphen(cp)});\n  }\n\n  return breaks;\n}\n'''
          replace_once(hyph, old_explicit, new_explicit)

          old_segment = '''    if (i > segStart) {\n      std::vector<CodepointInfo> segment(cps.begin() + segStart, cps.begin() + i);\n      auto segIndexes = hyphenator.breakIndexes(segment);\n'''
          new_segment = '''    if (i > segStart) {\n      std::vector<CodepointInfo> segment(cps.begin() + segStart, cps.begin() + i);\n      trimSurroundingPunctuationAndFootnote(segment);\n      auto segIndexes = hyphenator.breakIndexes(segment);\n'''
          replace_once(hyph, old_segment, new_segment)

          settings = 'src/activities/settings/TextSettingsActivity.cpp'
          replace_once(settings,
                       'item.label = I18N.getLanguage() == Language::HU ? "Fix párbeszédköz" : "Fixed dialogue spacing";',
                       'item.label = I18N.getLanguage() == Language::HU ? "Párbeszéd javítása" : "Dialogue correction";')

          section = 'lib/Epub/Epub/Section.cpp'
          replace_once(section, 'SECTION_FILE_VERSION = 44', 'SECTION_FILE_VERSION = 46')
          PY

      - name: Verify parser-level fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'dialogueGapPending' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.h
          grep -q 'normalizeOpeningDialogueMarker' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          grep -q 'openingDialogueGap || self->dialogueGapPending' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          grep -q 'Párbeszéd javítása' src/activities/settings/TextSettingsActivity.cpp
          grep -q 'isClosingQuoteBeforeHyphen' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q 'trimSurroundingPunctuationAndFootnote(segment)' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q 'SECTION_FILE_VERSION = 46' lib/Epub/Epub/Section.cpp
          grep -q 'SETTINGS.fixedDialogueSpacing != 0' src/util/DictHtmlPages.cpp
          grep -q 'STR_TOGGLE_BOOKMARK: "Könyvjelző jelölés"' lib/I18n/translations/hungarian.yaml
          grep -q 'simpleRender' lib/Epub/Epub/blocks/TextBlock.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build X4 release-candidate firmware
        run: pio run -e gh_release_rc

      - name: Check firmware size
        run: |
          python - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          size = fw.stat().st_size
          print(f'firmware.bin: {size} bytes ({size / 1024:.1f} KiB)')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-hungarian-1.6.0rc-x4-parser-dialogue-correction
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
