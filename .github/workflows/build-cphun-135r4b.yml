name: Build CPHUN-135r4b Edit Footnotes Keyboard

on:
  push:
    branches:
      - agent/cphun-135r4b-edit-footnotes-keyboard
    paths:
      - '.github/workflows/build-cphun-135r4b.yml'
      - 'tools/cphun135r4b_edit_footnotes_keyboard_patch.py'
      - 'tools/cphun135r4b_patch_driver.py'
      - 'tools/cphun135r4b_patch_driver_v2.py'
      - 'src/activities/reader/FootnotePopupActivity.cpp'
      - 'src/activities/reader/FootnotePopupActivity.h'
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-135r4b-edit-footnotes-keyboard
          submodules: recursive
          fetch-depth: 0

      - name: Apply CPHUN-110 through 131 patches
        run: |
          python3 tools/cphun110_cover_dither_clean_patch.py
          python3 tools/cphun111_cover_4gray_floyd_patch.py
          python3 tools/cphun112_cover_grayscale_pass_patch.py
          python3 tools/cphun113_letter_spacing_scale_patch.py
          python3 tools/cphun114_letter_spacing_scale_patch.py
          python3 tools/cphun116_letter_spacing_scale_patch.py
          python3 tools/cphun117_non_linear_scale_patch.py 2>/dev/null || python3 tools/cphun117_letter_spacing_scale_patch.py
          python3 tools/cphun118_fixedpoint_optimization_patch.py
          python3 tools/cphun119_fixedpoint_pair_tuning_patch.py
          python3 tools/cphun120_fixedpoint_intensity_patch.py
          python3 tools/cphun121_native_pair_advance_patch.py
          python3 tools/cphun123_ink_edge_right_margin_patch.py
          python3 tools/cphun124_dark_ink_edge_patch.py
          python3 tools/cphun125_roundedraff_text_settings_layout_patch.py
          python3 tools/cphun126_new_dogear_patch.py
          python3 tools/cphun127_roundedraff_list_fit_patch.py
          python3 tools/cphun128_letter_spacing_profiles_patch.py
          python3 tools/cphun129_dictionary_bookinfo_ui_patch.py
          python3 tools/cphun130_notoserif16_spacing_optimization_patch.py
          python3 tools/cphun131_hyphenation_threshold_patch.py

      - name: Apply CPHUN-132 through r4 and CPHUN-133
        run: |
          sed -i 's/SECTION_FILE_VERSION = 57/SECTION_FILE_VERSION = 56/' lib/Epub/Epub/Section.cpp
          python3 tools/cphun132_word_highlights_patch.py
          python3 tools/cphun132r2_highlight_visibility_lookup_fix.py
          python3 tools/cphun132r3_toggle_notfound_fix.py
          python3 tools/cphun132r4_bookmarks_export_ui_lookup_fix.py
          python3 tools/cphun133_button_action_categories_patch.py

      - name: Normalize r2 lookup block for r5 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/activities/reader/DictionaryWordSelectActivity.cpp')
          s = p.read_text()
          pattern = re.compile(
              r'  bool found = ok && dict\.lookup\(words\[selected\]\.text, definition, headword, &result\);\n'
              r'  if \(!found && ok && result == Dictionary::LookupResult::ReadError\) \{\n'
              r'    vTaskDelay\(1\);\n'
              r'    definition\.clear\(\);\n'
              r'    headword\.clear\(\);\n'
              r'    result = Dictionary::LookupResult::NotFound;\n'
              r'    found = dict\.lookup\(words\[selected\]\.text, definition, headword, &result\);\n'
              r'  \}\n'
          )
          replacement = ('  // CPHUN-89: selected word first. Exact context headwords are alternatives.\n'
                         '  const bool found = ok && dict.lookup(words[selected].text, definition, headword, &result);\n')
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'r2 lookup block not found for r5 normalization: {n}')
          p.write_text(s2)
          PY

      - name: Apply CPHUN-132r5 review fixes
        run: python3 tools/cphun132r5_review_fixes.py

      - name: Restore one retry for r5 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/activities/reader/DictionaryWordSelectActivity.cpp')
          s = p.read_text()
          pattern = re.compile(r'(?m)^\s*const bool found = ok && dict\.lookup\(lookupWord\.c_str\(\), definition, headword, &result\);$')
          replacement = '''  bool found = ok && dict.lookup(lookupWord.c_str(), definition, headword, &result);
          if (!found && ok && result == Dictionary::LookupResult::ReadError) {
            vTaskDelay(1);
            definition.clear();
            headword.clear();
            result = Dictionary::LookupResult::NotFound;
            found = dict.lookup(lookupWord.c_str(), definition, headword, &result);
          }'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'r5 logical lookup line not found for retry restore: {n}')
          p.write_text(s2)
          PY

      - name: Apply CPHUN-132r6 through r9
        run: |
          python3 tools/cphun132r6_dictionary_guard_ui_fix.py
          python3 tools/cphun132r7_dictionary_index32_lookup_fix.py
          python3 tools/cphun132r8_page_boundary_dictionary_fix.py
          python3 tools/cphun132r9_lookup_hard_deadline_fix.py

      - name: Apply CPHUN-134 fix
        run: python3 tools/cphun134_deferred_notfound_prompt_fix.py

      - name: Apply CPHUN-135r1 base
        run: python3 tools/cphun135r1_patch_driver.py

      - name: Apply CPHUN-135r2 keyboard-only patch
        run: python3 tools/cphun135r2_keyboard_delete_patch.py

      - name: Apply CPHUN-135r3 UI and Hungarian split-word fixes
        run: python3 tools/cphun135r3_ui_hu_hyphen_selection_patch.py

      - name: Apply CPHUN-128B Bitter 60 multi-size experiment
        run: python3 tools/cphun128b_bitter60_multisize_experiment.py

      - name: Apply CPHUN-135r4a points 1 2 6 7 8
        run: python3 tools/cphun135r4a_selection_keyboard_patch.py

      - name: Apply CPHUN-135r4b additions
        run: python3 tools/cphun135r4b_patch_driver_v2.py

      - name: Finalize cache version
        run: sed -i 's/SECTION_FILE_VERSION = 57/SECTION_FILE_VERSION = 61/' lib/Epub/Epub/Section.cpp

      - name: Verify CPHUN-135r4b
        run: |
          git diff --check
          grep -F 'CPHUN-260917-135R4B-EXP' src/CPHUNBuildId.h
          grep -F "self->nextWordContinues = false;" lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          grep -F 'trimAdjacentSpace' src/highlights/TextEditStore.h
          grep -F 'KIJELÖLÉS: aktuális gomb használata' src/activities/util/KeyboardEntryActivity.cpp
          grep -F 'TÖRLÉS HOSSZAN: teljes szó törlése' src/activities/util/KeyboardEntryActivity.cpp
          grep -F 'FootnotePopupActivity' src/activities/reader/EpubReaderActivity.cpp
          grep -F 'NOTOSERIF_14_FONT_ID' src/activities/reader/FootnotePopupActivity.cpp
          grep -F 'fitDictionaryMenuValue' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -F 'SECTION_FILE_VERSION = 61' lib/Epub/Epub/Section.cpp
          python3 - <<'PY'
          from pathlib import Path
          import re

          reader = Path('src/activities/reader/EpubReaderActivity.cpp').read_bytes()
          if b'\x00' in reader:
              raise SystemExit('EpubReaderActivity.cpp still contains NUL bytes')
          reader_text = reader.decode('utf-8')
          if 'initialText = old->replacementText;' not in reader_text:
              raise SystemExit('CPHUN-135r4b edit reopen semantics missing')
          if 'keyboard->text, keyboard->text.empty()' not in reader_text:
              raise SystemExit('CPHUN-135r4b empty replacement/delete semantics missing')
          if 'ensureBookFootnotes();' not in reader_text:
              raise SystemExit('CPHUN-135r4b lazy footnote index entry point missing')

          keyboard = Path('src/activities/util/HungarianKeyboardLayout.h').read_text(encoding='utf-8')
          if not re.search(r'SYMBOL_LAYOUT\s*\{\s*SYMBOL_ROWS\s*,\s*5\s*\}', keyboard):
              raise SystemExit('CPHUN-135r4b 5-row fn SYMBOL_LAYOUT missing')
          if not re.search(r'SYMBOL2_LAYOUT\s*\{\s*SYMBOL2_ROWS\s*,\s*5\s*\}', keyboard):
              raise SystemExit('CPHUN-135r4b 5-row fn SYMBOL2_LAYOUT missing')
          if 'HUKS("fn", fui::KeyKind::Mode' not in keyboard:
              raise SystemExit('CPHUN-135r4b fn mode key missing')
          print('Semantic verification passed')
          PY

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-135r4b firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-135r4b firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260917-135R4B-EXP-firmware
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
