name: Build CPHUN-62R4 All Text Tabs 40px

on:
  push:
    branches: [agent/cphun-62r4-all-text-tabs-40px]
    paths: ['.github/workflows/build-cphun-62r4-all-text-tabs-40px.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CPHUN_BUILD_ID: CPHUN-260906-62R4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-62r4-all-text-tabs-40px
          submodules: recursive
          fetch-depth: 0

      - name: Apply 40px row height to all Text Settings tabs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/activities/settings/TextSettingsActivity.cpp')
          s = p.read_text()

          # Replace the Layout-only row-height block while tolerating indentation.
          pattern = re.compile(
              r'(?m)^\s*if \(tab_ == Tab::Layout\) \{\s*\n'
              r'\s*props\.rowHeight = 40;\s*\n'
              r'\s*props\.rowGap = 0;\s*\n'
              r'\s*\}\s*\n'
          )
          replacement = '  props.rowHeight = 40;\n  props.rowGap = 0;\n'
          s2, n = pattern.subn(replacement, s, count=1)
          if n == 0:
              # Idempotent reruns are allowed if the global block is already present.
              if '  props.rowHeight = 40;\n  props.rowGap = 0;\n' not in s:
                  raise SystemExit('Missing Text Settings row-height block')
              s2 = s
          s = s2

          old_call = 'syncTabListViewport(screen, props, false, tab_ == Tab::Layout ? 40 : 0);'
          new_call = 'syncTabListViewport(screen, props, false, 40);'
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          elif new_call not in s:
              raise SystemExit('Missing Text Settings viewport override call')

          p.write_text(s)

          Path('src/CPHUNBuildId.h').write_text(
              '#pragma once\n\n#define CPHUN_BUILD_ID "CPHUN-260906-62R4"\n')
          PY

          grep -F 'props.rowHeight = 40;' src/activities/settings/TextSettingsActivity.cpp
          grep -F 'props.rowGap = 0;' src/activities/settings/TextSettingsActivity.cpp
          grep -F 'syncTabListViewport(screen, props, false, 40);' src/activities/settings/TextSettingsActivity.cpp
          if grep -F 'tab_ == Tab::Layout ? 40 : 0' src/activities/settings/TextSettingsActivity.cpp; then
            echo 'Layout-only row-height override still present'
            exit 1
          fi
          grep -F 'int16_t rowHeightOverride = 0' src/activities/UiTabListActivity.h
          grep -F 'if (rowHeightOverride > 0)' src/activities/UiTabListActivity.cpp
          grep -F 'rowHeight = rowHeightOverride;' src/activities/UiTabListActivity.cpp
          grep -F '#define CPHUN_BUILD_ID "CPHUN-260906-62R4"' src/CPHUNBuildId.h

          python3 - <<'PY'
          from pathlib import Path
          s = Path('platformio.ini').read_text()
          for env in ('gh_release', 'gh_release_rc'):
              start = s.index(f'[env:{env}]')
              end = s.find('\n[', start + 1)
              block = s[start:end if end != -1 else len(s)]
              if block.count('-DCROSSPOINT_WAIT_FOR_USB_SERIAL') != 1:
                  raise SystemExit(f'{env}: USB serial wait flag missing or duplicated')
          main = Path('src/main.cpp').read_text()
          for needle in ('CROSSPOINT_WAIT_FOR_USB_SERIAL', 'delay(250);', 'Serial.begin(115200);'):
              if needle not in main:
                  raise SystemExit(f'USB serial regression guard failed: {needle}')
          PY

          git diff --check

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-62R4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release_rc/firmware.bin

      - name: Push validated Build 62R4 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activities/settings/TextSettingsActivity.cpp src/CPHUNBuildId.h
          if ! git diff --cached --quiet; then
            git commit -m "CPHUN-62R4: use 40px rows on all Text Settings tabs"
            git push origin HEAD:agent/cphun-62r4-all-text-tabs-40px
          fi

      - name: Upload CPHUN-62R4 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260906-62R4-All-Text-Tabs-40px-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
