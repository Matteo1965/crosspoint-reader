name: Build CPHUN-260830-36 2x + Refined Margins Test

on:
  push:
    branches:
      - agent/cphun-260830-36-button-actions
    paths:
      - '.github/build-triggers/cphun-260830-36.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  CPHUN_BUILD_ID: CPHUN-260830-36
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout CPHUN-36 branch
        uses: actions/checkout@v4
        with:
          ref: agent/cphun-260830-36-button-actions
          submodules: recursive
          fetch-depth: 0

      - name: Apply safe CPHUN-36 2x v2 integration
        run: python3 tools/cphun_36_double_click_v2.py

      - name: Apply refined CPHUN-36 margin profile
        run: python3 tools/cphun_36_margin_profile.py

      - name: Verify CPHUN-36 input safety and refined margins
        run: |
          set -euo pipefail
          grep -q 'CPHUN-260830-36' src/CPHUNBuildId.h
          grep -q 'U"rossz", U"indulat"' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q 'U"rossz", U"íz"' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q 'HungarianRosszCompoundBoundaries' test/hyphenation_eval/HyphenationEvaluationTest.cpp
          grep -q 'HungarianCompoundBoundaryCorrections' test/hyphenation_eval/HyphenationEvaluationTest.cpp
          grep -q 'CPHUN-36 2x front-button test v2' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'cphun36OpenSettings' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'TextSettingsActivity::Tab::Layout' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'SCREEN_MARGIN_MIN = 10' src/CrossPointSettings.h
          grep -q 'SCREEN_MARGIN_MAX = 24' src/CrossPointSettings.h
          grep -q 'SCREEN_MARGIN_STEP = 2' src/CrossPointSettings.h
          grep -q 'verticalScreenMargin' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'static_cast<int>(SETTINGS.screenMargin) - 4' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Button::Power' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Button::PageBack' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Button::PageForward' src/activities/reader/EpubReaderActivity.cpp
          ! grep -q 'Suppress the legacy press path' src/activities/reader/EpubReaderActivity.cpp
          git diff --check

      - name: Configure unit tests
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test -j2

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Upload CPHUN-260830-36 refined margins firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260830-36-2x-Refined-Margins-Test-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
