name: Build CPHUN 260826-09 next package

'on':
  push:
    branches: [agent/hungarian-v1.6.0rc-next-integration]
    paths: ['.github/workflows/build-cphun-260826-09.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tested RC baseline
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-v1.6.0rc-qf14
          fetch-depth: 0
          submodules: recursive

      - name: Generate unique CPHUN build id
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="CPHUN-v1.6.0rc-$(TZ=Europe/Budapest date +%y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Build id: $BUILD_ID"

      - name: Reapply proven CPHUN 260826-08 package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/hungarian-v1.6.0rc-next-integration:refs/remotes/origin/agent/hungarian-v1.6.0rc-next-integration
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap
          workflow = subprocess.check_output([
              'git','show','origin/agent/hungarian-v1.6.0rc-next-integration:.github/workflows/build-cphun-260826-08.yml'
          ], text=True)
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if len(blocks) < 3:
              raise SystemExit(f'Expected at least 3 patch Python blocks in -08, found {len(blocks)}')
          for i, block in enumerate(blocks[:3], 1):
              path = Path(f'/tmp/cphun08-{i}.py')
              path.write_text(textwrap.dedent(block), encoding='utf-8')
              subprocess.run(['python', str(path)], check=True)
          PY

      - name: Apply next package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re

          # Margins: 10 / 12 / 14 / 16 / 18 / 20 / 22 px.
          p = Path('src/CrossPointSettings.h')
          t = p.read_text(encoding='utf-8')
          for old, new in (
              ('static constexpr uint8_t SCREEN_MARGIN_MIN = 4;', 'static constexpr uint8_t SCREEN_MARGIN_MIN = 10;'),
              ('static constexpr uint8_t SCREEN_MARGIN_MAX = 32;', 'static constexpr uint8_t SCREEN_MARGIN_MAX = 22;'),
              ('static constexpr uint8_t SCREEN_MARGIN_STEP = 4;', 'static constexpr uint8_t SCREEN_MARGIN_STEP = 2;'),
          ):
              if t.count(old) != 1:
                  raise SystemExit(f'CrossPointSettings.h marker not unique: {old}')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # Keep only '-' as floating punctuation; 20% steps/default 100% are inherited.
          # Reserve exactly the outermost 1 px as a safety band. At narrow margins the
          # allowed overhang is capped here, so the right edge cannot enter that last pixel.
          p = Path('src/CrossPointSettings.cpp')
          t = p.read_text(encoding='utf-8')
          if 'SETTINGS.screenMargin - 2' in t:
              t = t.replace('SETTINGS.screenMargin - 2', 'SETTINGS.screenMargin - 1')
          elif 'screenMargin - 2' in t:
              t = t.replace('screenMargin - 2', 'screenMargin - 1')
          else:
              raise SystemExit('CrossPointSettings.cpp: hanging punctuation safety marker not found')
          p.write_text(t, encoding='utf-8')

          ver = Path('src/activities/settings/CrossPointVersionActivity.cpp')
          v = ver.read_text(encoding='utf-8')

          # Remove redundant hard-coded base version.
          v, n = re.subn(r'\n\s*drawLabelValue\(tr\(STR_BASE_VERSION\),\s*"1\.6\.0rc"\);', '', v, count=1)
          if n != 1:
              raise SystemExit(f'Base-version line removal count={n}')

          # Replace the old labelled CPHUN line by a single self-describing CPHUN id.
          build_id = os.environ['BUILD_ID']
          old_ids = re.findall(r'CPHUN-(?:v1\.6\.0rc-)?\d{6}-\d+', v)
          if old_ids:
              old_id = old_ids[0]
              labelled = f'    drawLabelValue("CPHUN", "{old_id}");\n'
              if labelled in v:
                  v = v.replace(labelled, f'    drawWrapped(UI_12_FONT_ID, "{build_id}");\n', 1)
              else:
                  v = v.replace(old_id, build_id, 1)
          else:
              marker = '    drawLabelValue(tr(STR_CROSSPOINT_VERSION), CROSSPOINT_VERSION);\n'
              if marker not in v:
                  raise SystemExit('CrossPoint version marker missing')
              v = v.replace(marker, marker + f'    drawWrapped(UI_12_FONT_ID, "{build_id}");\n', 1)

          # Hungarian dictionary page title + Hungarian-specific dictionary handling note.
          marker = '    drawParagraph(StrId::STR_DICTIONARY_REQUIRED, true);\n'
          if marker not in v:
              raise SystemExit('Dictionary page marker missing')
          v = v.replace(marker, '''    if (I18N.getLanguage() == Language::HU) {
      drawWrapped(UI_12_FONT_ID, "Szótár telepítése szükséges", true);
      y += bodyLineHeight;
      drawWrapped(UI_12_FONT_ID, "Javított magyar szótárkezelés", true);
      y += bodyLineHeight;
      drawWrapped(UI_10_FONT_ID,
                  "A magyar nyelvhez külön továbbfejlesztett szótárkezelés ragozott és toldalékolt szóalakok esetén is segíti a megfelelő szótári címszó megtalálását.");
      y += bodyLineHeight;
    } else {
      drawParagraph(StrId::STR_DICTIONARY_REQUIRED, true);
    }
''', 1)

          # Hungarian hyphenation attribution.
          marker = '    drawParagraph(StrId::STR_HYPHENATION_LANGUAGES_NOTICE);\n'
          if marker not in v:
              raise SystemExit('Hyphenation language notice marker missing')
          v = v.replace(marker, '''    if (I18N.getLanguage() == Language::HU) {
      drawWrapped(UI_12_FONT_ID,
                  "A magyar elválasztás Nagy Bence Huhyphn elválasztási mintáira épül, amelyeket saját kiegészítéseinkkel és továbbfejlesztéseinkkel bővítettünk.");
      y += bodyLineHeight;
    } else {
      drawParagraph(StrId::STR_HYPHENATION_LANGUAGES_NOTICE);
    }
''', 1)
          ver.write_text(v, encoding='utf-8')

          # Shorter wording on the version page / translations.
          old = 'Hiányzó párbeszédköz automatikus pótlása'
          new = 'Hiányzó párbeszédközök pótlása'
          for root in (Path('src'), Path('lib')):
              for f in root.rglob('*'):
                  if not f.is_file() or f.suffix.lower() not in {'.cpp','.h','.hpp','.yaml','.yml','.json','.txt'}:
                      continue
                  try:
                      s = f.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in s:
                      f.write_text(s.replace(old, new), encoding='utf-8')

          # Invalidate cached parsed sections after layout changes.
          sec = Path('lib/Epub/Epub/Section.cpp')
          s = sec.read_text(encoding='utf-8')
          m = re.search(r'constexpr uint8_t SECTION_FILE_VERSION = (\d+);', s)
          if not m:
              raise SystemExit('Section.cpp: SECTION_FILE_VERSION not found')
          cur = int(m.group(1))
          s = s[:m.start()] + f'constexpr uint8_t SECTION_FILE_VERSION = {cur + 1};' + s[m.end():]
          sec.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SCREEN_MARGIN_MIN = 10' src/CrossPointSettings.h
          grep -q 'SCREEN_MARGIN_MAX = 22' src/CrossPointSettings.h
          grep -q 'SCREEN_MARGIN_STEP = 2' src/CrossPointSettings.h
          grep -q 'hangingPunctuation = 100' src/CrossPointSettings.h
          grep -q '"20%", "40%", "60%", "80%", "100%"' src/activities/settings/TextSettingsActivity.cpp
          grep -q "return cp == '-'" lib/Epub/Epub/ParsedText.cpp
          grep -q 'screenMargin - 1' src/CrossPointSettings.cpp
          grep -q 'hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 1, 2)' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          grep -q 'preferredLanguageIsHungarian()' lib/Epub/Epub/hyphenation/Hyphenator.h
          grep -q 'openingDialogueDash' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          ! grep -q 'drawLabelValue(tr(STR_BASE_VERSION)' src/activities/settings/CrossPointVersionActivity.cpp
          ! grep -q 'drawLabelValue("CPHUN"' src/activities/settings/CrossPointVersionActivity.cpp
          grep -q "$BUILD_ID" src/activities/settings/CrossPointVersionActivity.cpp
          grep -q 'Szótár telepítése szükséges' src/activities/settings/CrossPointVersionActivity.cpp
          grep -q 'Javított magyar szótárkezelés' src/activities/settings/CrossPointVersionActivity.cpp
          grep -q 'Nagy Bence Huhyphn' src/activities/settings/CrossPointVersionActivity.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build unit tests
        run: cmake --build build/test
      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"
      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc
      - name: Show firmware size
        run: |
          python - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          size = fw.stat().st_size
          print(f'firmware.bin: {size} bytes ({size / 1024:.1f} KiB)')
          PY
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ID }}-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
