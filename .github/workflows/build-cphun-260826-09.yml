name: Build CPHUN-260826-09 Integration

on:
  push:
    branches:
      - agent/hungarian-v1.6.0rc-next-integration

permissions:
  contents: write

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hungarian-v1.6.0rc-next-integration
          submodules: recursive
          fetch-depth: 0

      - name: Consolidate approved source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Margins + new default optical-margin percentage.
          p = Path('src/CrossPointSettings.h')
          s = p.read_text()
          s = s.replace('// Optical margin / hanging punctuation percentage: 0, 25, 50, 75 or 100.\n  uint8_t hangingPunctuation = 75;',
                        '// Optical margin / floating hyphenation percentage: 0, 20, 40, 60, 80 or 100.\n  uint8_t hangingPunctuation = 100;')
          s = s.replace('static constexpr uint8_t SCREEN_MARGIN_MIN = 5;', 'static constexpr uint8_t SCREEN_MARGIN_MIN = 4;')
          s = s.replace('static constexpr uint8_t SCREEN_MARGIN_MAX = 40;', 'static constexpr uint8_t SCREEN_MARGIN_MAX = 32;')
          s = s.replace('static constexpr uint8_t SCREEN_MARGIN_STEP = 5;', 'static constexpr uint8_t SCREEN_MARGIN_STEP = 4;')
          p.write_text(s)

          # 2) Text-settings picker: Off / 20 / 40 / 60 / 80 / 100, default stored as 100.
          p = Path('src/activities/settings/TextSettingsActivity.cpp')
          s = p.read_text()
          old = '''    case LayoutRow::HangingPunctuation: {\n      const char* options[] = {tr(STR_STATE_OFF), "25%", "50%", "75%", "100%"};\n      const int cur = SETTINGS.hangingPunctuation == 0 ? 0 : std::clamp<int>(SETTINGS.hangingPunctuation / 25, 1, 4);\n      optionPopup_.show(I18N.getLanguage() == Language::HU ? "Optikai margó" : "Hanging punctuation", options, 5, cur,\n                        [](int idx) {\n                          SETTINGS.hangingPunctuation = static_cast<uint8_t>(idx * 25);\n                          SETTINGS.saveToFile();\n                        });\n'''
          new = '''    case LayoutRow::HangingPunctuation: {\n      const char* options[] = {tr(STR_STATE_OFF), "20%", "40%", "60%", "80%", "100%"};\n      const int cur = SETTINGS.hangingPunctuation == 0 ? 0 : std::clamp<int>(SETTINGS.hangingPunctuation / 20, 1, 5);\n      optionPopup_.show(I18N.getLanguage() == Language::HU ? "Optikai margó" : "Hanging punctuation", options, 6, cur,\n                        [](int idx) {\n                          SETTINGS.hangingPunctuation = static_cast<uint8_t>(idx * 20);\n                          SETTINGS.saveToFile();\n                        });\n'''
          if old not in s:
              raise SystemExit('TextSettingsActivity: hanging punctuation picker pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Renderer: only the visible ASCII hyphen may hang. Pack as 3-bit 0..5 percentage step + 5-bit px cap.
          p = Path('lib/Epub/Epub/ParsedText.cpp')
          s = p.read_text()
          old = '''bool isHangingPunctuation(const uint32_t cp) {\n  switch (cp) {\n    case '.':\n    case ',':\n    case ';':\n    case ':':\n    case '!':\n    case '?':\n    case '-':\n    case 0x2019:  // ’\n    case 0x201D:  // ”\n    case 0x00BB:  // »\n      return true;\n    default:\n      return false;\n  }\n}\n'''
          new = '''bool isHangingPunctuation(const uint32_t cp) { return cp == '-'; }\n'''
          if old not in s:
              raise SystemExit('ParsedText: hanging character list pattern not found')
          s = s.replace(old, new, 1)
          old2 = '''  const uint8_t percentStep = packedSetting >> 4;\n  const uint8_t pixelLimit = static_cast<uint8_t>((packedSetting & 0x0F) * 4);\n  if (percentStep == 0 || pixelLimit == 0 || word.empty()) return 0;'''
          new2 = '''  const uint8_t percentStep = packedSetting >> 5;\n  const uint8_t pixelLimit = static_cast<uint8_t>(packedSetting & 0x1F);\n  if (percentStep == 0 || pixelLimit == 0 || word.empty()) return 0;'''
          if old2 not in s:
              raise SystemExit('ParsedText: packed hanging setting pattern not found')
          s = s.replace(old2, new2, 1)
          s = s.replace('const int proportionalAdvance = (punctuationAdvance * std::min<int>(percentStep, 4) + 3) / 4;',
                        'const int proportionalAdvance = (punctuationAdvance * std::min<int>(percentStep, 5) + 4) / 5;')
          p.write_text(s)

          # 4) Producer(s): repack selected 20%-step and exact margin-2 px into ReaderRenderSpec byte.
          # Preserve the lhs object name and replace only the RHS assignment.
          changed = []
          rx = re.compile(r'(\b[A-Za-z_][A-Za-z0-9_]*\.hangingPunctuationLimitPx\s*=\s*)[^;]+;')
          replacement = r'''\1static_cast<uint8_t>(((SETTINGS.hangingPunctuation / 20) << 5) | (SETTINGS.screenMargin > 2 ? SETTINGS.screenMargin - 2 : 0));'''
          for root in (Path('src'), Path('lib')):
              for f in root.rglob('*'):
                  if f.suffix not in ('.cpp', '.h'):
                      continue
                  txt = f.read_text(errors='ignore')
                  if 'hangingPunctuationLimitPx' not in txt:
                      continue
                  out, n = rx.subn(replacement, txt)
                  if n:
                      f.write_text(out)
                      changed.append((str(f), n))
          if not changed:
              raise SystemExit('No ReaderRenderSpec hangingPunctuationLimitPx producer assignment found')
          print('Repacked producers:', changed)
          PY

          echo '--- hangingPunctuation references after consolidation ---'
          grep -R -n --include='*.cpp' --include='*.h' 'hangingPunctuation' src lib | head -80
          git diff --check

      - name: Verify integration package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SCREEN_MARGIN_MIN = 4' src/CrossPointSettings.h
          grep -q 'SCREEN_MARGIN_MAX = 32' src/CrossPointSettings.h
          grep -q 'SCREEN_MARGIN_STEP = 4' src/CrossPointSettings.h
          grep -q 'hangingPunctuation = 100' src/CrossPointSettings.h
          grep -q '"20%", "40%", "60%", "80%", "100%"' src/activities/settings/TextSettingsActivity.cpp
          grep -q "return cp == '-'" lib/Epub/Epub/ParsedText.cpp
          grep -q 'packedSetting >> 5' lib/Epub/Epub/ParsedText.cpp
          grep -q 'packedSetting & 0x1F' lib/Epub/Epub/ParsedText.cpp
          grep -q 'SETTINGS.screenMargin - 2' $(grep -R -l 'hangingPunctuationLimitPx.*SETTINGS' src lib | head -1)
          grep -q 'hungarianHyphenator(hu_patterns, isLatinLetter, toLowerLatin, 1, 2)' lib/Epub/Epub/hyphenation/LanguageRegistry.cpp
          grep -q 'hungarianWhitespaceNormalization' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Show firmware size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fw = Path('.pio/build/gh_release_rc/firmware.bin')
          if not fw.exists():
              raise SystemExit('firmware.bin not found')
          print(f'firmware.bin: {fw.stat().st_size} bytes ({fw.stat().st_size / 1024:.1f} KiB)')
          PY

      - name: Upload CPHUN-260826-09 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260826-09-Integration-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error

      - name: Commit validated consolidated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Matteo"
          git config user.email "atafoto@gmail.com"
          rm -f .github/workflows/build-cphun-260826-09.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: consolidate Hungarian integration build 09"
            git push origin HEAD:agent/hungarian-v1.6.0rc-next-integration
          fi
