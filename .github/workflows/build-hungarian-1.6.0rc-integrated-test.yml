name: Build Hungarian 1.6.0rc Targeted Parser Reflow

'on':
  workflow_dispatch:
  push:
    branches:
      - hungarian-hyphenation
    paths:
      - '.github/workflows/build-hungarian-1.6.0rc-integrated-test.yml'
      - '.github/scripts/apply_integrated_typography_test.py'
      - '.github/scripts/apply_hanging_ratios.py'
      - '.github/scripts/apply_typography_round2_fixes.py'
      - '.github/scripts/apply_paragraph_final_remainder_guard.py'
      - '.github/scripts/apply_minspace_finalhyphen_and_responsive_font_reflow.py'
      - '.github/scripts/apply_responsive_font_reflow_offset_fix.py'
      - '.github/scripts/apply_font_reflow_background_scheduler_fix.py'
      - '.github/scripts/apply_targeted_parser_timeslice_reflow.py'

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out integrated Hungarian source
        uses: actions/checkout@v4
        with:
          ref: agent/hungarian-integrated-v1.6.0rc
          fetch-depth: 0
          submodules: recursive

      - name: Prepare integrated typography patches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hungarian-hyphenation
          git show origin/hungarian-hyphenation:.github/workflows/build-hungarian-1.6.0rc-parser-dialogue-fix.yml > /tmp/base-workflow.yml
          git show origin/hungarian-hyphenation:.github/workflows/build-hungarian-1.6.0rc-space-tuning-v2.yml > /tmp/space-v2.yml
          git show origin/hungarian-hyphenation:.github/workflows/build-hungarian-1.6.0rc-space-indexing-version.yml > /tmp/current-rc.yml
          git show origin/hungarian-hyphenation:.github/scripts/apply_integrated_typography_test.py > /tmp/apply_integrated_typography_test.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_hanging_ratios.py > /tmp/apply_hanging_ratios.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_typography_round2_fixes.py > /tmp/apply_typography_round2_fixes.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_paragraph_final_remainder_guard.py > /tmp/apply_paragraph_final_remainder_guard.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_minspace_finalhyphen_and_responsive_font_reflow.py > /tmp/apply_minspace_finalhyphen_and_responsive_font_reflow.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_responsive_font_reflow_offset_fix.py > /tmp/apply_responsive_font_reflow_offset_fix.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_font_reflow_background_scheduler_fix.py > /tmp/apply_font_reflow_background_scheduler_fix.py
          git show origin/hungarian-hyphenation:.github/scripts/apply_targeted_parser_timeslice_reflow.py > /tmp/apply_targeted_parser_timeslice_reflow.py

      - name: Apply integrated typography and reflow patches
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_integrated_typography_test.py
          python3 /tmp/apply_hanging_ratios.py
          python3 /tmp/apply_typography_round2_fixes.py
          python3 /tmp/apply_paragraph_final_remainder_guard.py
          python3 /tmp/apply_minspace_finalhyphen_and_responsive_font_reflow.py
          python3 /tmp/apply_responsive_font_reflow_offset_fix.py
          python3 /tmp/apply_font_reflow_background_scheduler_fix.py
          python3 /tmp/apply_targeted_parser_timeslice_reflow.py
          git diff --check

      - name: Verify targeted parser reflow behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'availableWidth + hyphenHangingAllowance' lib/Epub/Epub/ParsedText.cpp
          grep -q 'repairedByHyphenation' lib/Epub/Epub/ParsedText.cpp
          grep -q 'remainderLetterCount <= 2' lib/Epub/Epub/ParsedText.cpp
          ! grep -q 'hasLaterAutomaticBreak' lib/Epub/Epub/ParsedText.cpp
          grep -q 'filterShortHungarianAutomaticBreaks' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          grep -q 'buildTowardVisibleTextOffset' lib/Epub/Epub/Section.h
          grep -q 'budgetMs == 0 || millis() - startMs < budgetMs' lib/Epub/Epub/Section.cpp
          grep -q 'RESPONSIVE_REFLOW_PARSE_BUDGET_MS = 12' src/activities/reader/EpubReaderActivity.h
          grep -Fq 'section->buildTowardVisibleTextOffset(*offsetJump, RESPONSIVE_REFLOW_PARSE_BUDGET_MS)' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'targetDirectedBackground' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'BACKGROUND_BUILD_PAGES_PER_TICK = 1' src/activities/reader/EpubReaderActivity.h
          grep -q 'BACKGROUND_BUILD_IDLE_MS = 250' src/activities/reader/EpubReaderActivity.h
          grep -q 'readerInputPending = mappedInput.wasAnyPressed() || mappedInput.wasAnyReleased()' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Responsive font reflow targeting visible offset' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'minimumSpacePercent = 100' src/CrossPointSettings.h

      - name: Configure unit tests
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build/test

      - name: Run unit tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build X4 integrated release-candidate firmware
        run: .venv/bin/pio run -e gh_release_rc

      - name: Check firmware size
        run: |
          test -f .pio/build/gh_release_rc/firmware.bin
          ls -lh .pio/build/gh_release_rc/firmware.bin

      - name: Upload targeted parser reflow firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-hungarian-1.6.0rc-x4-targeted-parser-reflow
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
