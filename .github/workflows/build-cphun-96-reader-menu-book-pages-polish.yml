name: Build CPHUN-96 Reader Menu Book Pages Polish

on:
  push:
    branches: [agent/cphun-96-reader-menu-book-pages-polish]
    paths:
      - '.github/workflows/build-cphun-96-reader-menu-book-pages-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrate-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-96-reader-menu-book-pages-polish
          submodules: recursive
          fetch-depth: 0

      - name: Integrate CPHUN-96 reader polish
        run: |
          if grep -q 'CPHUN-260911-95' src/CPHUNBuildId.h; then
            python3 tools/cphun96_reader_polish_patch.py
          else
            echo 'CPHUN-96 source changes already integrated; keeping verified source.'
          fi
          git diff --check

      - name: Verify CPHUN-96 scope
        run: |
          grep -q 'CPHUN-260911-96' src/CPHUNBuildId.h
          grep -q 'Borító megjelenítése' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q 'switchLabel' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q '"Olvasás", "Könyv"' src/activities/reader/EpubReaderMenuActivity.cpp
          grep -q 'startOnBookTab' src/activities/reader/EpubReaderMenuActivity.h
          grep -q 'openReaderMenu(true)' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'NOTOSERIF_14_FONT_ID' src/activities/reader/BookInfoActivity.cpp
          grep -q 'breakOffsetsForLanguageExtended(token, false, "hu")' src/activities/reader/BookInfoActivity.cpp
          grep -q 'text_ += "\\n\\n"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'ButtonNavigator' src/activities/reader/BookInfoActivity.h
          grep -q 'Címkék:' src/activities/reader/BookInfoActivity.cpp
          grep -q 'Fájl formátum:' src/activities/reader/BookInfoActivity.cpp
          grep -q 'mappedInput.mapLabels("Vissza"' src/activities/reader/BookInfoActivity.cpp
          grep -q 'skipped_spines.bin' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'isCompleteAsciiListMarker' lib/Epub/Epub/ParsedText.cpp
          grep -q 'findExactHeadwords' src/activities/reader/DictionaryWordSelectActivity.cpp

      - name: Unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j2
          ctest --test-dir build/test --output-on-failure -j2

      - name: Commit verified CPHUN-96 source changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/CPHUNBuildId.h \
                    src/activities/reader/EpubReaderMenuActivity.h src/activities/reader/EpubReaderMenuActivity.cpp \
                    src/activities/reader/EpubReaderActivity.h src/activities/reader/EpubReaderActivity.cpp \
                    src/activities/reader/BookInfoActivity.h src/activities/reader/BookInfoActivity.cpp
            git commit -m "CPHUN-96: polish reader tabs and book information pages"
            git push origin HEAD:agent/cphun-96-reader-menu-book-pages-polish
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-96 firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-96 firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260911-96-Reader-Menu-Book-Pages-Polish-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
