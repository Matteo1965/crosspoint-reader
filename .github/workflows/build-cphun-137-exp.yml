name: Build CPHUN-137 EXP

on:
  push:
    branches:
      - agent/cphun-135r4b-edit-footnotes-keyboard
    paths:
      - '.github/workflows/build-cphun-137-exp.yml'
      - 'tools/build_cphun137_exp.sh'
      - 'tools/cphun137_bitter_score_threshold_patch.py'
      - 'lib/Epub/Epub/BitterSpacingScores.h'
      - 'tools/data/Bitter12-18_spacing_scores.csv'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-135r4b-edit-footnotes-keyboard
          submodules: recursive
          fetch-depth: 0

      - name: Apply and verify CPHUN-137 EXP
        run: bash tools/build_cphun137_exp.sh

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"

      - name: Build CPHUN-137 EXP firmware
        run: .venv/bin/pio run -e gh_release

      - name: Report firmware size
        run: stat -c 'firmware.bin bytes=%s' .pio/build/gh_release/firmware.bin

      - name: Upload CPHUN-137 EXP firmware
        uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260918-137-EXP-Bitter-Score-Threshold-FW
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error
          retention-days: 90
