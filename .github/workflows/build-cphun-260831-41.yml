name: Build CPHUN-260831-41 Final Test Bundle

on:
  push:
    branches: [agent/cphun-260831-36-button-functions-menu]
    paths: ['.github/build-triggers/cphun-260831-41.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  CPHUN_BUILD_ID: CPHUN-260831-41
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cphun-260831-36-button-functions-menu
          submodules: recursive
          fetch-depth: 0
      - run: python3 tools/cphun_37_full_button_functions.py
      - run: python3 tools/cphun_39_button_ui_and_double_fallback.py
      - run: python3 tools/cphun_40_button_ui_row_geometry.py
      - run: python3 tools/cphun_36_double_click_v2.py
      - run: python3 tools/cphun_41_configurable_gestures.py
      - run: python3 tools/cphun_36_margin_profile.py
      - run: python3 tools/cphun_37_button_functions_foundation.py
      - name: Promote build identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/CPHUNBuildId.h'); s=p.read_text()
          s=s.replace('#define CPHUN_BUILD_ID "CPHUN-260831-37"','#define CPHUN_BUILD_ID "CPHUN-260831-41"')
          p.write_text(s)
          PY
      - name: Verify CPHUN-41
        run: |
          set -euo pipefail
          grep -q 'CPHUN-260831-41' src/CPHUNBuildId.h
          grep -q 'kButtonX = 125' src/activities/settings/ButtonFunctionsActivity.cpp
          grep -q 'Hosszú:' src/activities/settings/ButtonFunctionsActivity.cpp
          grep -q 'const int rowStep = rowHeight + rowGap;' src/activities/settings/ButtonFunctionsActivity.cpp
          grep -q 'Kiterjesztett elválasztás' src/activities/settings/ButtonFunctionsActivity.cpp
          grep -q 'ReaderButtonGesture::Single' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'ReaderButtonGesture::Double' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'ReaderButtonGesture::Hold' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Button::Power' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Button::PageBack' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'Button::PageForward' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'extraParagraphSpacingEnabled ? extraParagraphSpacing : static_cast<uint8_t>(255)' src/CrossPointSettings.cpp
          grep -q 'paragraphOverrideEnabled = extraParagraphSpacing != 255' lib/Epub/Epub/ParsedText.cpp
          grep -q 'extraParagraphSpacing > 0 && extraParagraphSpacing <= 100' lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
          grep -q 'appendSegmentPatternBreaks(cps, \*hyphenator, /\*includeFallback=\*/false, explicitBreakInfos)' lib/Epub/Epub/hyphenation/Hyphenator.cpp
          python3 - <<'PY'
          from pathlib import Path
          r=Path('src/activities/reader/EpubReaderActivity.cpp').read_text(encoding='utf-8')
          a=r.index('  const auto cphun36GestureAction')
          b=r.index('  const auto cphun36LegacyShort', a)
          block=r[a:b]
          if 'return;' in block:
              raise SystemExit('No-value return survived in bool gesture dispatcher')
          if '-> bool' not in block:
              raise SystemExit('Gesture dispatcher lost explicit bool return type')
          print('CPHUN-41 bool/input/render/hyphen invariants verified')
          PY
          git diff --check
      - run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/test -j2
      - run: ctest --test-dir build/test --output-on-failure -j2
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false
      - run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --python .venv/bin/python -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14"
      - run: .venv/bin/pio run -e gh_release_rc
      - uses: actions/upload-artifact@v4
        with:
          name: CPHUN-260831-41-Final-Test-Bundle-FW
          path: .pio/build/gh_release_rc/firmware.bin
          if-no-files-found: error
          retention-days: 90
